# data_etl_app/pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data_etl_app"                                                            # name of your FastAPI app package
version = "0.1.0"
description = "Data ETL application with FastAPI wrapper and standalone scripts"
# readme = "../../README.md"                           # or wherever you want to point
requires-python = ">=3.12"

# Runtime dependencies for your app
dependencies = [
  "aiofiles>=23.1.0",        # Async file operations
  "python-multipart>=0.0.9",

  "rdflib>=7.0.0",          # RDF library
  "email_validator>=2.0.0",
  "ijson>=3.1.4",

  # Tell pip that llm_providers, litellm_proxy_app, core and scraper are also dependencies:
  "llm_providers>=0.1.0",
  "litellm_proxy_app>=0.1.0",
  "core>=0.1.0",
  "scraper>=0.1.0",
  "googlemaps>=4.10.0",

]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=3.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
