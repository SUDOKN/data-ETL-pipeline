profile: |
  101 Machine, Inc. is a small CNC job shop / prototype machine shop in Cary, NC that performs custom CNC turning, milling, and general machining (drilling, tapping, boring, threading, etc.) on a wide range of metals and plastics, made to each customer's own spec rather than sold as catalog products. The site is a brochure- style capabilities site (home, turning/milling/machining capability pages, a materials list, an FAQ, contact info, and a short new-equipment announcement) with no listed catalog products, standards, or certifications.
