profile: |
  Taylor-Dunn (a brand operated by Waev Inc., headquartered in Anaheim, CA) makes electric utility, burden-carrier, personnel-carrier, and stock-chasing vehicles sold through a dealer network to warehouses/manufacturing sites, campuses, government facilities, parks, and hospitality/aviation venues. The scrape is degenerate: all 30 crawled URLs return byte-identical body content — the site's cookie-consent/privacy-policy boilerplate plus the global nav menu — so no page ever rendered its actual product, material, process, or certification copy; every entry below is built only from nav labels and the corporate footer, which is why most fields are near-empty rather than padded to a target count.
