subject: steelcraft.com
field: process_caps
expected:
- name: Welding (frame/assembly welding)
  evidence: welded for installation as a complete unit
  strength: strong
- name: Lamination / core bonding to steel face sheets
  evidence: The continuous bonding of the laminated core to steel face sheets provides an attractive,
    flat door
  strength: strong
- name: Engraining and staining (GRAINTECH wood-look finish)
  evidence: Our exclusive engraining and staining process simulates a wide variety of wood finishes
  strength: strong
- name: Factory finish painting (baked-on primer, custom colors)
  evidence: Steelcraft not only offers a wide selection of standard finish paint colors, but will also
    create customized colors
  strength: strong
- name: Die-mitering (corner connections)
  evidence: Die-mitered corner connections at the head and jamb insure an attractive, tight and closed
    mitered connection
  strength: moderate
- name: Stitch welding
  evidence: may be stitch welded and filled, which is proven to be more structurally sound than continuously
    welded edges
  strength: moderate
- name: Embossing (door panel embossment)
  evidence: Available in high definition embossment 2-panel designs (HD2 square; HD2A rounded top edge)
  strength: moderate
- name: Cutting, notching and mitering of stick frame components
  evidence: Components are cut to length, notched and/or mitered, assembled and welded into assemblies
  strength: moderate
- name: Polishing and etching (stainless door finishes)
  evidence: custom doors are available in a wide range of polished and etched finishes
  strength: moderate
- name: Door/frame modification (light cutouts, hardware preps, reinforcing)
  evidence: wide variety of doors and frames modifications, from light cutouts to function hole preps
    on doors to reinforcing and welding
  strength: moderate
