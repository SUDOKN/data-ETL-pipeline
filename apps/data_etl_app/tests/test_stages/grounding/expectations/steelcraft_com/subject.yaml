profile: |
  Steelcraft is a manufacturer of hollow metal (steel) commercial doors and frames, founded in 1933 in Cincinnati, Ohio, and owned since 2013 by Allegion plc, a global door-hardware/security conglomerate whose sibling brands (Schlage, Von Duprin, LCN, Falcon, CISA, Interflex) recur throughout the site as bundled-hardware suppliers or cross-brand redirects. It serves institutional, commercial and industrial building markets (schools, hospitals, hotels, offices, detention facilities, government buildings) through a large catalog of named door and frame series (T, L, SL, B, A14, CE, LS, H, Paladin, GRAINTECH, INPACT, plus F/FN/FE/DE/DW/K/C/CK/MU/FS/KS/MS frame families) with dedicated application pages for fire rating, windstorm (tornado/hurricane), sound transmission control, and healthcare. This is a manufacturer catalog/spec-sheet site, not a job-shop portfolio, with heavy literature/download listings (data sheets, technical manuals, lookup tools) and three US manufacturing/service locations (Blue Ash OH main plant, Chino CA, Kansas City KS).
