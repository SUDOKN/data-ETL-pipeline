profile: |
  Austin Companies (doing business as Austin Electric Services, and including sibling brands Austin HVAC, Austin Concrete, and Austin Integration) is a residential trade contractor based in Glendale, Arizona that performs electrical wiring, HVAC installation, post-tensioned concrete foundation work, and low-voltage/home-security system installation for new-construction production homebuilders in the Phoenix, Prescott, and Tucson areas. The Austin Integration division also resells and installs branded third-party security hardware (cameras, sensors, smart panels) as bundled packages and monthly add-on services. This is a corporate/careers portfolio site, and it is fully bilingual: nearly every English page (services, "who we are," leadership bios, careers, job listings, privacy policy) has a matching Spanish translation under /es/ that repeats the same facts almost verbatim, so most entities appear twice, once per language — the notable exception is the Security Systems section, which has no Spanish version at all.
