profile: |
  Shenzhen Alec Model Co., Ltd. ("Alec Model" / "ALEC"), headquartered in Shenzhen, China, is a contract manufacturer offering CNC machining, 3D printing, sheet metal fabrication, urethane casting, injection molding, and die casting on a made-to-spec basis for engineering clients worldwide. The site is a services/capabilities brochure plus a large blog of client case studies and company-news posts (new certifications, facility expansions, trade-show appearances); it carries no catalog-product listing, and legal boilerplate (cookie policy, terms) makes up a sizable share of the crawl.
