  name: NACE MR0175
  status: confirmed
  acceptable_forms:
  - NACE MR0175
  - NACE approved
  evidence:
  - quote: In addition to limiting the hardness, NACE MR0175 restricts the age hardening cycles that can be applied
      to the alloy to two of the several
    approx_offset: 78814
  - quote: The grade is approved by NACE MR0175 supplied to 22 HRC for packers and other sub-surface equipment.
    approx_offset: 20181
  notes: 'SCOPE: a MATERIAL standard, not a site certificate - it appears on 12 alloy datasheet pages as the sour-service
    approval status of the grade Howco stocks. The most frequent standard in the file after ISO 9001'
  provenance:
  - action: added
    by: seed-agent-howcogroup-com
    date: '2026-08-27'
    source: corpus-seed
  - action: amended
    by: verify-agent-howcogroup
    date: '2026-08-27'
    reason: 'SUBSTRING ARTEFACT: the bare form ''NACE'' (4 chars, bare containment) is a substring of ''furnace''
      - ''furnace'', ''furnaces'' and ''vacuum furnace'' all occur here, and any such return would credit NACE MR0175.
      Dropping the bare form loses nothing: a returned ''NACE'' is still contained in ''NACE MR0175'' and credits.'
  - action: ported
    by: port_corpus.py
    date: '2026-08-29'
    source: markdown-cutover
