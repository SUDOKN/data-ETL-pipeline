    approx_offset: 103325
  - quote: 'UNS N06625: ASTM B446 & B564'
    approx_offset: 18203
  - quote: 'UNS N07718 : ASTM B637 GRADE 630 AMS 5662, 5663 & 5664'
    approx_offset: 49327
  notes: 'the nickel-alloy supply standards cited across the Alloy 625/718/825/28/625-Plus datasheets: B425, B446,
    B564, B637, B423, B805. ''ASTM B668'' is deliberately NOT an acceptable form: line 3150 is a scrape run-on,
    ''ASTM B668GENERAL SCOPE'', so no word-boundary matcher can find it'
