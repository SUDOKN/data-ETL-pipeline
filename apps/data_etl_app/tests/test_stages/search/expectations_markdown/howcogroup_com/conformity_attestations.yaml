    reason: 'MISSING DESIGNATION: the Alloy 825 & Alloy 28 tube page prints ''UNS N08825 : ASTM B423 UNS N080287
      : ASTM B668GENERAL SCOPE'' - ASTM B668 is a seventh B-series standard in this bundle and was absent from the
      forms, so a correct return of it could never credit. Note the scrape glues ''B668'' to ''GENERAL SCOPE'',
      which is probably why it was missed.'
  - action: ported
    by: port_corpus.py
    date: '2026-08-29'
