false_friends:
- form: Selective Laser Melting
  reason: ZERO occurrences. The old pipeline minted this process out of the machine model name 'SLM280'/'SLM500'
    (lines 285-293). The process the text actually names is 'direct metal laser melting, or DMLM' (6527)
- form: Casting
  reason: ZERO occurrences. No casting operation is described anywhere; 'cast' appears only as 'targeted cast analysis'
    (1778, 1958, 5207, 5346), a chemistry-selection practice, and as 'cast live votes' in a CSR post
- form: Stamping
  reason: zero occurrences
- form: Extrusion
  reason: zero occurrences
- form: Broaching
  reason: zero occurrences; pulled by the dense deep-hole/boring/skiving vocabulary
- form: Anodizing
  reason: zero occurrences; pulled by the coating-facility page, whose real processes are phosphating, shot blasting
    and resin/PTFE spray coatings
- form: Material Handling
  reason: '''Material Handling up to 26,000kgs'' (1099) is a crane/lifting CAPACITY figure on the sawing page, not
    an operation performed on the work'
- form: Inventory Management
  reason: '''INVENTORY MANAGEMENT'' (4122) is a commercial consignment-stock service, not an operation performed
    on materials or parts'
