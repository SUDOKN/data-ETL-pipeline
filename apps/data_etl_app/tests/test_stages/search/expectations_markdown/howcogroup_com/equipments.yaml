false_friends:
- form: CMM
  reason: the equipments clause explicitly excludes equipment that 'only measures, inspects, or tests the work'.
    Two CMMs are named (LK Evolution 3000x2000x1500mm and LK G-90C, lines 3310-3311) plus an in-house CMM at 1897.
    The capability is seeded under process_caps as 'CMM dimensional inspection'. This exact confusion produced a
    FALSE RED on the alecmfg set
- form: LK Evolution
  reason: a coordinate measuring machine brand/model (3310); measures the work, so excluded from equipments by the
    clause
- form: HandySCAN Black Elite
  reason: a Creaform 3D scanner (2176-2181); it measures and inspects, it does not act on the work. Its capability
    is seeded under process_caps as '3D scanning'
- form: Shadow Graph
  reason: an optical comparator for thread profiles and contours (3312); metrology, excluded by the clause
- form: Gage Maker measuring equipment
  reason: explicitly 'measuring equipment for API thread measurement and taper seals' (3313); metrology
- form: Boroscopes
  reason: inspection instruments (3314); the clause excludes equipment that only inspects
- form: 5 Ton Crane
  reason: '''5 Ton Crane capacity'' (1453) - material handling; the clause excludes equipment that ''moves, stores,
    or carries'' what it makes'
- form: Solar Photovoltaic Energy System
  reason: a roof PV array at Sheffield and Cumbernauld (6714); it powers the plant, which the clause excludes
- form: Edgecam
  reason: CAM software used to create 3D models and machining strategies (4073); not a machine at all
- form: Facing & Contouring Heads
  reason: machine-tool attachments listed at 4075 alongside 'Multi - Angled Milling Heads and Outfacing Bars'; tooling
    that a machine acts through, excluded by the clause
- form: blades
  reason: '''superior blades'', ''the latest blade technology'' (1093, 1095) - saw blades are consumable tooling,
    not the machine'
- form: next generation tooling
  reason: '''trial numerous amounts of next generation tooling'' (3354) - explicitly tooling, excluded by the clause'
- form: Standards room
  reason: a calibration/metrology room (3317); neither a machine nor acting on the work
- form: Press Brake
  reason: zero occurrences - 'press' does not appear anywhere in the file. A generic sheet-metal word-association
- form: Waterjet
  reason: zero occurrences; word-association from a metal-cutting site whose only cutting machines are band saws
- form: EDM
  reason: zero occurrences
- form: Crane
  reason: '''5 Ton Crane capacity'' occurs on the coating & finishing page, but a crane moves/carries rather than
    acting on the work, which the equipments boundary excludes.'
