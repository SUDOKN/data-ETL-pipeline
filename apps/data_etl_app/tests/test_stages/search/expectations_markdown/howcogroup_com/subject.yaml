sampling_notes: 'EXHAUSTIVE. All 7,573 lines / 222,956 bytes were read, in slices, via two derived views built from
  the file: (a) footer-stripped (the 17-line legal footer occurs 98x and was elided), (b) composition-table-stripped
  (bare element-symbol and Min/Max numeric rows elided) - both keyed back to original line numbers, and the elided
  material was separately enumerated and checked (all distinct symbol-only lines listed; only C, Si, Mn, P, S, Cr,
  Ni, Mo, Cu, Ti, Al, V, N, B, W, PREN, NbCbTa, NbCb appear). The accreditations page (3519-3605), the coating page
  (1420-1453), the precision-fabrication page (2660-2681) and the testing/NDT page (2224-2248) were additionally
  read RAW in repr form so NBSP, U+F1C1 and the ''ASME 1X'' digit-one are byte-exact. Then ~120 targeted word-boundary
  greps: standards bodies (ISO/ASTM/API/AMS/AS/ASME/EN/BS/NACE/NORSOK/UKAS/PCN/CSWIP/ICorr/ASNT/LRQA/NADCAP/ANSI/UL/SAE),
  every anticipated-absent string (CE, UKCA, PED, ATEX, Achilles, FPAL, Teflon, LDPE, Acrylic, Polypropylene, PCB
  - all confirmed ZERO occurrences), alloy/grade patterns, machine brands, -ing process words, and each of the seven
  reported defect exemplars. No byte range was skipped.'
