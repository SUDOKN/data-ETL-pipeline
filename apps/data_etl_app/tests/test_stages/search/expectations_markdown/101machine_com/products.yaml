notes: 'SHARED OUTPUT NOTE: products and contract_products share one search output; this file serves as the expectation
  set for BOTH fields. expected_empty: pure job shop - the text names no catalog product designations. Outputs of
  the machining service are described only generically (''highly accurate parts, full-functioning engineering prototypes,
  piece parts and injection molds''). Judgment call: ''injection molds'' is the closest thing to a product designation
  but reads as a category of made-to-order service output, not a product offered - a run returning it is a defensible
  borderline (B), so it is NOT listed as a false friend, just not seeded as must-find (expected_empty means ''almost
  nothing'', not ''zero defensible forms''). The FAQ''s negated ''automobile parts'' is the field''s search false-friend
  - see false_friends.'
