    the Design & Engineering page. Toolpath generation arguably IS the first step of die manufacture; simulation
    and modelling are not. Disputed | DEFORM simulation, CIMATRON tool-path generation and Siemens NX 3-D modelling
    are CAD/CAM/simulation software used before the work exists. The clause wants ''an operation performed on materials,
    parts, or products''; none of these is performed on the work. Separately, all three forms are whole design-engineering
    lines rather than phrases. | RULING 2026-09-03 (R5-engineering-in): engineering/design work ruled IN for process_caps
    (SUDOKN EngineeringCapability family)'
