subject: pradeepmetals.com
field: material_caps
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/pradeepmetals.com.txt
  sha256: 7a36ae8691171d311de2a755a3a7d14f4e70d85c4b2ed90a3271b389de048586
eval_set_version: 2
expected_empty: false
notes: 'The single densest in-field block on the site is the MATERIAL GRADES USED table - 48 lines carrying about
  53 grade designations across five columns (Stainless Steel / Alloy Steel / Duplex / Carbon Steel / Die Steel),
  printed twice (/material-grades and /material-grades/). The table is flattened to one grade per line, with a tab
  where the column changes, and three cells are RUN TOGETHER by the flattening: ''F347H1.4301'', ''414020MnCr5''
  and ''42CrMo4F5''. Grades are seeded grouped by alloy family so that no entry rests on a bare two- or three-character
  number. The regime is European and Indian (DIN, EN, CK45, 1.4xxx, F-series) rather than US. All four reported
  fabrications - HDPE, LDPE, Teflon, Bronze - were checked on word boundaries and have ZERO occurrences; they are
  seeded as anticipatory false_friends, as is ''Lead'', which occurs 21 times and never once as a metal.'
