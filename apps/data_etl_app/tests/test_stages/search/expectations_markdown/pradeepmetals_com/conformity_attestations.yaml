eval_set_version: 3
expected_empty: false
notes: 'The widest non-US standards regime in the corpus: PED 2014/68/EU + AD2000-Merkblatt W0, NORSOK, AS 9100D,
  three ISO schemes, a Marine certificate, INDIAN BOILER / Central Boiler Board, Engineers India Ltd (EIL) vendor
  approval, INDIAN DEFENSE and INDIAN RAILWAYS approved-supplier status, CANADIAN REGISTRATION, ISI standards and
  DSIR R&D recognition. THREE OF THE LEADS ARE NOT PRINTED AS ABBREVIATIONS: the text never writes ''IBR'', ''EIL''
  or ''CRN'' - it writes ''INDIAN BOILER'', ''ENGINEERS INDIA LTD'' and ''CANADIAN REGISTRATION''. Those three abbreviations
  are anticipatory false_friends. Against 11 real certificate lines sits ~24 pages of securities-regulation vocabulary
  (SEBI LODR, Companies Act, IEPF, BSE, Regulation 29/30/46, compliance reports) plus 24 governance policies - all
  seeded disputed or as false_friends with the argument recorded.'
