eval_set_version: 2
expected_empty: false
notes: 'Two clean sources and three trap sources. Clean: the five-line INDUSTRIES WE SERVE strip repeated on the
  homepage and Clientele page (Process Industry / Oil & Gas / Off-Highway Vehicles / Pipes & Fittings / General
  Engineering), and the homepage sentence naming the Valve, Instrumentation, Petrochemical and General Engineering
  industries. Traps: (1) the /industries-we-serve page itself is a ''Coming Soon'' stub, so the strip in the nav
  is all there is; (2) the blog explainers name a dozen sectors that belong to the INDIAN FORGING INDUSTRY generally,
  not to this company - those carry actor: unknown; (3) an independent director''s CV lists BFSI, FMCG, hospitality,
  retail pharma, media and advertising as HIS consulting sectors. INVERSION: ''Wind Energy'' does NOT occur in this
  file - what occurs is ''Wind Mill'' and ''Wind Power Project'', and both are the company''s OWN captive generation
  covering 95% of its own energy needs, not a market served.'
