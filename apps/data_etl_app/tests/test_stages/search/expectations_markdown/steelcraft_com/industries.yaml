notes: 'Application-framed corpus: the institutional/commercial/industrial triple is the backbone designation (repeated
  on landing pages), plus application segments from Typical-applications blocks. Judgment calls: (1) the sterile-environments
  sentence (hospitals, labs, pharmaceutical, food) is the only explicit ''Industries...'' sentence and seeds three
  entries; (2) windstorm GEOGRAPHY (tornado alley, hurricane zones, coastal regions) is judged NOT a served-industry
  designation - false friends; (3) residential shelters kept as a borderline segment entry; (4) construction is
  deliberately in NEITHER list - defensible B either way. VERIFICATION PASS 2026-08-26 (verify-agent-steelcraft,
  second independent read): all 16 entries confirmed; 0 disputed; 0 quote failures (all evidence byte-exact verbatim).
  Agreed with all four of the seed''s judgment calls, including keeping windstorm GEOGRAPHY out (tornado alley /
  hurricane zones / coastal regions are regions, not sectors) and leaving ''construction'' out of both lists. FALSE
  FRIENDS: agreed as written - I re-read each in context and Defense (''tough defense against harsh weather''),
  Insurance (only inside ''Texas Department of Insurance''), Energy (only inside LEED''s expansion and ''energy
  cost savings''), Airports (''near airports and highways'') and Manufacturing (own activity, code O) all hold.
  OVER-BROAD FORMS are this file''s real risk, flagged per entry: ''commercial'' (56 occurrences, nearly all adjectival),
  ''industrial'', ''institutional'', ''education'' (credited by ''Continuing Education''), ''offices'' (credited
  by ''ADMINISTRATIVE OFFICES''), ''Retail'' (credited by privacy-boilerplate ''retail kiosks''/''retailers''),
  and bare ''food''.'
