false_friends:
- form: Defense
  reason: 'word-association (code W): only ''tough defense against harsh weather and corrosion'' (LS doors, FS frames)
    - the corpus''s textbook W case'
- form: Insurance
  reason: occurs only inside 'Texas Department of Insurance (TDI)' windstorm listing body - not a served industry
- form: Energy
  reason: occurs only inside 'Leadership in Energy and Environmental Design (LEED)' and 'energy cost savings' -
    word-association
- form: Security
  reason: parent positioning ('Allegion... global pioneer in safety and security') and product function ('security,
    safety and design requirements') - not a served-industry designation of the subject
- form: Distribution
  reason: history line ('founded... as a building products distribution company', 1933) and the Distributor sales
    channel - not a served industry
- form: Manufacturing
  reason: the subject's OWN activity presented as a word (code O), e.g. 'door and frame manufacturing footprint'
- form: Airports
  reason: 'word-association: ''buildings located near airports and highways'' (STC page) - proximity context, not
    a served sector'
- form: tornado alley
  reason: geographic application region, not an industry
- form: hurricane zones
  reason: geographic application region ('commercial buildings in hurricane zones near the Atlantic coast, and Gulf
    of Mexico')
- form: coastal regions
  reason: geography from windstorm prose, not a served industry
- form: Latin America
  reason: sales territory in the regional sales-office list, not a served industry (same for Caribbean, Mountain
    States, etc.)
- form: Steel
  reason: the subject's material/product ('Why Steel' nav) - not an industry served
