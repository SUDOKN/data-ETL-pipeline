notes: 'SHARED OUTPUT NOTE: products and contract_products share one search output; this file serves as the expectation
  set for BOTH fields. Catalogue-product manufacturer organized as a product-series catalogue: series designations
  are the natural entities (door series T/SL/L/B/H/CE/LS/SZ/A14/PW/GRAINTECH/INPACT; frame series FT/FP/FN/F/FE/DE/C/CK/DW/K/MU/FS/KS/MS).
  Judgment calls: (1) series sharing a page (C&CK, DW&K, FS/KS/MS) are SPLIT per the distinct-series rule since
  each gets its own install-profile prose; (2) supplier hardware/glazing with concrete model designations (Von Duprin
  94/95, Schlage LM9300, WS-T, Pyrostop, FireLite) are seeded with actor supplier per recall-first; brand+generic
  mentions (LCN Closers, IVES Hinges, Zero thresholds, Glynn-Johnson) are deliberately NOT seeded - designation
  content too thin to gate recall on; (3) contract_products: zero contract-manufacturing prose in the text, so any
  contract_products yield is junk-minting signal. VERIFICATION PASS 2026-08-26 (verify-agent-steelcraft, second
  independent read): all 37 entries confirmed; 0 disputed; 0 quote failures (all evidence byte-exact verbatim).
  Agreed with all three judgment calls, including splitting C/CK, DW/K and FS/KS/MS (each genuinely carries its
  own install-profile prose) and seeding the five supplier hardware/glazing designations with actor: supplier per
  recall-first. FALSE FRIENDS: agreed as written. SERIES-FORM CONTAINMENT COLLISIONS are this file''s real hazard
  and are flagged per entry - because matching is containment-either-way, the single-letter series forms are substrings
  of other seeded series: ''T Series'' is inside ''FT Series'' (0001 credited by 0013), ''L Series'' is inside ''SL
  Series'' (0003 credited by 0002), and ''K Series'' is inside ''CK Series'' (0022 credited by 0020). A judged pass
  must attribute these by window, not by form alone. OBSERVED GAPS (recorded, NOT added): ''kwik-pak doors'' (Express
  Stock program prose) and ''WS Strikes'' (named in the Grouting/Installing WS Strikes download titles) are product
  designations with no entry.'
