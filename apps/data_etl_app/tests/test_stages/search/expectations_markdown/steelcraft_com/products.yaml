false_friends:
- form: Steelcraft Technical Data Manual
  reason: document title (code D) - floods the Downloads block on nearly every product page (~30x)
- form: Steelcraft Catalog
  reason: document title (code D) in resources/downloads lists
- form: Data Sheet
  reason: document-title fragment (D); many downloads end in it (WS-T Data Sheet, Falcon SZ Data Sheet, ...)
- form: 5-Day Express Doors
  reason: shipping/lead-time program, not a product designation (S); same for 3-Day Express Frames and 2-Day Express
    Stock
- form: Order Entry Works
  reason: electronic ordering software (OEW), not a product
- form: 360 Portal
  reason: customer web portal in the nav on every page (U/S)
- form: RAPID program
  reason: stock ordering program, not a product
- form: Overtur
  reason: Allegion specification software ('specification supported by Overtur'), not a product of the subject
- form: Literature
  reason: nav menu label repeated on all pages (U)
- form: Republic Doors and Frames
  reason: sibling Allegion brand the text refers readers to (finish-painted frames, lead-lined doors) - a company
    name, not a product designation
- form: Allegion hardware
  reason: generic parent-brand hardware reference ('assembly approved with Allegion hardware') - generic + parent
    bleed
