false_friends:
- form: missile impact tests
  reason: 'certification-lab test procedure (code L, actor lab): ''TAS 201: Missile impact tests'' - performed by
    Intertek/test houses, a measured wrong-actor flood class'
- form: cyclic wind pressure tests
  reason: lab test procedure (TAS 203 / ASTM E1886) - code L
- form: uniform static air pressure tests
  reason: lab test procedure (TAS 202 / ASTM E330) - code L
- form: positive pressure testing
  reason: fire-lab test regime (UL-10C) - code L
- form: neutral pressure testing
  reason: fire-lab test regime (ASTM E152/UL-10B) - code L
- form: air leakage
  reason: lab test subject (UL 1784 (Air Leakage)) - code L
- form: physical endurance
  reason: lab test category (ANSI/SDI A250.4 (Physical endurance)) - code L
- form: installation
  reason: 'installer/contractor field work (code I): ''Proper installation of tornado doors is critical'', ''ease
    of installation'' - the measured installation-site flood class'
- form: field assembly
  reason: 'installer work: ''KD (knock-down) for field assembly prior to installation'' - code I'
- form: anchor prep
  reason: 'flagged per the measured installation-work flood; NOTE for second pass: ''Special anchor preps'' in the
    Chino/Kansas City service lists is arguably OWN factory work - adjudicate per window; the flood came from installation-context
    anchoring'
- form: grouting
  reason: installer field work ('Grouting WS Strikes' installation download) - code I
- form: field conversion
  reason: installer work ('easy field conversion from standard-weight to heavyweight hinges') - code I
- form: anchoring
  reason: installation-site work ('quick anchoring in place', frames 'butted to CMU block using wire or Masonry-T
    anchors') - code I
- form: wall framing
  reason: contractor site work ('installed as part of the wall framing sequence') - code I
- form: ordering
  reason: 'business activity (code Z): OEW ordering, order entry'
- form: estimating
  reason: business activity ('List Price Estimating') - code Z
- form: expedited shipping
  reason: logistics program (Express programs) - code Z
- form: training
  reason: business activity ('instructor-led training and webinars') - code Z
- form: recycling
  reason: industry-general claim about steel ('the most recycled material in North America'), not a subject operation
