  evidence:
  - quote: Available in high definition embossment 2-panel designs (HD2 square; HD2A rounded top edge)
    approx_offset: 87823
  notes: 'operation implied by the CE embossed panel line and ''high definition embossment''; mostly adjectival
    in-text (B-leaning) | DISPUTED by verify-agent-steelcraft 2026-08-26 (second independent read). The text never
    names an embossing OPERATION anywhere: every surface is product-side, either an adjective on a series (''CE
    Series embossed doors'', ''CE SERIES EMBOSSED PANEL DOORS'', the ''Embossed'' subcategory nav token, ''H / HE
    (embossed)'', ''Hand-stained GRAINTECH embossed finishes'') or a design attribute (''high definition embossment
    2-panel designs (HD2 square; HD2A rounded top edge)''). Under ''designations, not claims'' those are product/spec
    designations (products-field V, or process_caps E/S), not a performed operation, so the operation here is inferred
    rather than named. Compounding it, the acceptable form ''embossed'' is credited by containment from the CE/HE
    product designations, so as written this entry would gate process_caps recall on a products-field answer. Contrast
    process_caps-0007, where the text says ''Our exclusive engraining and staining PROCESS'' outright.'
