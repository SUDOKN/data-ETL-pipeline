notes: 'Full read of the v3 markdown snapshot end to end, all 2,924 lines / 56 page blocks (54 rendered pages +
  2 Not Found artifacts): the site is a door/frame product catalogue organized by series, standards/certification
  listings, ordering/support pages, and Allegion legal boilerplate (privacy policy, cookie notice, terms of use).
  No production machine is named anywhere. The 553,000 sq ft Blue Ash main plant and the Chino / Kansas City service
  centers are described purely by capability verbs (welding, anchor preps, modifications, labeling, crating, frame
  manufacturing) with zero machine designations. Confirmed with a full-text grep sweep of 45+ machine/equipment
  terms: machine, CNC, press, brake, laser, lathe, mill, robot, saw, punch, shear, stamp, grind, conveyor, tooling,
  fixture, equipment, welder, forklift, crane, kiln, furnace, router, plasma, turret, roll form, automat(e/ic),
  oven, extrud(e), inject, mold, drill, cutter, bender, compressor, generator, pump, boiler, hydraulic, coil, slit,
  blank, 3D print, additive, assembly line, robotic, automation, cell, arm, workstation, booth, hoist, rack - every
  apparent hit is a false positive. ''press''/''pressure'' is always wind/air pressure testing or the Express-branded
  shipping programs (5-Day Express Doors, 3-Day Express Frames); ''machine'' occurs exactly once, inside the Chatbot
  terms-of-use clause (''pre-programmed scripts, machine learning, and generative artificial intelligence''); ''mill''
  is only ''SDI/A250.4 to 1 Million Cycles'' and the surname Miller (jon.miller@allegion.com); ''robot''/''automat(ic)''
  are only the anti-scraping clause in the Terms of Use (''deep-link, page-scrape, robot, spider, or other automatic
  site search/retrieval application''); ''cell'' is only the door core structure (''Honeycomb cell with sanded surfaces'');
  ''extrusion'' names the FT Series'' polymer thermal-separator strip, a component, not a machine; oven, tooling,
  fixture, equipment, welder, forklift, crane, kiln, furnace, router, plasma, turret, CNC, lathe, laser, brake,
  saw, punch, shear, stamp, grind, conveyor, drill, cutter, bender, compressor, generator, pump, boiler, hydraulic,
  coil, slit, blank, additive, robotic, automation, arm, workstation, and booth all return zero hits. Any sizable
  yield here would be junk-minting signal, most likely by relabeling a door/frame product series as a machine (the
  measured failure mode on the legacy corpus: search returned 68/75 product groups under equipments there) or by
  mistaking a named software/ordering tool for hardware.'
