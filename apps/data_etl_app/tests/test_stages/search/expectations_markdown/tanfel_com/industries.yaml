notes: '29 entries: 9 actor=own, 19 actor=unknown, 1 actor=client, 3 of them disputed. Only 9 are Tanfel market
  claims (Automotive, Medical/Life Science, Lighting, Communications, Audio/Music, Instrumentation-Control-Automation,
  Health & Fitness, Consumer Electronics) plus quick-serve restaurants. The other 20 come from three low-authority
  contexts and are labelled actor=unknown: (a) the Request-a-Quote / Contact-Us industry DROPDOWN, printed verbatim
  twice, which is the sole source of Aerospace, Energy / Utility, Oil / Gas, Wireless, Maquiladora, Computer, Contract
  Manufacturer, Engineering and Government / Military; (b) textbook prose about what CNC-milled, MIM and cast parts
  are used for; (c) a customer testimonial. Recall-first keeps every one of them; the downstream measure is whether
  the actor labels survive.'
