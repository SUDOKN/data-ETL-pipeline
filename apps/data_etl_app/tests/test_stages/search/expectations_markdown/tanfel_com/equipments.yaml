false_friends:
- form: runout table
  reason: 'witnessed: it receives and carries the extrusion — ''moves, stores, or carries what it makes'' is explicitly
    excluded from this field.'
- form: cooling table
  reason: 'witnessed: same exclusion as the runout table.'
- form: loader
  reason: 'witnessed: ''the billets are ... transferred to a loader'' — material handling, excluded.'
- form: extruders
  reason: 'witnessed: ''most extruders offer extruded aluminum ...'' means extrusion COMPANIES, not extrusion presses.'
- form: precision measurement and inspection equipment
  reason: 'witnessed: measuring/inspection equipment is explicitly excluded from this field. Same for ''metrology
    equipment'' and ''process gauges''.'
- form: thread plug gauges
  reason: 'witnessed: a measuring instrument, and here also a product Tanfel sells. Belongs in products, never in
    equipments.'
- form: AutoCAD
  reason: 'witnessed: CAD software from the ''COMMONLY USED SOFTWARE'' list, not a production machine. Same for
    Solid Works, Unigraphics NX, CATIA, Pro Engineer, ProNest and Autodesk.'
- form: coordinate measuring machine
  reason: 'anticipatory: never occurs; a likely mint from the metrology page.'
- form: tool steel molds
  reason: 'witnessed: ''Die casting uses tool steel molds'' — a mold is tooling, which this field excludes.'
