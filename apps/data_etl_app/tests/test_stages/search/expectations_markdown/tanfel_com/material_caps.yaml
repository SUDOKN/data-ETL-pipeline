    approx_offset: 21156
  notes: solder is named only inside the component name 'solder pins' in the membrane-switch connector list ('Female,
    male connector, solder pins and heat seal connectors are available'). A solder pin is a pin intended to be soldered,
    not a pin made of solder, so the material is an inference from a part name rather than a material the work is
    made from. The part itself is already carried by products-0044.
