- id: superiortech_org-material_caps-0020
  name: CBN (cubic boron nitride)
  status: disputed
  acceptable_forms:
  - CBN
  evidence:
  - quote: CBN Hard Turning
    approx_offset: 5364
  notes: DISPUTED — CBN names the CUTTING TOOL's substance, not the workpiece's. The clause wants 'a substance that
    the work is made from or performed in', and the work is made from the steel being hard-turned, not from CBN.
    Kept because it is a genuine named substance (a three-character form, matched case-sensitively) and the tool-material
    boundary is arguable. | CBN, in 'CBN Hard Turning', is the cutting-tool substance -- the abrasive the insert
    is made of -- not a material the work is made from or performed in, and hard turning deposits no boron nitride
    on the part. Real material, arguably wrong field; it is closer to the tooling the clause's sibling fields exclude.
  provenance:
  - action: added
    by: seed-agent-superiortech-org
    date: '2026-08-27'
    source: corpus-seed
  - action: disputed
    by: verify-agent-superiortech
    date: '2026-08-27'
    reason: CBN, in 'CBN Hard Turning', is the cutting-tool substance -- the abrasive the insert is made of -- not
      a material the work is made from or performed in, and hard turning deposits no boron nitride on the part.
      Real material, arguably wrong field; it is closer to the tooling the clause's sibling fields exclude.
  - action: ported
    by: port_corpus.py
    date: '2026-08-29'
    source: markdown-cutover
