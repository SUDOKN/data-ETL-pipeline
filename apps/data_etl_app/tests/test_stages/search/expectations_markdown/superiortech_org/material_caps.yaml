false_friends:
- form: Iron
  reason: 'NEWLY CONFIRMED substring trap, same shape as PET and ITAR: ''Iron'' has ZERO word-boundary occurrences,
    and all 7 substring hits are inside ''environment''/''environmental''. Only a substring matcher or a fabrication
    returns it'
- form: Cast Iron
  reason: 'zero occurrences, and doubly baited: ''castings'' occurs 5 times as an incoming workpiece form, so the
    phrase is one association step away from real text'
- form: Lead
  reason: occurs 4 times and only ever inside 'lead times'; never a metal here
- form: bar stock
  reason: the phrase itself has ZERO occurrences. The bare token 'bar' occurs 11 times and every single one is a
    machine feature — 'bar feeder', 'bar feeders' (plus Barfeed/Barfeeders/BARBER). The material sense never appears,
    so this is a one-word-association mint off a real token
- form: Nylon
  reason: zero occurrences. One of the 13 polymers the old pipeline fabricated from the single word 'plastics'
- form: PEEK
  reason: zero occurrences; fabricated polymer, see Nylon
- form: Delrin
  reason: zero occurrences; fabricated polymer, see Nylon
- form: Acetal
  reason: zero occurrences; fabricated polymer, see Nylon
- form: PTFE
  reason: zero occurrences; fabricated polymer, see Nylon
- form: Teflon
  reason: zero occurrences; fabricated polymer, see Nylon
- form: Polycarbonate
  reason: zero occurrences; fabricated polymer, see Nylon
- form: PVC
  reason: zero occurrences; fabricated polymer, see Nylon
- form: Polypropylene
  reason: zero occurrences; fabricated polymer, see Nylon
- form: Polyethylene
  reason: zero occurrences; fabricated polymer, see Nylon
- form: ABS
  reason: zero occurrences; fabricated polymer. Three-character form — a case-insensitive substring matcher would
    also credit it from 'absolute'-type words, so it tests two defects at once
- form: UHMW
  reason: zero occurrences; fabricated polymer, see Nylon
- form: Acrylic
  reason: zero occurrences; fabricated polymer, see Nylon
- form: Tool Steel
  reason: zero occurrences as a phrase; primed by 34 'tooling', 9 'Tool' and the real 'Precision Tool & Surface
    Grinders' census line
- form: Titanium alloy
  reason: zero occurrences as a phrase — the text says 'super alloys (such as Titanium and Inconel, Hastalloy)',
    so the alloy suffix is minted
