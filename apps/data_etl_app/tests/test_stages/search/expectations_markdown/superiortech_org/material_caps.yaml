- id: superiortech_org-material_caps-0018
  name: Oxygen / Acetylene
  status: disputed
  acceptable_forms:
  - Oxygen/Acetylene sets
  - Oxygen/Acetylene
  evidence:
  - quote: (3)  PRODUCTION BRAZING STATION – Oxygen/Acetylene sets
    approx_offset: 15040
  notes: DISPUTED — brazing gases are a CONSUMABLE the machine burns, not 'a substance that the work is made from
    or performed in'. Kept because they are a named substance adjacent to a production operation and a reader could
    argue the braze joint is performed in them. | Oxygen and acetylene are the torch's fuel and oxidiser at the
    'PRODUCTION BRAZING STATION - Oxygen/Acetylene sets', not a substance the work is made from or performed in.
    The clause's second sentence rescues substances a process deposits on or diffuses into the work (which is why
    nitriding and phosphatizing are confirmed above); a gas burned to make heat deposits nothing.
  provenance:
  - action: added
    by: seed-agent-superiortech-org
    date: '2026-08-27'
    source: corpus-seed
  - action: disputed
    by: verify-agent-superiortech
    date: '2026-08-27'
    reason: Oxygen and acetylene are the torch's fuel and oxidiser at the 'PRODUCTION BRAZING STATION - Oxygen/Acetylene
      sets', not a substance the work is made from or performed in. The clause's second sentence rescues substances
      a process deposits on or diffuses into the work (which is why nitriding and phosphatizing are confirmed above);
      a gas burned to make heat deposits nothing.
  - action: ported
    by: port_corpus.py
    date: '2026-08-29'
    source: markdown-cutover
