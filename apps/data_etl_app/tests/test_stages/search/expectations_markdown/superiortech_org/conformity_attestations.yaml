  notes: DISPUTED — 'journeyman' names a completed apprenticeship — a real, issuable trade qualification — which
    is a stronger claim than a plain job title. But the text uses it descriptively about staff, names no issuing
    body, and the company separately says it merely 'offer[s] apprenticeships'. Seeded disputed as the cleanest
