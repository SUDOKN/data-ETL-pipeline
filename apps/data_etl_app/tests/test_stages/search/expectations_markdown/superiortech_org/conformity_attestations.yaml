eval_set_version: 2
expected_empty: false
notes: 'Narrow but heavily repeated: ISO 9001:2015 is stated 36 times, 30 of them in an identical page footer, which
  makes it window-scoped almost everywhere and makes the OTHER attestations the only informative ones. Everything
  real here is either ISO 9001, a welding standard, a specification family the parts are traceable to, or a customer-quality
  methodology. The interesting property is the ABSENCE: this shop sells into Aerospace, Medical, Military and Defense
  and holds none of the certifications those markets normally imply, so AS9100, ISO 13485, IATF 16949, NADCAP and
  ITAR are all zero-occurrence and are seeded as anticipatory traps.'
