false_friends:
- form: AS9100
  reason: 'ZERO occurrences. The single most likely fabrication on this subject: Aerospace is named 5 times and
    is the first industry in every list, and AS9100 is the certification that market normally requires. The text
    claims ISO 9001:2015 only'
- form: ISO 13485
  reason: zero occurrences; 'Medical' and 'Medical Equipment' are both named, which is the association that mints
    it
- form: IATF 16949
  reason: zero occurrences; 'Automotive', 'Automotive & Alternative Fuels' and 'Automotive Fuel Systems' are all
    named, and the text does cite APQP and PPAP, which are the automotive-quality toolkit — so the association is
    unusually strong
- form: ITAR
  reason: 'ZERO word-boundary occurrences — all 9 hits are the substring inside ''Military''. Both a substring trap
    AND an association trap: Military and Defense are named and parts are traceable to Mil-Spec, so ITAR registration
    is the natural inference'
- form: NADCAP
  reason: zero occurrences; baited by the outsourced heat-treatment, plating and NDT lists, which are exactly the
    special processes NADCAP accredits
- form: RoHS
  reason: zero occurrences; baited by 'Electronics' and by the plating and surface-treatment chemistry list
- form: FDA
  reason: zero occurrences; baited by 'Medical' and 'clean room'
- form: Six Sigma
  reason: zero occurrences; baited by 'continuous process improvement', 'Total Quality Management System' and the
    real SPC reference
- form: Fortune 500
  reason: a customer-size tier, not a certification the company holds; occurs twice and both times in a sentence
    about credibility, which is where attestations usually sit
- form: ISO 9001:2008
  reason: zero occurrences — the text is consistently the 2015 revision. A run returning the older revision has
    substituted a memorized version number for the printed one
