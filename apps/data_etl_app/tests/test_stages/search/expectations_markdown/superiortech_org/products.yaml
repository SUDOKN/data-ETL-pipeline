false_friends:
- form: Large Capacity 4-Axis Horizontal CNC Machining Centers
  reason: CONFIRMED LEAK. This is a machine Superior OWNS and operates, which the old pipeline emitted as a product
    it makes. The sentence is 'Large Capacity 4-Axis Horizontal CNC Machining Centers allow milling of complex Hydraulic
    & Pneumatic Manifolds' — the manifolds are the product, the machining centers are the machine. It is seeded
    as an `equipments` entry
- form: Vertical Turning Lathes
  reason: 'same shape as the machining-centers leak: an owned machine in a sentence whose object is the real product
    (''Large Vertical Turning Lathes (VTL’s) allow us to manufacture large turnings such as Train Brake Rotors &
    Axles'')'
- form: Superior Technology, Inc.
  reason: the company's own name, which the clause excludes along with 'the names of companies, brands, or customer
    groups'. It occurs 20+ times and is by far the most repeated capitalized noun phrase in the file
- form: Managed Inventory Solutions
  reason: a logistics SERVICE, not an artifact; the clause excludes what is not a made thing, and the capitalized
    'Solutions' reads product-like
- form: Value Added Secondary Processes
  reason: a service category, not an artifact, despite title-case presentation
- form: Fortune 500
  reason: a customer group — the clause excludes 'the names of companies, brands, or customer groups' explicitly
- form: Kanban
  reason: an inventory METHOD, not an artifact; 5 occurrences, always parenthesized after 'Managed Inventory Solutions'
- form: SolidWorks
  reason: 'third-party CAD software: neither made here nor a made artifact of manufacturing work. ''MasterCam''
    and ''Fusion 360'' on the same line are the same case'
- form: keyways
  reason: a FEATURE cut into a part, not a part. Line 169 lists 'flats, keyways, hexagonal, squares, splines, and
    other polygon shapes', which mixes real components (splines) with pure geometry
- form: polygon shapes
  reason: geometry, not an artifact; same list as keyways
- form: Made in The USA
  reason: an origin claim, not an artifact; it is seeded as a disputed conformity_attestation
- form: Clean Room
  reason: a facility — the clause excludes 'the facilities the work is done with'
