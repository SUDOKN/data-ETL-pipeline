subject: superiortech.org
field: products
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/superiortech.org.txt
  sha256: f29844803215581d1f500767f528c381ac8f521986e6f6cf3900fe5842420ad1
eval_set_version: 2
expected_empty: false
notes: 'A genuine OWN-BRAND NEGATIVE that is NOT expected_empty. Superior Technology is a build-to-print job shop:
  it names no own-brand catalog product anywhere in 60 KB — ''All products manufactured at Superior Technology''
  are customer parts, and the private-label page says outright that it manufactures ''you entire product'' for the
  OEM. But the text NAMES many artifacts, so under recall-first the field is richly populated with `actor: client`
  entries: train brake rotors, pump and compressor housings, hydraulic and pneumatic manifolds, axle housings, transmission
  casings, rail brake hub assemblies, fuel injectors, valves and regulators. Reporting this field as empty would
  be wrong; so would reporting an own-brand product line. The old pipeline fabricated own products here, including
  one that is actually a machine Superior OWNS (see the false_friends).'
