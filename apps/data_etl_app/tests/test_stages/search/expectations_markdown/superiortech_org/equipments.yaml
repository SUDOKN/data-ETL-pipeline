false_friends:
- form: Coordinate Measuring Machines
  reason: metrology. The clause separates a production machine from 'equipment that only measures, inspects, or
    tests the work' — the three named CMMs are recorded as DISPUTED entries, and CMM inspection is a process_caps
    entry
- form: TESA height gages
  reason: metrology, excluded by the clause; 6 units on the quality census line 592
- form: Optical comparators
  reason: metrology, excluded by the clause; 3 units on census line 594
- form: Surface Finish Profilometers
  reason: metrology, excluded by the clause; 3 units on census line 596
- form: Mitutoyo laser micrometer
  reason: metrology, excluded by the clause; a named-brand instrument that measures only
- form: Digital Microscopes
  reason: metrology, excluded by the clause; 'Bore microscopes' and the line-165 inspection microscope are the same
    case
- form: Thread & Plug Gages
  reason: gauging, excluded by the clause; line 602 also names Micrometers, Calipers and Bore Gages, all the same
    case
- form: overhead crane
  reason: material handling — the clause excludes 'equipment that ... moves, stores, or carries what it makes'.
    Occurs once, line 845, in the plant-expansion history
- form: Customer specific Tooling
  reason: tooling — 'what a machine holds, guides, or acts through rather than the machine driving it'. Census line
    546 says it is manufactured in house, which makes it tempting
- form: fixtures
  reason: tooling, excluded by the clause; 'test fixtures', 'Fixturing' and 'in-house fixture design' all occur
    and are all held BY a machine, not machines
- form: bar feeder
  reason: a machine accessory, not a machine — and the clause's tooling/handling exclusions cover it. 11 occurrences,
    all as census spec suffixes
- form: live tooling
  reason: tooling by name and by function; 13 occurrences as a census spec suffix, which makes it the most repeated
    non-machine token in the equipment window
- form: pallet changer
  reason: a machine accessory listed as a spec suffix on 8 census lines; also 'interchangeable pallet systems',
    '4th axis indexer', 'sub spindle', 'tail stock' and 'Twin turret'
- form: SolidWorks
  reason: CAD software, not a production machine; line 301 also names MasterCam and Fusion 360
- form: MasterCam
  reason: CAM software, not a production machine
- form: GAGETRACK
  reason: gage-calibration software on the quality census; 'ANSTAT SPC data collection software' on the next line
    is the same case
- form: Press Brake
  reason: 'anticipatory: zero occurrences. Heavily baited — the text has ''Hydraulic Press'', ''Manual Presses'',
    ''Pneumatic and Hydraulic Presses'', a ''Bender'' and a ''Shear'' all within two census lines'
- form: Wire EDM
  reason: 'anticipatory: zero occurrences; the standard companion machine on a shop this size'
- form: Laser Cutter
  reason: 'anticipatory: zero occurrences. Baited by the real ''laser marking'' and ''Mitutoyo laser micrometer'''
- form: CMM
  reason: a coordinate measuring machine only measures/inspects the work; excluded from equipments, recorded instead
    as process_caps inspection
- form: Video Measuring System
  reason: measures/inspects the work rather than acting on it; excluded from equipments
- form: MAGNETIC PARTICLE INSPECTION Non-Destructive Testing Machines
  reason: an inspection/testing machine, excluded from equipments; the operation itself is seeded as process_caps
- form: Fusion 360
  reason: CAD/CAM software, not a production machine
- form: ANSTAT SPC data collection software
  reason: statistical process-control software, not a production machine
- form: Torque Tools
  reason: hand tooling used to apply/measure torque, not a production machine acting on the work
- form: Leak Tests Stations
  reason: a test station that only measures/tests the work; excluded from equipments
- form: Electrical Testers
  reason: test instruments that only measure/test the work; excluded from equipments
