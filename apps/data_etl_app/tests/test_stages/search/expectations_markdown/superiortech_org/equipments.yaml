subject: superiortech.org
field: equipments
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/superiortech.org.txt
  sha256: f29844803215581d1f500767f528c381ac8f521986e6f6cf3900fe5842420ad1
eval_set_version: 4
expected_empty: false
notes: 'The richest equipment inventory in the corpus: the facilities-list page (lines 376-606) enumerates roughly
  100 machine UNITS as ~75 distinct designations, in a ''(N)  BRAND MODEL; spec; spec'' census, plus a dozen more
  machines named in capability prose. SEEDED STRICTLY TO THE PROMPT''S CLAUSE, not to the everyday sense of ''equipment'':
  a production machine must act on the work itself. That EXCLUDES the entire QUALITY ASSURANCE block (3 CMMs, a
  video measuring system, height gages, optical comparators, profilometers, a laser micrometer, microscopes, micrometers,
  calipers, bore/thread/plug gages), the MPI non-destructive testing machines, the leak-test stations, torque tools
  and electrical testers, the overhead crane (material handling), the in-house customer tooling and fixtures (tooling),
  and the three CAD/CAM and two quality software packages. Those measurement operations are seeded under `process_caps`,
  where the clause explicitly admits them. A small number of named-brand metrology machines are kept here as DISPUTED
  so the boundary argument survives on the record without ever gating recall.'
