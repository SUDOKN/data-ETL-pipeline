subject: ableengineering.com
field: conformity_attestations
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/ableengineering.com.txt
  sha256: 7f2e8d7e059f38f53fc2e3ce92499369e9099f8ae550e6d0177284e3850258c7
eval_set_version: 4
expected_empty: false
notes: 'Rich field. The cert wall (17 items) appears verbatim on the homepage AND the why-able page; the footer
  cert string repeats on all 27 pages. All attestations are the subject''s own; none of the press releases attribute
  certifications to other companies, but OEM authorizations name their grantors (Airbus, Bell, Leonardo). SECOND-PASS
  VERIFICATION 2026-08-26 (verify-agent-ableengineering): all 23 evidence quotes located verbatim in the snapshot;
  22 confirmed, 1 disputed (0023 DER - personnel job title, not a company attestation). Short-form audit: PMA, CAA,
  CAAT, DGCA, ECAA, JCAB, SMS, ARSA, NATA are all real word-bounded designations in the text, none is a substring
  artifact; the over-broad ones on the MATCHING side are ''Part 145'' (shared by 0001/0003), ''NADCAP'' (shared
  by 0010/0011/0012), ''CAA'' (contained in CAAC/CAAT/ECAA and in Able part numbers ending -CAAA) and ''DER''. All
  6 false friends checked and agreed: ''FAA-approved'' is a bare adjective 19x, ''Certified'' is the footer trailing
  word plus the QUALIFIED/VERIFIED/CERTIFIED heading, and the two footer document titles carry no standard id.'
entries:
- id: ableengineering_com-conformity_attestations-0023
  name: Designated Engineering Representative (DER)
  status: disputed
  acceptable_forms:
  - designated engineering representatives (DER)
  - DER
  evidence:
  - quote: designated engineering representatives (DER), specialists, avionics techs
    approx_offset: 689
  notes: 'borderline: FAA designation held by staff members, not a company certificate; second pass may dispute
    | DISPUTED by second pass 2026-08-26: both occurrences are personnel-roster text - ''a dedicated team of more
    than 350 mechanics, engineers, designated engineering representatives (DER), specialists, avionics techs'' and
    ''our on-site engineering and DER specialists have - on average - 20 years of industry experience''. DER is
    a staff job title here; the text never presents it as an attestation the company holds and makes no compliance
    claim from it. Separately the bare form is unsafe for containment matching: only 2 of the 18 case-insensitive
    substring hits are the acronym, the rest sit inside provider/providers/leader/Federal/grinders/under/understanding,
    so any returned form containing ''der'' would be credited.'
