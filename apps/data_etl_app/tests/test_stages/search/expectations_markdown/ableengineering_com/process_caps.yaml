  blast, shot peen, cold spray, hydraulics). SECOND-PASS VERIFICATION 2026-08-26 (verify-agent-ableengineering):
  all 23 entries confirmed, all quotes verbatim. Three cross-field couplings mean several recall numbers are not
  independent: chrome/nickel are shared with material_caps-0003/0004, grind/lathe/mill are shared with equipments-0002/0003/0001,
  and ''testing'' (0021) is contained in ''Non-Destructive Testing'' (0014). One evidence defect recorded on 0016.
  All 6 false friends checked and agreed, including ''training'' (IFR flight training belongs to the U.S. Navy customer
  fleet) and ''exchange'' (a commercial program, not a shop operation).'
