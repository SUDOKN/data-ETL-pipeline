notes: 'Aviation MRO subject: sector signal is aviation/aerospace with military/government and airline segments.
  OEM names (Boeing, Bell, Airbus, Leonardo, Sikorsky, Honeywell) are makes/platform facets, not industries. SECOND-PASS
  VERIFICATION 2026-08-26 (verify-agent-ableengineering): all 7 entries confirmed, all quotes verbatim. Two systemic
  flags: (a) ''rotor wing''/''fixed wing'' are simultaneously the served segment (B) and the subject''s own service
  division in the repeated nav label (O), and their ~75-occurrence counts are nav/facet inflation, not sector prose;
  (b) the acceptable form ''defense'' on 0004 leans on parent-company names. All 4 false friends checked and agreed:
  MRO (93 word-bounded, the subject''s own service category), Green Aviation Business (belongs to conformity_attestations),
  ''Supply Chains'' (statute name only) and Marketing (byline job title plus cookie boilerplate) are all correctly
  excluded.'
