subject: fzemanufacturing.com
field: material_caps
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/fzemanufacturing.com.txt
  sha256: 29f9da1f8d601d220cf801bb8a496ba1e873febead70176f1f431a667253e773
eval_set_version: 2
expected_empty: false
notes: Four verbatim copies of the same Thomas-directory materials block (Metals / Exotic & Precious Metals / Plastic
  Polymers / Other Materials) on the hydraulic, Swiss, HMC-VMC and shaft pages, plus a separate firearm-components
  materials list and the process chemistry named in the passivation and electropolishing pages. The 'named after
  a substance it deposits or diffuses' clause pulls in chromating (chromium) and Stellite hardfacing.
entries:
- id: fzemanufacturing_com-material_caps-0001
  name: Lead
  status: confirmed
  acceptable_forms:
  - Lead
  evidence:
  - quote: just-in-time manufacturing practices, resulting in reduced inventory levels and storage costs, shorter
      lead times, and a demonstrated positive impact on the customer’s bottom line.
    approx_offset: 4835
  - quote: Lead
    approx_offset: 10886
  provenance:
  - action: added
    by: seed-agent-fzemanufacturing-com
    date: '2026-08-27'
    source: corpus-seed
  - action: amended
    by: verify-agent-fzemanufacturing
    date: '2026-08-27'
    reason: 'the metal is real - a standalone item in all four Materials (Metals) tables (lines 225/2011/2756/3532)
      - but the packet''s quote proves ''shorter lead times'', not the element. Re-anchored on the Materials (Metals)
      line. Caveat for whoever scores this: ''Lead'' is 4 chars so it is matched case-insensitively without word
      boundaries, and only 4 of the 46 ''lead'' occurrences in the file are the metal (the rest are ''lead times'',
      ''leading'', ''leader''), so this entry''s recall number carries almost no information whichever quote it
      holds'
  - action: ported
    by: port_corpus.py
    date: '2026-08-29'
    source: markdown-cutover
