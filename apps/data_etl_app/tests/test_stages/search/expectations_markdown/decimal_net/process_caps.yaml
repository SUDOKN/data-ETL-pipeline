false_friends:
- form: Kanban
  reason: an inventory/logistics scheme in the Inventory Management column, not an operation on the work
- form: JIT Shipping
  reason: logistics, not a manufacturing operation
- form: Vendor Managed Inventory
  reason: an inventory program, not an operation on the work
- form: Consignment Programs
  reason: a stocking arrangement, not a process
- form: Blanket Orders Accepted
  reason: an order-taking term from the Production Volume column
- form: Min-Max
  reason: an inventory replenishment scheme
- form: Vocational Training
  reason: a community programme, not a manufacturing operation
- form: Live Tooling
  reason: a lathe attachment listed under Machinery Axis - tooling, not an operation
- form: Hemming
  reason: 'anticipatory: ''Hem Bending'' is the real row; ''Hemming'' never occurs'
- form: Injection Molding
  reason: 'anticipatory: no molding of any kind is offered; pure word-association from ''metal parts'''
