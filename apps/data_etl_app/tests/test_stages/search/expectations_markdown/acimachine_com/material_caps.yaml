notes: 'The subject is a dealer: it works no material. Every material mention in 3.9MB is (a) construction of a
  resold machine (cast iron base, Meehanite frame, stainless blades), (b) a spec-capacity rating (''Capacity (Mild
  Steel)(in)''), or (c) a cuttable-materials list in third-party marketing (''steel, aluminum, brass, copper, lead,
  plastic and zinc''). Seeded with zero entries per the scale-stress role — these are the known false- positive
  trap. A second pass could promote cuttable-material lists to reseller_inventory entries under strict recall-first;
  the trap catalog below is the more useful signal for this subject. VERIFY 2026-08-26 (second independent pass):
  expected_empty=true AGREED. Independent greps reproduce the seed''s finding - every material occurrence is resold-machine
  construction (''Meehanite processed cast iron frame''), a spec-capacity rating (''Capacity (Mild Steel)(in)''),
  or an OEM cuttable-materials list (''steel, aluminum, brass, copper, lead, plastic and zinc'', JET slitting shears,
  lines 23113/23120/175518). ACI works no material. The ''Lead'' entry is well-founded: ''lead screw'' occurs 5
  times as a machine component. Recording the same recall-first tension the seed noted, because it is now a live
  inconsistency: process_caps kept ONE representative reseller_inventory probe (entry 0010, ''precision sawing'')
  for exactly this pattern of third-party marketing prose, so leaving material_caps and industries at zero while
  process_caps carries a probe means the three files score the same class of text three different ways. Whichever
  way the user rules, all three should settle together.'
