eval_set_version: 5
expected_empty: false
notes: 'REVERSED from the pre-cutoff seed''s exclusion policy, per current task instruction: the dealer''s resold
  third-party machines ARE made artifacts this field should find (actor=reseller_inventory) - a finished machine
  is itself a product that came out of manufacturing work, a separate question from the equipments field''s ''production
  capability''. This is deliberate double-coverage with equipments, not a mistake. Seeded a representative, brand-spread
  SAMPLE (not exhaustive) across every one of the 16 brand regions present in this v3 snapshot: front-page featured
  tiles, ACER, SHARP (facet-list bare codes and full description cards), JET (facet-list bare codes incl. the J-2550
  example plus described hoist/sander/lathe cards), HURCO, WATERJET CORP, NOMURA, DAINICHI, EXPAND MACHINERY (incl.
  the GEN MILL 4024 also seeded under material_caps), WILLIS, CHEVALIER, WELLSAW, AKIRA SEIKI, SHIMADA, PRODUCTIVE
  ROBOTICS (welding-cobot cells and tending packages), and UNI-HYDRO. SKIPPED: the great majority of each brand''s
  facet-listed models (hundreds more JET/HURCO/ACER/SHARP/AKIRA SEIKI codes exist unseeded in this same snapshot
  - this is a sample, not an inventory), the EDM/Laser Markers category (zero listings in this snapshot: ''There
  are no results to display''), and all nav/spec-table/form-label noise.'
