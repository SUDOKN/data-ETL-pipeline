false_friends:
- form: Machining
  reason: overwhelmingly a machine-category name fragment ('Vertical Machining Centers' x3878, 'Gantry Machining
    Centers', 'Horizontal Machining Centers') on resale listings — equipment-name text (E code), not an operation
    ACI performs
- form: Drilling & Tapping
  reason: machine-category name 'Drilling & Tapping Centers' (x78) — equipment text, not an operation
- form: manufacturing
  reason: generic marketing prose plus the 'Manufacturer:' spec label on all 1,291 listings; G code — the subject
    manufactures nothing
