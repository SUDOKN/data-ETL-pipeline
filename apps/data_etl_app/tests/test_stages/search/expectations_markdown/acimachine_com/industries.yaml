- form: Woodworking
  reason: machine-category prefix ('Woodworking Lathes' x455, Woodworking Sanders/ Band Saws/Jointers) — equipment
    types, not a served industry
- form: HVAC
  reason: JET marketing about buyer shop types ('perfect sheet metal forming machines to have in any general fabrication,
    school, racing or HVAC shop') — the OEM's target segment, not ACI's served industry
- form: racing
  reason: same JET buyer-shop-type sentence; word-association
- form: SHARP Industries
  reason: manufacturer company name ('SHARP Industries is offering a new model') — 'Industries' here is a corporate
    name token, not a sector
- form: Energy
  reason: 'POLYSEME, not word-association (corrected 2026-08-26; the seed''s reason ''no energy-sector sense in
    the file'' was FALSE). Two senses: Uni-Hydro shear mechanics prose (''uses pivot arms to transfer energy to
    three pressure points'', 6 lines) AND a genuine sector sense in Hurco marketing (''aerospace and energy parts''
    / ''the aerospace and energy sectors'', 10 lines). Neither is a sector claim by ACI, so it stays a false friend
    - but judge it as third-party sector prose, not as word-association.'
- form: commercial and industrial
  reason: JET hoist marketing 'operate in commercial and industrial applications' (68 lines) — generic application
    prose, not a sector claim by ACI
- form: industry proven
  reason: generic adjective on every JET hoist listing ('the industry proven DC electro-magnetic brake') - 'the
    trade', not a named sector
- form: the standard in the industry
  reason: WELLSAW 1016/1316S-SA marketing claim ('The standard in the industry since 1933') - same generic sense
    of 'industry' as the trade, not a sector
- form: commercial and industrial applications
  reason: JET SSC-hoist marketing ('operate in commercial and industrial applications') - generic application language,
    not a sector claim
- form: mining
  reason: 'substring-of-''examining'' trap: the only case-insensitive hit sits inside the Terms of Service (''...responsible
    for exam[INING] or evaluating...'') - zero genuine mining-sector mentions'
- form: mold
  reason: AKIRA SEIKI application-list item ('mold, aerospace, medical, semiconductor...') names a process/tooling
    domain, not an economic sector
- form: market
