eval_set_version: 3
expected_empty: true
notes: 'Word-boundary greps for ISO/AS9100/IATF/NADCAP/ASTM/ANSI/ASME: zero hits in 3.9MB. ACI itself claims no
  certification anywhere. The single standard-like designation is CSA/CUS on the electrics of resold Elite machines
  (4 lines) — kept as one reseller_inventory candidate below, consistent with ''(almost) nothing in-field''. Any
  yield beyond CSA/CUS is junk-minting signal. VERIFY 2026-08-26 (second independent pass): expected_empty=true
  AGREED and entry 0001 confirmed (all three evidence quotes verbatim). Independent word-boundary greps reproduce
  zero hits for ISO 9001 / ISO 13485 / ISO 14001, AS9100, IATF, NADCAP, ASTM, ANSI, ASME, RoHS, ITAR, OSHA, ''accredit'',
  ''registrar'' and ''compliance''. ONE GAP FOUND that the seed missed: two further conformity marks are present
  which entry 0001''s acceptable_forms do not cover - ''1/2 HP UL/CSA motor'' (line 189877) and ''Its 1/2HP, UL
  motor offers great versatility'' (line 209664), both JET resold-machine spec prose. Word-boundary ''UL'' occurs
  5 times. Not added here per the no-add rule; a future pass should either extend 0001 to cover ''UL/CSA'' or seed
  a second reseller_inventory entry, otherwise a run returning ''UL/CSA'' scores as neither recall nor false friend.'
