false_friends:
- form: certified
  reason: bare adjective appears only in third-party machine marketing; G code without the CSA/CUS designation attached
- form: patented
  reason: Uni-Hydro marketing 'a patented system' (3 lines) — an IP claim, not a conformity attestation
- form: warrant
  reason: Terms of Service legal-disclaimer boilerplate only ('we do not warrant...', 5 occurrences) - no certification
    sense anywhere
- form: standard
  reason: '46 occurrences, all the generic adjective: ''are all standard'' (included by default - hoist/saw spec
    prose), ''the standard in the industry'' (benchmark/leader - WELLSAW marketing), ''any standard 2D cutting job''
    (typical - WATERJET CORP marketing) - never a technical or compliance standard'
- form: Warranty
  reason: 'Productive Robotics product-warranty period (''Warranty: 3 years on Blaze Laser Cell, Blaze Cobot and
    Miller(R) Welders'') - a warranty term, not a conformity attestation'
