false_friends:
- form: Anodic oxidation
  reason: 'anticipatory: the text says ''anodizing'' (1621) and ''anodized'' (1458); the formal synonym never appears.'
- form: Shot peening
  reason: 'anticipatory: ''sand blasting'' is named (1621), peening never is.'
- form: Coordinate measuring
  reason: 'anticipatory: no CMM anywhere in this slice; the metrology sold is hardness testers, microscopes, vision
    measuring machines and profile projectors.'
- form: Product Finder / Product Locator Service
  reason: 'witnessed (2095): a sourcing service run on a supplier database and AI tools, not an operation performed
    on the work.'
- form: Life Cycle Engineering
  reason: an environmental design concept the page itself says 'is not so much a quality concept'; not an operation
- form: Value Added Manufacturing
  reason: a commercial positioning term the page admits 'is not directly related to quality management'; not an
    operation
- form: Robustness in Design
  reason: a design property listed among quality focus areas, not an operation
- form: Metal Thinning
  reason: 'reads as a forming operation but names a corrosion DEFECT the thermal imager looks for: ''Corrosion Damage
    and Metal Thinning, Flaw Detection'''
- form: penetration testing
  reason: network-security testing ('Generate traffic for penetration testing'), not weld penetration or any operation
    on the work
- form: Data acquisition
  reason: an instrument feature ('Data acquisition feature to record maximum and minimum readings'), not a manufacturing
    operation
- form: troubleshooting
  reason: a service/diagnostic activity performed with the resold instruments, not an operation on the work
- form: Lean
  reason: 'witnessed as a substring only: every occurrence is inside ''cLEANliness'', ''cLEANer'', ''cLEANing''.
    No lean manufacturing programme is claimed'
- form: Necking
  reason: 'witnessed: a failure mode described in the tensile-test explainer (''necking occurs on the specimen''),
    not an operation performed on the work'
- form: Barreling
  reason: 'witnessed: a deformation phenomenon the compression-test explainer says is PREVENTED (''a phenomenon
    known as barreling is prevented''), not an operation'
- form: Outgassing
  reason: 'witnessed: an unwanted vacuum-system effect to be minimised, not an operation'
- form: Pitting
  reason: 'witnessed: a defect that ultrasonic gauges detect (''detection of pitting or porosity''), not an operation
    performed on the work'
- form: Delamination
  reason: 'witnessed: a defect (''delaminations parallel to the outside surface''; ''delamination occur under prolonged
    UV exposure''), not an operation'
- form: 3D Printing
  reason: 'anticipatory: never occurs; ''rapid sheet metal prototyping'' and ''design, prototype'' are the likely
    sources'
- form: Product Finding & Locating Services
  reason: 'witnessed: a sourcing/brokerage service in the nav bar, not a manufacturing operation'
- form: throttling
  reason: 'witnessed: a valve service description (''on/off, non-throttling service''), not an operation performed
    on the work'
- form: packing
  reason: 'witnessed: ''Flange packings'' is a seal product and ''the packing area'' is a valve region; neither
    is a packaging operation'
- form: swirling
  reason: 'witnessed: air-stream behaviour inside a filter housing, not an operation'
- form: kinking
  reason: 'witnessed: a hose failure mode the braid prevents, not a process'
- form: outsourcing
  reason: a commercial service repeated in the page furniture, not an operation performed on the work
- form: procurement
  reason: a purchasing activity - "Domestic, Global Procurement of Industrial Products"
- form: Design of Experiments
  reason: an engineering method used in simulation, not an operation performed on material
- form: binning
  reason: a data operation - semiconductor test results are "sorted into virtual bins"
- form: yield analysis
  reason: a data-analysis activity, not an operation on the work
- form: pulse compression
  reason: acts on a laser pulse, not on the workpiece
- form: beam splitting
  reason: acts on light, not on material
- form: orbital hybridization
  reason: a chemistry concept describing nanotube bonding, not an operation
- form: cell culture
  reason: a laboratory assay run on a microfluidic chip, not a manufacturing operation
- form: DNA hybridization
  reason: a laboratory assay, not a manufacturing operation
- form: Drug screening
  reason: a laboratory application of the chips, not an operation on the work
- form: Protein crystallization
  reason: a laboratory application, not a manufacturing operation
- form: Microprocessor cooling
  reason: an application of microfluidics, not an operation performed in production
- form: programming an FPGA
  reason: configuring a chip's logic, not an operation performed on materials
- form: shearing
  reason: '''shear'' occurs only as a load or failure mode (''loading is primarily in shear'', ''the key will shear
