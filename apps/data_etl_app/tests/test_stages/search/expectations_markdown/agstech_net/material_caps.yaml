- form: Lead
  reason: 'witnessed: every occurrence is non-material -- ''These properties lead to a wide use'' (1762), ''shorter
    lead times'' (1965), ''gold wires from the package leads'' (2792), ''lead times'' (351). Elemental lead is never
    named in lines 1-4463.'
- form: 6061 aluminum
  reason: 'anticipatory: ''aluminum'' appears three times but no alloy or temper designation ever does'
- form: 304 stainless
  reason: 'anticipatory: ''stainless steel'' appears with no grade designation anywhere in this slice'
- form: Plasma
  reason: named as a state of matter in the plasma-cutting explainer ('plasma can be described as the fourth state
    of matter'), not as a work material
- form: Ice
  reason: part of the states-of-matter analogy on the plasma page ('these three states are ice, water and steam')
- form: foods
  reason: a substance a differential scanning calorimeter can analyse ('waxes, foods, oils and lubricants'), not
    a material any work here is made from or performed in
- form: coffee
  reason: a colorimeter application ('roasted coffee'), not a manufacturing material
- form: butter
  reason: a colorimeter application ('food such as butter, french fries, coffee'), not a manufacturing material
- form: Hall Effect
  reason: 'witnessed: a measurement principle (''based on the theory of Hall Effect''), not a substance'
- form: Rayleigh
  reason: 'witnessed: a wave mode and a refractometer type (''A surface or Rayleigh wave''), not a substance'
- form: Monel
  reason: 'anticipatory: never occurs'
- form: green compact
  reason: 'witnessed: the name of a pressed-but-unsintered part state, not a material'
- form: gob
  reason: 'witnessed: a portion of molten glass being handled, not a material designation'
- form: Corning
  reason: a glass supplier's company name, not a material
- form: Schott
  reason: a glass supplier's company name, not a material
- form: Pantone
  reason: a colour system, not a substance
- form: Titanium Nitride
  reason: 'anticipatory: the text names TiAlN and TiC, so TiN is an easy word-association mint; it appears nowhere
    in the file'
- form: buckyball structure
