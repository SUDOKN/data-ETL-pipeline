false_friends:
- form: CNC machining
  reason: the subject's own service; returned as an industry it is the O code (own activity presented as sector)
- form: Manufacturing
  reason: 'generic (G): ''precision manufacturing'', ''Overall Manufacturing Industry'' stats header'
- form: Mold Industry
  reason: certification-statistics table column header (industry-wide adoption rates), not a sector the subject
    serves
- form: Precision Machining Industry
  reason: certification-statistics table column header; also O-code own-activity (verbatim form carries a non-breaking
    space U+00A0 between the last two words)
- form: kitchen equipment
  reason: 'word-association: stainless steel explainer blurb ''used in medical devices and kitchen equipment'''
- form: plumbing
  reason: 'word-association: brass explainer blurb ''commonly used for plumbing fixtures and decorative items'''
- form: infrastructure
  reason: 'word-association: mild steel explainer blurb ''ideal for infrastructure and automotive parts'''
- form: Packaging
  reason: dominant senses are protective shipment packaging and a client's packaging-line machinery; never a sector
    served
- form: logistics
  reason: appears as 'international logistics' (shipping) and a client's 'logistics vehicles'; not a served sector
    designation
