  evidence:
  - quote: obtained its official D-U-N-S® Number from Dun & Bradstreet
    approx_offset: 139134
  notes: 'borderline (B) and dispute-prone: a business registry identifier, but the text itself calls it a certification.
    DISPUTED (verify-agent-alecmfg 2026-08-26): the D-U-N-S Number is a Dun & Bradstreet business registry identifier
