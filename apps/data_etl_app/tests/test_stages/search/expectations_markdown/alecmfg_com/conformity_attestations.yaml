false_friends:
- form: certified
  reason: generic (G)
- form: certification
  reason: generic (G) without a standard id
- form: compliance
  reason: generic (G)
- form: material certs
  reason: generic document mention, no standard id (D/G)
- form: Type II
  reason: anodize class shorthand in spec lines ('Clear anodized (Type II)'); no standard id attached
- form: H7
  reason: ISO fit class on a reamed bore ('H7 reaming'), a spec attribute, not an attestation
- form: EN AW-7475-T7351
  reason: EN material designation; belongs to material_caps, not conformity
- form: EN AW 7075-T6
  reason: EN material designation; belongs to material_caps
- form: EN AW-6082 T6
  reason: EN material designation; belongs to material_caps
