false_friends:
- form: AS9100
  reason: never occurs; a military/marine shop with a CAGE code invites it
- form: NADCAP
  reason: never occurs; the finishing and welding capability pages invite it
- form: ITAR
  reason: 'SECOND SUBSTRING TRAP. ''ITAR'' occurs 16 times and every single one is inside the word MILITARY. Standalone
    ITAR: zero. The Navy/Marines/Coast Guard content makes it a very likely fabrication, and a naive substring matcher
    would score it as present 16 times.'
- form: ISO 13485
  reason: never occurs; the blog's one 'medical device manufacturing' mention invites it
- form: IATF 16949
  reason: never occurs; the RAIL & AUTOMOBILE page invites it
- form: AWS D1.1
  reason: never occurs; only the bare phrase 'AWS certified welders' is claimed, never a code
- form: ISO 14001
  reason: never occurs
- form: Equal opportunity employer
  reason: a hiring policy statement on the careers page, not an attestation with an issuing body
- form: 401(k)
  reason: an employee benefit in the careers list; the parenthesised code makes it look like a standard number
