context: 'Blackstone Advanced Technologies, LLC - a 275,000 sq ft full-service sheet metal job shop in Jamestown
  NY (woman-owned, ISO 9001:2015). Two published machine lists (/about-us/facility/ and /capabilities/machinery/)
  make this the most equipment-dense subject in the corpus, and the real depth is at EQUIPMENT-PARAMETER level (130-320
  ton press brakes, a 44-station turret, 55 punching tons) rather than at exotic-process level. It also carries
  a genuine own-brand catalogue: 7 named Navy/marine furniture items. THE TRAP: ~22 first-person-plural SEO blog
  articles explain the metalworking industry at large, and they name deep processes the shop does not perform (Deep
  Drawing, Hot Working, Cold Rolling, Pickling, Spinning, Ironing, Hydroforming, Decambering, Perforating, Heat
  Straightening). Those are SEEDED AS ENTRIES with actor: unknown, because the SEARCH stage extracts in-field designations
  the text NAMES and attribution is a downstream stage''s job - returning them is correct search behaviour, not
  a defect.'
