sampling_notes: 'READ EXHAUSTIVELY - all 6,289 lines / 246 KB / 67 page blocks, in 20 sed slices (1-270, 270-625,
  625-1010, 1008-1420, 1420-1730, 1730-2075, 2075-2460, 2460-2790, 2790-3130, 3130-3460, 3460-3745, 3745-3940, 3939-4185,
  4185-4500, 4500-4800, 4800-5120, 5120-5420, 5420-5760, 5760-6060, 6060-6289). Then targeted greps: word-boundary
  hem[a-z]* (the reported Hemming trap); every standards acronym (ISO ASTM ATSM ANSI NADCAP AS9100 ITAR AWS ASQC
  SAE AISI UNS ABYC OSHA CAGE NAICS); all 121 distinct -ing words by frequency; every reported blog process by name;
  alloy/grade digit patterns; a full non-ASCII character census. Unique content is the 2 machine lists, 8 capability
  pages, 4 industries pages, the news page and 22 blog posts; the remaining ~30 blocks are duplicates, blog category
  indexes, job postings and the repeated NAICS/CAGE footer (48 copies).'
notes: 'products.yaml doubles as the contract_products expectation. The subject is BOTH a contract shop (transportation/industrial/scientific
  parts made to customer print) and an own-brand catalogue vendor (7 standard Navy/marine furniture items). TWO
  SUBSTRING TRAPS FOUND, both witnessed: (1) ''hem'' has 55 substring hits of which 47 are them/chemical/mathematical,
  and the process word ''Hemming'' occurs ZERO times - but ''hems'' DOES occur as a real first-party design capability
  in the design blog, so the entity is real and only the -ing form is the false friend; (2) ''ITAR'' occurs 16 times
  and is EVERY time the middle of the word ''MILITARY'' - standalone ITAR is zero. CORRECTION TO THE VETTING NOTE:
  roll forming is NOT blog-only - it is listed as a first-party service on /capabilities/ line 548, and sheet metal
  rolling has its own capability section plus a ROLLING equipment heading (4ft Niagara, Buffalo Channel, 4'' bending
  roll). What they lack is a sheet-thinning rolling MILL, which is what the cold-rolling blog is about.'
