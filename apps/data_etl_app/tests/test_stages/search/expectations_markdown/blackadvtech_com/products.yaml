  laboratory furniture, industrial enclosures - which stay entries under recall-first with actor: client where the
  text attributes them. A third population is blog-explainer artifacts (soda cans, kitchen sinks, school lockers,
  racing-car chassis) that Blackstone never claims to make; those carry actor: unknown.'
