subject: blackadvtech.com
field: equipments
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/blackadvtech.com.txt
  sha256: 40a6e76de90db2477b362b973f21897e40db88f0fd40b790c475bfe250ed6e65
eval_set_version: 5
expected_empty: false
notes: 'The richest equipments inventory in the corpus: /about-us/facility/ publishes 92 numbered machines and /capabilities/machinery/
  publishes a second, partly different fleet with capacities. SEEDED TO THE PROMPT''S BOUNDARY, not to the everyday
  sense of ''equipment'': a production machine acts on the work itself. So the QUALITY CONTROL block (Faro Arm,
  Positector, Glossmeter, Sharp Edge Tester) and the CMM/calipers/micrometers in the QC Inspector posting are METROLOGY
  and are false_friends here, not entries; the March 360 sheet loader, lift tables, dock levellers and overhead
  crane are MATERIAL HANDLING; the dust collectors, boilers, sprinklers, bus-duct wiring and lighting are PLANT
  UTILITIES; dies, punches, grinding wheels, chucks and grid tables are TOOLING; and the six CAD/MRP packages are
  software. All of those are recorded as false_friends so the judged pass can count them, exactly as the alecmfg
  false-RED lesson prescribes.'
