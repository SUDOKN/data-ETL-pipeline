subject: med-tekinc.com
field: process_caps
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/med-tekinc.com.txt
  sha256: 1ace86accab9f77cd8cbdcebb9afda9c27f198cfc8b7e22de92ec05153d68023
eval_set_version: 2
expected_empty: false
notes: 'Richest field on the site and the reason it is in the corpus: 32 entries, most of them from the BARE KEYWORD
  LIST at lines 78-97 where each process is a whole line with no sentence around it. Three surface spellings of
  the core capability coexist (''heat treating'', ''heat-treating'', ''heat‑treating'' with U+2011) - see hazards.
  DEFENSIBLE BORDERLINES deliberately NOT seeded and NOT listed as false friends, per the 101machine convention
  for code-B forms: ''Distortion Minimization'' (line 109 - an outcome of the polymer quench, not an operation),
  ''accuracy-verified against the standard block'' (line 32 - a measurement performed on the MACHINE, not on the
  work, so outside the prompt''s ''performed on the work'' clause) and ''Controlled Atmospheres'' was kept as an
  entry rather than a borderline because it is a listed service line.'
