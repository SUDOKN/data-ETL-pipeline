notes: 'Six entries, all from the one equipment block at lines 104-109, and all of them genuine production machines:
  a furnace or a salt bath acts on the work itself. SEEDED TO THE PROMPT''S BOUNDARY, NOT THE WORD ''EQUIPMENT'':
  ''Rockwell Hardness Machines'' (line 32) is the site''s only other machine noun and it is EXCLUDED - the clause
  separates a production machine from ''equipment that only measures, inspects, or tests the work'' - so it is a
  false friend here and a process_caps entry instead. Same for the standard block (tooling for that tester) and
  the three indoor loading docks (''moves, stores, or carries''). This is the alecmfg 2026-08-27 lesson applied
  up front. NOT seeded, as a defensible borderline rather than a false friend: the individual ''Austemper Bath''
  and ''Marquench Bath'' vessels, which are parts of the seeded Salt Bath Line and are seeded as process_caps.'
