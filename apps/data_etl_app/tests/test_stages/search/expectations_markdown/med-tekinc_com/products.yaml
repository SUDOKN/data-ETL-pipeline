notes: 'SHARED OUTPUT NOTE: products and contract_products share one physical search request; this file is the expectation
  set for BOTH. expected_empty=true. MED-TEK is a toll processor - it sells furnace time on parts that arrive and
  leave as the customer''s - and, checked against the field''s clause rather than that business fact, the text still
  names NO made artifact. Everything the work is described as coming out of is a generic placeholder with no designation
  content: ''the final product'' (lines 14, 19), ''one piece or a thousand pieces'' (line 32), ''your metals'' (line
  32, a material), ''huge heat-treating jobs'' (line 100, a job not an artifact). The only concrete manufactured
  objects named anywhere are the furnaces, the salt baths, the Rockwell testers, the standard block and the loading
  docks - all excluded by the clause''s carve-out for ''the machinery, tooling, and facilities the work is done
  with''. Following the 101machine convention, the generic output nouns are recorded as false friends rather than
  as disputed entries. Any sizable yield here is junk-minting signal.'
