notes: 'SHARED OUTPUT NOTE: products and contract_products share one physical search request; this file is the expectation
  set for BOTH. expected_empty=true, re-verified against the v3 markdown snapshot (full read of all 136 lines, plus
  a grep sweep for product/part/component/system/item/gear/shaft/valve/bracket/housing/assembly/unit/fitting/fastener/bolt/nut/bearing/spring
  - zero hits beyond ''final product''). MED-TEK is a toll processor - it sells furnace/bath time on parts that
  arrive and leave as the customer''s - and, checked against the field''s clause rather than that business fact,
  the text still names NO made artifact. Everything the work is described as coming out of is a generic placeholder
  with no designation content: ''the final product'' (lines 7, 13), ''one piece or a thousand pieces'' (line 31),
  ''your metals'' (line 31, a material), ''huge heat-treating jobs'' (line 75, a job not an artifact). The only
  concrete manufactured objects named anywhere are the furnaces, the salt baths, the Rockwell testers, the standard
  block and the loading docks (line 15) - all excluded by the clause''s carve-out for ''the machinery, tooling,
  and facilities the work is done with''. Following the 101machine convention, the generic output nouns are recorded
  as false friends rather than as disputed entries; ''tools'' and ''dies'' are added as further anticipatory false
  friends off the ''Tool Hardening'' service line. Any sizable yield here is junk-minting signal.'
entries: []
false_friends:
- form: final product
  reason: WITNESSED (lines 14 and 19) - a generic reference to whatever the customer sent in, carrying no designation
    content. The strongest product-shaped string in the file
- form: pieces
  reason: WITNESSED (line 32, 'one piece or a thousand pieces') - batch-size language about the customer's parts,
    not a product designation
- form: standard block
  reason: 'WITNESSED (line 32) - a manufactured object, but the hardness tester''s reference artifact: tooling for
    a measuring device, excluded by the clause'
- form: loading docks
  reason: WITNESSED (line 21) - a facility, explicitly carved out by the clause
- form: gears
  reason: ANTICIPATORY - zero occurrences. The archetypal carburized/induction-hardened part; pure word association
    from the process list
- form: shafts
  reason: ANTICIPATORY - zero occurrences. Same association, reinforced by 'Spin Hardening' and the induction scanner
- form: product
  reason: '''the final product is strong & durable for use'' — generic reference to the client''s treated part,
    no specific artifact class named; products field has no qualifying entries in this text.'
- form: tools
  reason: ANTICIPATORY - zero occurrences of 'tools' or 'tooling'. The only adjacent string is the service name
    'Tool Hardening' in the bare keyword list, which means MED-TEK hardens tooling brought in by others, not that
    it makes tools
- form: dies
  reason: ANTICIPATORY - zero occurrences. Tool-and-die heat treating is the archetypal job implied by 'Tool Hardening';
    pure word association, not text
