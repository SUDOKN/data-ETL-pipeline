eval_set_version: 2
expected_empty: false
notes: 'Ten entries, but only four (metal, steel, aluminum, nitrogen) are named as substances outright; the rest
  come in through two explicit clauses in the material prompt. (a) ''a substance that the work is ... performed
  in'' admits the furnace atmospheres and the quench media - salt, oil, polymer, endothermic gas, air. (b) ''A process
  or treatment named after a substance it deposits on or diffuses into the work does imply that substance, and qualifies''
  admits Nitriding/Carbonitriding (nitrogen) and Carburizing/Carbonitriding (carbon). Entry ''carbon'' has NO direct
  mention anywhere in the file and exists only through clause (b) - it is the sharpest test in this subject of whether
  search applies that clause, and the likeliest source of a defensible miss. There are no alloys or grade designations
  anywhere: a sweep for 3-4 digit runs found only temperatures, KW ratings, load capacities, a ZIP and a phone number.'
