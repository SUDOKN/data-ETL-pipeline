- id: med-tekinc_com-material_caps-0008
  name: air (furnace atmosphere)
  status: disputed
  acceptable_forms:
  - Air Atmospheres
  evidence:
  - quote: With Air Atmospheres and Operating Temperatures
    approx_offset: 3843
  notes: BORDERLINE. Air is literally 'a substance that the work is performed in' and the text names it as the pit/box
    furnaces' atmosphere, so it is seeded - but a run that declines air as too generic to be a material capability
    is defensible, and this entry should be retired rather than counted as a miss if a later pass agrees | 'With
    Air Atmospheres and Operating Temperatures Of 200 to 1,450 Degrees Fahrenheit' is real text, but air as a MATERIAL
    is a genuine boundary call. The clause covers 'a substance that the work is made from or performed in'; nitrogen
    and endothermic gas are supplied process gases named as substances, whereas an air atmosphere is what a draw
    furnace contains when no atmosphere is supplied - i.e. a process condition rather than a substance the shop
    stocks or works in. Confirming it would charge a recall miss against a stage that reads it that way, which is
    the false-RED direction this harness has already fired in once. Kept on the record, not gating.
  provenance:
  - action: added
    by: seed-agent-med-tekinc-com
    date: '2026-08-27'
    source: corpus-seed
  - action: disputed
    by: verify-agent-med-tekinc
    date: '2026-08-27'
    reason: '''With Air Atmospheres and Operating Temperatures Of 200 to 1,450 Degrees Fahrenheit'' is real text,
