false_friends:
- form: Vacuum
  reason: 'WITNESSED (3 lines: 97, 104 twice) - ''Vacuum Heat Treating'', ''Vacuum Furnaces'', ''Vacuum or Nitrogen
    Atmospheres''. Vacuum is the ABSENCE of an atmosphere, not a substance the work is made from or performed in;
    it sits in exactly the slot where nitrogen and endothermic gas (which ARE materials) sit'
- form: Bar
  reason: WITNESSED (line 104) - 'Up To Two Bar Pressure Quench' is a unit of PRESSURE. Reads as bar stock, which
    is the single most likely material misread in the file
- form: Gas
  reason: WITNESSED (lines 105, 106) - 'Gas Fired' / 'Gas-Fired' names the furnaces' FUEL, not a substance the work
    is made from or performed in
- form: Stainless Steel
  reason: ANTICIPATORY - 'stainless' occurs zero times; only bare 'Steel' is named. Word association from a heat
    treater's usual material list
- form: Tool Steel
  reason: ANTICIPATORY - zero occurrences. Very likely to be minted from the service-list line 'Tool Hardening'
- form: Titanium
  reason: ANTICIPATORY - zero occurrences; no alloy or grade designation appears anywhere in the file
