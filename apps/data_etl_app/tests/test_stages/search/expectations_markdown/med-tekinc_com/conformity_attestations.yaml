subject: med-tekinc.com
field: conformity_attestations
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/med-tekinc.com.txt
  sha256: 7ed418d9a144bb99e67c873f1468279c915f3c116a2be4f37228f92c2cb692ab
eval_set_version: 3
expected_empty: true
notes: 'expected_empty=true, and BAITED: the site talks about certification twice while holding none. Word-boundary
  greps for ISO, ISO 9001, AS9100, IATF, NADCAP, ASTM, ANSI, ASME, AMS, API, UL, CE, EN, ITAR, RoHS, OSHA, FDA,
  SAE, AWS, AISI and PPAP all return ZERO hits - NADCAP in particular, which is THE heat-treating accreditation
  and is the single most likely thing to be fabricated for this subject. The certification vocabulary sweep (certif|accredit|registr|standard|complian|qualif|approv|audit|conform)
  matches exactly two lines, both recorded below as false friends: line 25 offers to ISSUE ''laboratory and specification
  certifications'' to a customer on request - a deliverable about someone else''s parts, with no name, number, mark
  or issuing body, and nothing MED-TEK holds, meets or follows - and line 32 says the Rockwell testers ''are certified
  every six months'', which is a calibration interval for a machine, not a certification with an identity of its
  own. Both fail the clause''s ''identity of its own'' test, so neither is seeded even as a disputed entry. One
  further near-miss noted but NOT listed as a false friend because no plausible run would return it: the string
  ''Reach'' occurs (four times) only as the verb in ''Reach Out to Us'', never as the EU REACH regime.'
entries:
- id: med-tekinc_com-conformity_attestations-0001
  name: Laboratory and Specification Certifications
  status: disputed
  acceptable_forms:
  - laboratory and specification certifications
  evidence:
  - quote: An on-staff metallurgist can deliver laboratory and specification certifications if requested.
    approx_offset: 1115
  notes: no specific standard, mark, or issuing body is named — generic 'certifications' offering. Disputed per
    the brief's guidance for identity-less certification mentions.
  provenance:
  - action: added
    by: seed-agent-med-tekinc-com
    date: '2026-08-27'
    source: corpus-seed
false_friends:
- form: specification certifications
  reason: WITNESSED (line 25) - the shorter span of the same bait, and the likelier return since the prompt asks
    for short designations
- form: certified every six months
  reason: WITNESSED (line 32) - a calibration interval for the Rockwell hardness testers. Uses the word 'certified'
    about equipment upkeep, not about any attestation held
- form: standard block
  reason: WITNESSED (line 32) - contains the word 'standard' but names a physical reference block for hardness-tester
    verification, not a published standard
- form: NADCAP
  reason: ANTICIPATORY - zero occurrences. The aerospace heat-treating accreditation and the highest-prior fabrication
    for a commercial heat treater; only invention can hit it
- form: ISO 9001
  reason: ANTICIPATORY - zero occurrences of 'ISO' at all. The default certification hallucination for any manufacturer
- form: AS9100
  reason: ANTICIPATORY - zero occurrences; pairs with the absent aerospace industry claim
- form: certified
  reason: '''Rockwell Hardness Machines are certified every six months'' — routine equipment calibration, not a
    named certification/standard the company holds.'
- form: AMS 2750
  reason: ANTICIPATORY - zero occurrences of 'AMS' or '2750' anywhere in the v3 snapshot. The aerospace furnace-pyrometry/instrumentation
    standard paired with NADCAP heat-treat accreditation; the text's own calibration language ('certified every
    six months', 'accuracy-verified against the standard block') is exactly the detail that invites this fabrication
    for a heat treater
- form: CQI-9
  reason: ANTICIPATORY - zero occurrences. The AIAG Heat Treat System Assessment, the automotive-industry analog
    to NADCAP for heat-treating suppliers; as plausible an invention as the already-recorded NADCAP/AS9100/ISO 9001
