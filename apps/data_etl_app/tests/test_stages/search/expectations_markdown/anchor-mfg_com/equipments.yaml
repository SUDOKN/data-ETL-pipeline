expected_empty: false
notes: Rich but entirely UNBRANDED - no make/model names anywhere; every machine is a specific category with counts/specs
  ('Over 60 presses, 2000 ton to 110 ton', '4,000 Watt CNC Laser'). Expect mostly B-grade category designations.
  Spec-only lines ('Up to 240in. (6m) Bed Size', 'Stroke Length up to 20 in.', 'Interchangeable', 'Quick Change')
  are S-code attributes of the seeded machines, not separate entities. Tooling-type words (Progressive / Transfer
  / Single Hit / Deep Draw) are T-code tooling, deliberately not seeded as equipment. VERIFIER 2026-08-26 - independent
  pass - all 11 entries confirmed, all 12 quotes verbatim, none resting on T&C text (every quote resolves to /capabilities-services/).
  expected_empty false AGREED. false_friend concern - 'machine' is contained in entry 0011's accepted form 'Milling
  Machines', so one returned form would both satisfy recall and score as a false friend; that false friend wants
  narrowing to the 'machine readable files' sense.
