false_friends:
- form: machine readable files
  reason: employee-portal No Surprises Act health-plan transparency files ('digital representation of data') - U
    junk, not machinery
- form: Employee Navigator
  reason: benefits-website brand name - looks like a named tool, is neither machine nor shop software
- form: Special Tooling
  reason: purchasing-T&C DEFINED TERM for Purchaser-owned property ('tools, equipment, material, drawings ... (Special
    Tooling)') - legal term of art, not a machine designation
- form: equipment
  reason: generic (G) - 'equipment redundancy' marketing and T&C 'parts or equipment'
- form: Bulletin Board
  reason: employee-benefits website feature - U junk
- form: mechanical breakdown
  reason: force-majeure list in the seller T&Cs - an event, not a machine
- form: tooling
  reason: bare form names the tool & die PRODUCT line ('fabricated parts and tooling') and the T&C Special Tooling
    term - as an equipments return it is the known product/tooling confusion (code D/T), the real entities being
    the dies the shop builds
- form: machine
  reason: bare form occurs only inside 'machine readable files' and 'Milling Machines' - no standalone machine designation
- form: Hexagon Global S
  reason: a CMM (coordinate measuring machine) in the metrology lab; measuring equipment is explicitly excluded
    from equipments
- form: CMM
  reason: measuring/inspection equipment explicitly excluded from equipments by definition; the inspection activity
    belongs in process_caps instead
- form: Optical Comparator
  reason: measuring equipment (optical comparator) excluded from equipments
- form: Blue Light Scanner
  reason: measuring/scanning equipment excluded from equipments
- form: Tensile Testers
  reason: testing equipment excluded from equipments; the operation belongs in process_caps as tensile testing
- form: Programmable Logic Controllers
  reason: a process-control system that conditions/controls the plant, not a machine acting directly on the work
- form: vision systems
  reason: an inspection/measurement technology, excluded from equipments by definition
- form: PLEX
  reason: an ERP software system, not a production machine
- form: Artificial Intelligence
  reason: a general technology descriptor with no equipment identity of its own
- form: NX/Unigraphics
  reason: CAD/design software Anchor uses for tooling design, not production machinery
- form: SolidWorks
  reason: CAD design software, not production machinery
- form: Catia
  reason: CAD design software, not production machinery
- form: Autodesk Suites
  reason: design software, not production machinery
