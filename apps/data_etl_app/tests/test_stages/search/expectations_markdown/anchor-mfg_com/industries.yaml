false_friends:
- form: Metal Stamping
  reason: the subject's OWN process presented as capability headings and self-description ('As a metal stamper')
    - returned as an industry it is code O (own activity as sector)
- form: Tool & Die
  reason: own business line ('a stand-alone tool and die business') and own-name footer ('Anchor Tool & Die Co.'
    on all 15 pages) - code O as an industry
- form: Manufacturing
  reason: generic (code G) - 'Anchor Manufacturing', 'manufacturing space', 'Tier I and Tier II manufacturers';
    never a sector-served designation
- form: Food
  reason: word-association (code W) from agriculture marketing filler ('the food we eat', 'food chain'); no food-industry-served
    claim anywhere
- form: Transportation
  reason: word-association (code W) from 'popular means of transport' in the commercial-vehicle prose; transportation
    is never named as a served sector
- form: OEM
  reason: customer tier, not an industry - 'North American, European, and Asian OEM's' names who Anchor sells to
    across sectors
- form: Tier I and Tier II
  reason: customer tiers ('Tier I and Tier II manufacturers'), not a sector designation
- form: enclosures
  reason: on the fabrication page this names a product Anchor makes, not a market it serves
