expected_empty: false
notes: Conformity is present ONLY as supplier-portal DOCUMENT TITLES - two certificate titles listed identically
  on /supplier-portal/ and /supplier-portal-2/. No standard id appears in prose anywhere (no ISO/IATF-16949-numbered/ASTM/NADCAP
  strings outside these titles). These titles ARE in-text designations and are seeded as must-find with evidence_kind
  doc_title; the rest of the file is a false-friend minefield (HR 'certificate programs', statutes in legal boilerplate,
  awards, wrong-actor supplier-QA phrases). VERIFIER 2026-08-26 - independent pass - both quotes verify verbatim
  and both entities confirmed. expected_empty false AGREED, but the field is thin - a case-insensitive grep for
  iso / 9001 / 14001 / 16949 / iatf / astm / nadcap / as9100 / ansi / sae / mil- finds no hit anywhere outside these
  two supplier-portal titles, so any sizable yield beyond them is junk-minting signal. Actor own on 0001 and 0002
  is an inference from the portal context (the titles carry no holder name) - unknown would also be defensible.
