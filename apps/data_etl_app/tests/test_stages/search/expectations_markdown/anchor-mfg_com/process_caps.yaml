eval_set_version: 3
expected_empty: false
notes: Very rich field - nearly all of it concentrated in the /capabilities-services/ list dump (offsets ~6500-8000).
  Counter-pressure comes from the two T&C pages - a wrong-actor pump of contractual activity phrases (see false_friends;
  per seeding direction the T&C junk pump is recorded there, including 'inspection', which occurs ONLY inside purchase-order
  boilerplate). Bare section headings 'Assembly' and the tooling-type words 'Progressive' / 'Transfer' / 'Single
  Hit' are defensible borderline returns but too generic/polysemous to require - seeded neither as entries nor as
  false friends. VERIFIER 2026-08-26 - independent pass - all 31 entries confirmed, all 40 quotes verbatim. The
  wrong-actor hypothesis was checked directly - NO entry's evidence lies inside either T&C page body; every quote
  resolves to /capabilities-services/, /, /industries-served/ and its /Anchor/ duplicate, /careers/, /executive-team/
  or /about-anchor-mfg/. The only T&C contact is the bare 'Tool & Die' string in entry 0024, and that is the copyright
  footer, not clause text (see that entry's note). The 'inspection' false friend was re-verified independently -
  every occurrence of inspect-anything in the file sits in purchasing clause 5. false_friend concern - 'engineering'
  is contained in the accepted forms of entries 0027 ('engineering changes') and 0031 ('Engineering Design Support'),
  so those returns would both satisfy recall and score as a false friend. Omissions noted but not added (adding
  entries is out of scope for this pass) - laser cutting has no process entity although both laser lines are seeded
  as equipment, and 'process control' from the defense prose is unseeded either way.
