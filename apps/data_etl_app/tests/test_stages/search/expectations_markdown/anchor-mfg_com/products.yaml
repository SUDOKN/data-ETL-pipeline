false_friends:
- form: goods
  reason: T&C legal generic - not a product designation
- form: Class 8 heavy trucks
  reason: customers' end vehicles (Anchor supplies components INTO them) - client application, code C
- form: buses
  reason: prose 'School and transit buses as well as road coaches' - customers' end vehicles in commercial-vehicle
    prose, code C ('busses' spelling also occurs)
- form: road coaches
  reason: same sentence - customer end vehicles, code C
- form: household items
  reason: consumer-prose application example ('common household items in the kitchen, garage'), code C - where stampings
    end up, not what Anchor offers
- form: toys
  reason: consumer-prose filler ('childrens' toys') - application example, code C
- form: food
  reason: agriculture marketing filler ('the food we eat') - word-association, not a product
- form: company literature
  reason: contact-page offer ('request company literature') - document/literature, code D
- form: Marked Parts
  reason: purchasing-T&C DEFINED TERM (parts bearing Purchaser trademarks) - legal term, not an offering
- form: Special Tooling
  reason: purchasing-T&C DEFINED TERM for Purchaser-owned property - legal term, distinct from the real tooling
    product (entry 0004)
- form: machine readable files
  reason: employee-portal health-plan transparency files - code U junk
- form: samples
  reason: T&C warranty language ('IF SAMPLES WERE EXHIBITED', 'samples furnished') - legal boilerplate, not an offering
- form: Studs, Nuts
  reason: hardware inserted during in-press assembly ('In-press Assembly (Studs, Nuts)') - purchased components
    consumed in the operation, not products offered
- form: MRAP
  reason: the customer's vehicle platform (Mine-Resistant Ambush Protected), not an Anchor-made artifact
