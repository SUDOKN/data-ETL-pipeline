eval_set_version: 3
expected_empty: false
notes: 'Doubles as the contract_products expectation. Mathews makes nothing; every artifact here is a principal''s
  catalogue or custom part, so actor is supplier or unknown. Two special actors: the founder''s 1906 Ford dealership
  inventory is reseller_inventory, and the agency''s own office furniture in the 1892 founding anecdote is a disputed
  edge case. Seeded strictly to the clause, which excludes machinery, tooling, facilities, awards, memberships,
  training, documents, and the names of companies, brands and customer groups - and this site is mostly company
  names, so the false-friend list is long on purpose.'
