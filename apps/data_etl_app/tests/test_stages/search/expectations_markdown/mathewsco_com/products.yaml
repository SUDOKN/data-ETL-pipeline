    approx_offset: 24308
  notes: DISPUTED - chairs and tables are made artifacts and the text names them, which is all the clause literally
    asks; but they are the AGENCY'S 1892 office furniture in a founding anecdote, nothing that comes out of any
    work described here. Recorded rather than dropped because it is exactly the boundary case this subject exists
    to probe. | "started their company with three chairs and two kitchen tables in a loft at 109 California Street"
    - office furnishings in an 1892 founding anecdote. Made artifacts by the letter of the clause, but they come
    out of nobody's manufacturing work as described here and sit closer to the facilities the work is done with.
    Gating on them would fail a run that correctly declines to mint products from company history.
  provenance:
