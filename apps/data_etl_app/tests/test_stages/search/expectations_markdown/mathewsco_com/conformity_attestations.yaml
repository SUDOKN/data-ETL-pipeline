subject: mathewsco.com
field: conformity_attestations
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/mathewsco.com.txt
  sha256: 65791650c81189948bfe50977028cfd141809e36ca848832a61c156eeb867150
eval_set_version: 2
expected_empty: false
notes: 'Mathews holds no quality certification. Every ISO/AS/ASTM/MIL number on the site belongs to a principal,
  most of them stated as a bare trailing token on the Kansas Product Line page (''... ISO 9001''). The MEMBERSHIP-AS-CERTIFICATION
  trap is live: the only credentials the agency claims for itself are three trade-association memberships plus the
  founder''s degree and pilot rating, all seeded disputed per the brief.'
entries:
- id: mathewsco_com-conformity_attestations-0001
  name: Manufacturers' Agents National Association
  status: disputed
  acceptable_forms:
  - Manufacturers' Agents National Association
  - MANA
  evidence:
  - quote: Manufacturers' Agents National Association
    approx_offset: 6196
  - quote: these two MANA member agencies
    approx_offset: 23417
  notes: 'DISPUTED - the MEMBERSHIP-AS-CERTIFICATION question. FOR: it has an identity of its own with a named issuing
    body, and it is something the company specifically holds, which is the clause''s wording verbatim. AGAINST:
    membership is bought by subscription and attests nothing about the company''s people, sites or products; it
    is affiliation, not conformity. This is one of the very few genuinely first-party in-field strings on the whole
    site. | A trade-association membership ("these two MANA member agencies"), which SEEDING_BRIEF section 4 says
    to seed disputed. Separately the form "MANA" is a mechanics hazard: forms over three characters match by case-insensitive
    containment, so it is also matched by "Management" and "Manager", both of which occur in this text.'
  provenance:
  - action: added
    by: seed-agent-mathewsco-com
    date: '2026-08-27'
    source: corpus-seed
  - action: disputed
    by: verify-agent-mathewsco
    date: '2026-08-27'
    reason: 'A trade-association membership ("these two MANA member agencies"), which SEEDING_BRIEF section 4 says
      to seed disputed. Separately the form "MANA" is a mechanics hazard: forms over three characters match by case-insensitive
      containment, so it is also matched by "Management" and "Manager", both of which occur in this text.'
  - action: ported
    by: port_corpus.py
    date: '2026-08-29'
    source: markdown-cutover
