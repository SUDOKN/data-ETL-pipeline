false_friends:
- form: lead
  reason: 'the documented substring trap, live on this site: occurs only in ''quick turnaround lead times'', ''a
    7 working day lead-time'', ''various lead generating companies'', ''a leader in their industry'' and ''a leading
    U.S. green manufacturer'' - never the metal'
- form: Air
  reason: occurs only in the product name 'Heaters & Air Conditioning units' and in 'more than 5000 hours in the
    air' (the founder's pilot log); never a work material
- form: Steam
  reason: occurs only as the process name 'Steam Treating'; the treatment deposits an oxide, not steam, so the deposits-clause
    does not mint a 'steam' material
- form: PET
  reason: reported fabricated by an earlier pipeline run; word-boundary grep confirms zero occurrences - word-association
    from the plastic molding pages
- form: Zinc Alloy
  reason: reported fabricated by an earlier pipeline run; zero occurrences - word-association from die casting
- form: Bronze
  reason: reported fabricated by an earlier pipeline run; zero occurrences - word-association from the foundry/casting
    pages
- form: Inconel
  reason: word-association from 'nickel alloys' and aerospace; never occurs
- form: magnesium
  reason: word-association from die casting; never occurs
- form: ABS
  reason: word-association from the plastic molding pages; never occurs. 3-character form, so it must not be credited
    by 'absolute' or similar
- form: nylon
  reason: word-association from the plastic molding pages; never occurs
- form: polycarbonate
  reason: word-association from the plastic molding pages; never occurs
