- id: lucasmilhaupt_com-conformity_attestations-0023
  name: Sil-Fos patent
  status: disputed
  acceptable_forms:
  - Sil-Fos patent
  evidence:
  - quote: Lucas Milhaupt has been the trusted brazing alloy and joining solutions of HVAC/R Service Technicians
      since our Sil-Fos patent was released for WWII.
    approx_offset: 4535
  notes: 'DISPUTED: a patent is arguably a ''registration...that a company...could specifically hold'' (issued by
    USPTO, has its own identity), but it functions as an IP-ownership right, not a quality/compliance credential
    the company ''meets or follows'' the way ISO 9001 or NATE do -- and a c.1931 utility patent would be long expired,
    so it isn''t even a currently-held anything. Kept on the record rather than dropped; the companion phrase ''patented
    in 1931'' (HVAC/R page, line 51) is the same real-world event but is a verb-phrase claim, not a designation,
    so it is described in this note rather than added as a form.'
  provenance:
  - action: added
    by: seed-agent-lucasmilhaupt-com
    date: '2026-08-27'
    source: corpus-seed
- id: lucasmilhaupt_com-conformity_attestations-0024
  name: NATE certified training course
  status: confirmed
  acceptable_forms:
  - NATE certified
  - NATE certified training course
  evidence:
  - quote: Refresh your brazing knowledge, join a NATE certified training course, or learn where to buy Sil-Fos
      today.
    approx_offset: 4795
  notes: 'NATE = North American Technician Excellence, a real HVAC-technician certification body; the text says
    the COURSE Lucas Milhaupt runs is NATE-certified, so this is the subject''s own training program holding the
    accreditation. 4-char substring check: ''NATE'' occurs exactly once in the whole snapshot (grep-verified), no
    collision inside another word, but both forms used here are >4 chars so word-boundary matching is moot.'
  provenance:
  - action: added
    by: seed-agent-lucasmilhaupt-com
    date: '2026-08-27'
    source: corpus-seed
  - action: verified
