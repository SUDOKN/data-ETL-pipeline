eval_set_version: 3
expected_empty: false
notes: 'products.yaml doubles as the contract_products expectation. THE PRODUCT-IS-A-MATERIAL CASE: this subject''s
  own-brand goods (Sil-Fos, Silvaloy, Silvacut, Premabraze, AL 718, AL 822, Handy One, Handy Flux, Handy Paste,
  Handy Flo, Easy-Flo, Fos-Flo 7, Stop-Off) are brazing alloys, fluxes and pastes -- i.e. consumable MATERIALS that
  are also finished artifacts coming out of its own manufacturing. Every one of them is seeded in BOTH products
  and material_caps on purpose; neither field is wrong to return them, and an eval that forces a choice would be
  scoring an artefact of its own taxonomy. Physical FORMS (wire, strip, rings, preforms, foils, washers, powders,
  sticks) are products only. A large second population is customer artifacts named in the seven ''Applications We
  Support'' lists -- turbine components, vacuum interrupters, drill bits, EGR coolers, pacemakers; those carry actor:
  client.'
