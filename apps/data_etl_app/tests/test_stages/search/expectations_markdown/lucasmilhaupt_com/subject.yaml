sampling_notes: 'READ EXHAUSTIVELY -- all 6,493 lines, in sed slices of 200-450 lines: 1-120, 105-440, 438-780,
  780-1190, 1190-1450, 1450-1760, 1758-2200, 2199-2600, 2600-3000, 3000-3440, 3437-3880, 3875-4100, 4096-4640, 4632-5010,
  5004-5570, 5565-5860. Lines 5848-6493 were then PROVEN by md5 to be byte-identical duplicates of pages already
  read (the eight .htm mirrors), so they were not re-read line by line; the duplicate check itself is recorded above
  as a hazard.


  Targeted grep sweeps after the read: standards bodies (ISO|ASTM|ANSI|AMS|AWS|AS9100|NADCAP|UL|CE|IATF|ITAR|DFARS|RoHS|NATE);
  AWS/ISO filler classes (BAg|BCuP|BAlSi|BVAg|Ag 272|Al 112); every ''Industry Specifications'' / ''AMS:'' / ''AWS:''
  block; all 33 metal, alloy and ceramic nouns with occurrence counts; every trade name (Sil-Fos|Silvaloy|Silvacut|Premabraze|Handy
  *|Easy-Flo|Fos-Flo|AL 822|AL 718|AL CC|Cone Cored|Stop-Off|Wolverine); every distinct -ing word in the file (~290
  of them, reviewed in full); and an anchor-existence check on ~180 candidate quotes before any entry was written.
  Every quote in this seed was extracted programmatically from the file by line offset and re-verified against the
  file with the harness''s own flexible_pattern matcher -- none was retyped.'
notes: 'All six fields are non-empty; none is expected_empty. Entry counts are the corpus''s largest so far because
  the subject is genuinely dense, not because the boundary was stretched.


  PRODUCT-IS-A-MATERIAL OVERLAP: 13 objects are seeded in BOTH products and material_caps (Sil-Fos, Silvaloy, Silvacut,
  Premabraze 800, Premabraze 880, AL 718, AL 822, Handy One, Handy Flux, Handy Paste, Easy-Flo, Fos-Flo 7, Stop-Off),
  each carrying a note saying so. This is the point of the subject.


  EQUIPMENTS was seeded strictly to the prompt clause, not to the word ''equipment'' -- the alecmfg false-RED lesson.
  Dies, fixtures, grinding wheels, wire brushes, the mass spectrometer, the ultrasonic transducer, ventilating fans,
  exhaust hoods, gas cylinders, regulators, check valves, flashback arrestors, spools, stencils, lab equipment and
  the customer''s MRI/X-ray machines are all recorded as false_friends rather than entries. Only 15 things survive
  as production machines, and several of those carry actor: unknown because they are named in reader-addressed how-to
  prose.


  STATUS_HINT DISPUTED was used on 24 entries where I believe the clause and the plain reading disagree, so the
  argument survives without gating: torch fuel gases and pickling chemicals under material_caps (''substance the
  work is made from or performed in'' arguably excludes them); brazing audits, consulting, Six Sigma and VMI under
  process_caps (services and methodologies rather than operations on the work); customer-specific approvals, the
  Code of Conduct, the Sil-Fos patent and Six Sigma under conformity_attestations (the membership/licence argument
  class).'
