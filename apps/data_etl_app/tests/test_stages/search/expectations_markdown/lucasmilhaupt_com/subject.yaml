context: 'Lucas-Milhaupt LLC (Cudahy, WI; a Steel Partners company) -- a vertically integrated maker of brazing
  filler metals, fluxes, pastes and custom preforms, with plants in Cudahy WI, Warwick RI, Riberac France and Suzhou
  China. 69 pages / 6,493 lines / 259 KB.


  WHY THIS SUBJECT IS IN THE CORPUS -- THE PRODUCT-IS-A-MATERIAL CASE. It is the corpus''s only consumable-materials
  maker: what it manufactures and ships IS a material. Sil-Fos, Silvaloy, Silvacut, Premabraze 800/880, AL 718,
  AL 822, Handy One, Handy Flux, Handy Paste, Handy Flo and Easy-Flo are simultaneously (a) finished artifacts coming
  out of its own casting, rolling, drawing and stamping lines, and (b) alloys and chemical compounds. Both field
  clauses are satisfied by the SAME OBJECT: the products clause because it ''comes out of manufacturing work'',
  the material_caps clause because it is ''a substance ... named generically, by trade name, or by an alloy or grade
  designation''. EVERY such object is therefore seeded in BOTH products.yaml and material_caps.yaml, deliberately,
  rather than one field being chosen -- neither field is wrong to return it, and scoring a run for returning it
  in ''the wrong one'' would be measuring the taxonomy, not the run. Physical forms (wire, strip, rings, foils,
  washers, sticks) stay products-only; elements, compositions and grades stay material_caps-only.'
scrape_hazards:
- hazard: 'COUNTRY-DROPDOWN GEO POISON: the full ~240-entry ISO country list is dumped into the body text TWICE,
    on /Industries/HVACR/OEM and /Industries/HVACR/Distributor. Countries are geography, not industries; a dozen
    are seeded as industries false_friends, ''Brazil'' especially since its first four letters collide with ''braz(ing)''.'
  quote: Congo {Democratic Rep}
- hazard: 'DISTRIBUTOR-REP DUMP: the same two pages also dump a 50-entry US state selector plus 19 manufacturer''s-rep
    companies with contact names, emails and street addresses. Company names, not customers or capabilities; ''Sterling''
    appears only inside one of the addresses.'
  quote: 100 Sterling Pkwy, Suite 111
- hazard: 'SECOND-PERSON TECHNICAL MANUAL: roughly 1,000 lines across Brazing-Fundamentals (lines 1186-1757), Principles-of-Joint-Design,
    Why-Brazing, Brazing-vs-Soldering and Brazing-vs-Welding are a how-to addressed to the READER, not a first-party
    capability claim. It names two dozen further processes (degreasing, acid pickling, abrasive cleaning, sandblasting,
    quenching, twelve NDT and destructive test methods) and several machines (furnace, torch, work coil, applicator
    gun, soak tank). Recall-first keeps all of them as entries; every one carries actor: unknown for that reason.'
  quote: you should take care to maintain a clearance between the base metals
- hazard: 'NEGATION / CONTRAST ECHO: /Brazing-Academy/Metal-Joining-Brazing-vs.-Welding argues at length AGAINST
    welding, and /Why-Brazing and /Brazing-vs-Soldering do the same for mechanical fastening, adhesive bonding and
    soft soldering. Welding, electrical resistance welding, electron beam, capacitor discharge and friction welding
    occur ONLY as the rejected alternative. They are seeded (the text does name them) with the contrast recorded
    in notes -- a downstream stage that reads them as this company''s capabilities is wrong.'
  quote: there are disadvantages to this linear-joint-welding approach
- hazard: '8 of 69 pages are BYTE-IDENTICAL duplicates: /EN/Industries/{HVACR,Automotive,Microelectronic,Medical,Aerospace,Electrical,Oil-and-Gas}.htm
    and /NA/EN/About/Contact-Us.htm mirror their non-.htm originals. Every phrase on the seven industry pages therefore
    occurs exactly twice, which inflates any frequency reading.'
  quote: https://www.lucasmilhaupt.com/EN/Industries/HVACR.htm
- hazard: 'TRUNCATED ALLOY CATALOG: /Resources-Library/Technical-and-Safety-Data-Sheets announces 517 results and
    18 pages but the scrape captured only page 1 -- 30 rows. Those 30 rows are the densest material designations
    in the corpus (78ZN/22AL, 97.5PB/2.5AG, 35AU/62CU/3NI VTG); the other ~487 are simply not in the text and cannot
    be expected.'
  quote: 517 Results Listed
- hazard: 'FILTER-FACET LIST ITEMS: the /Products/Pastes page renders its facets as bare lines with a count suffix
    and no sentence around them (''Carbide(6)'', ''Stainless Steel(6)'', ''Gold and/or Palladium Filler Metals(4)'').
    They are real material designations arriving with no grammatical context at all.'
  quote: Cadmium-Bearing Silver Filler Metals(1)
- hazard: 791 NON-BREAKING SPACES across 716 lines, several of them MID-PHRASE ('Sil-Fos alloys', 'Brazing applications include').
    Any quote or form crossing one must be matched with elastic whitespace. There are zero ASCII double-spaces.
