subject: lucasmilhaupt.com
field: process_caps
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_markdowns/lucasmilhaupt.com.txt
  sha256: f84ad55ab82bc1fc47d34ac0917856ac7ccbac19ec6eb6697a67302b71441f93
eval_set_version: 3
expected_empty: false
notes: 'Three distinct populations that must not be conflated. (1) FIRST-PARTY capabilities on /Services/Capabilities
  and the industry pages: metal stamping, slitting, strip rolling, wire drawing and flattening, preform manufacture,
  laser cutting, EDM, casting/melting, atomizing, coring, coating, paste blending. (2) INSTRUCTIONAL PROSE: ~570
  lines of the Brazing Fundamentals manual and ~200 more in Principles of Joint Design are a second-person how-to
  addressed to the reader (''you should ...'', ''keep the torch moving''), naming a further two dozen operations
  -- degreasing, acid pickling, abrasive cleaning, quenching, sandblasting, twelve named NDT and destructive test
  methods. Under recall-first those ARE entries, but they are NOT first-party capability claims, so every one of
  them carries actor: unknown. (3) CONTRAST ECHO: /Brazing-Academy/Metal-Joining-Brazing-vs.-Welding argues AGAINST
  welding at length; welding, resistance welding, electron beam, capacitor discharge and friction welding all occur
  there only as the rejected alternative. They are seeded with that context recorded, because the text does name
  them.'
