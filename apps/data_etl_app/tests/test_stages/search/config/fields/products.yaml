sweeps:
  - name: series_designators
    ignore_case: false
    pattern: '\b[A-Z][A-Za-z0-9&-]{0,15}(?:\s[A-Z][A-Za-z0-9&-]{0,15})?\sSeries\b'
notes: >
  No generic product lexicon exists — recall rides on the expectation
  inventories and the judged census. The Series sweep covers catalogue-series
  subjects (steelcraft); the measured Series-sweep trap applies: count
  LOCATIONS as evidence when judging, and anchor patterns (2026-08-24 lesson).
  Feeds BOTH products and contract_products (one shared search).
