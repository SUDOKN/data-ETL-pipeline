false_friends:
- form: certificate programs
  reason: HR careers benefit ('lunch and learns, course reimbursements, certificate programs') -
    the non-conformity certificate sense (code Z)
- form: Supplier Quality Assurance Manual
  reason: doc title with no standard id (code D) - and it is Anchor's manual governing its
    SUPPLIERS' quality systems, not an attestation Anchor holds
- form: Code of Conduct
  reason: policy document title ('ANCHOR SUPPLIER RESPONSIBILITY POLICY AND CODE OF CONDUCT') -
    code D, no standard id
- form: Foreign Corrupt Practices Act
  reason: statute named in anti-corruption CSR boilerplate ('strictly adheres to all local and
    applicable U.S. laws') - business-ethics law, not a manufacturing conformity attestation.
    Judgment call - it IS a named regulation, but nothing here is a certification/standard the
    ontology grounds; seeded as false friend
- form: No Surprises Act
  reason: health-plan transparency legislation on the employee-benefits page - unrelated to
    manufacturing conformity
- form: Uniform Commercial Code
  reason: Ohio UCC cited in seller T&Cs - commercial statute in legal boilerplate
- form: Precision Metalforming Association
  reason: trade-association membership (CEO 'active participant with the Precision Metalforming
    Association (PMA)') - a body one joins, not a standard one attests to; 'PMA' likewise
- form: NorthCoast 99 Award
  reason: best-workplace award, not a certification
- form: Awards of Excellence
  reason: customer/industry awards 'for such things as safety, training and technology' - not
    certifications
- form: quality assurance system
  reason: generic (G) and wrong-actor - 'supplier quality assurance system approved by Purchaser'
    is the supplier's obligation; 'comprehensive quality assurance systems' is defense-page
    marketing prose
- form: Class A
  reason: cosmetic appearance grade ('Class A Cosmetic Parts', 'Class A appearance trim') - a
    spec, not a standard designation
