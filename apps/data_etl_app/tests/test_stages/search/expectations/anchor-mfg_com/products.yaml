  stampings, welded assemblies, fabricated parts, tooling) plus automotive COMPONENT TYPES from
  one dense list sentence repeated on three pages (home + both industries pages) and a careers
  variant. The component types are single-word designations qualifying 'components' - expect
  B-grade entities. No named catalog products or part numbers exist anywhere in the file.
  VERIFIER 2026-08-26 - independent pass - all 15 entries confirmed, all 22 quotes verbatim, none resting on T&C text. expected_empty false AGREED. false_friend concern - 'Special Tooling' contains entry 0004's accepted form 'tooling', the same containment collision in reverse. For the shared contract_products use - confirmed by reading that no part numbers or named catalog products exist anywhere in the file, so these offering categories and component types are the whole ceiling.
