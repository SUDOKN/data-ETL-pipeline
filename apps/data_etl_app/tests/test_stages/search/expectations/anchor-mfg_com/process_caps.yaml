false_friends:
- form: inspection
  reason: occurs ONLY in purchase-order T&C clause 5 ('INSPECTION AND REJECTIONS' - Purchaser may
    inspect supplier goods; 'Seller will perform inspections as designated by Purchaser') - the
    obligation is Anchor's SUPPLIER's, in legal boilerplate; no shop-floor inspection claim exists
    in this file. Judgment call - the locked carve-out makes inspection V when the subject performs
    it on the work, but here every occurrence is wrong-actor contract text, seeded per direction as
    part of the T&C junk pump
- form: supplier quality assurance system
  reason: wrong actor - 'Seller will provide and maintain a supplier quality assurance system
    approved by Purchaser' obligates Anchor's suppliers, not Anchor
- form: delivery
  reason: T&C logistics clauses plus the service-values marketing list ('quality, service, program
    management, efficiency, and delivery') - business activity (Z), never an operation on the work
- form: packing
  reason: T&C clause 'PACKING, MARKING AND SHIPMENT' - supplier logistics obligation, not a
    capability
- form: marking
  reason: same T&C clause ('pack and mark goods') - supplier logistics obligation
- form: shipment
  reason: T&C logistics boilerplate
- form: shipping
  reason: T&C logistics ('including shipping on Saturdays and holidays, when requested') -
    supplier obligation
- form: transportation
  reason: T&C routing-instruction clauses - logistics, wrong actor
- form: insurance
  reason: T&C clause 10 - legal/insurance obligation (Z)
- form: indemnification
  reason: T&C clause 10(b) - legal activity (Z)
- form: warranty
  reason: warranty clauses in both T&C documents - legal boilerplate (Z)
- form: termination
  reason: T&C clause 19 - contractual/legal activity
- form: cancellation
  reason: T&C clause 20 'CANCELLATION FOR DEFAULT' - contractual activity
- form: assignment
  reason: T&C clause 18 - contractual activity
- form: customs
  reason: T&C clause 13 - import/export compliance activity, wrong actor
- form: labor disputes
  reason: T&C clause 6 - HR/legal contingency clause
- form: purchasing
  reason: doc title 'PRODUCTION/TOOL PURCHASING' and T&C context - Anchor's procurement, a
    business activity (Z)
- form: quotation
  reason: doc title 'QUOTATION/ACKNOWLEDGEMENT TERMS AND CONDITIONS' - sales paperwork, not an
    operation
- form: payment
  reason: T&C payment/credit clauses - business activity
- form: claims adjustment
  reason: T&C clause 12 heading - legal/accounting activity
- form: installation
  reason: T&C clause 16 ('installation, servicing or maintenance of equipment' performed by
    suppliers inside Anchor facilities) - code I trap, wrong actor
- form: maintenance
  reason: named only as an internal department in the CEO bio and in T&C clause 16 supplier
    context - never a maintenance-service capability claim
- form: program management
  reason: service-values marketing list - business activity (Z)
- form: production
  reason: generic (G) - 'mass production', 'bring them into production'
- form: manufacturing
  reason: generic (G) - own name and 'manufacturing space'
- form: training
  reason: HR benefit ('additional training') and award subject ('safety, training and
    technology') - Z
- form: compliance
  reason: CSR/legal boilerplate ('Compliance with legal and ethical standards', 'REQUIRED
    COMPLIANCE' clause) - Z/G
- form: forced labor
  reason: CSR code-of-conduct heading - policy topic, not an operation
- form: child labor
  reason: CSR code-of-conduct heading - policy topic, not an operation
- form: repair or replace
  reason: seller-T&C warranty remedy ('repair or replace any goods which fail to meet the
    warranties') - legal remedy language, distinct from the Tool & Die 'Repair / Refurbish'
    capability (entry 0028)
- form: engineering
  reason: bare form appears as a department ('engineering departments') and a degree ('Engineering
    degree from Cornell') - generic without the design-support or die-change qualifiers (entries
    0027/0031 carry the real designations)
