false_friends:
- form: machine readable files
  reason: employee-portal No Surprises Act health-plan transparency files ('digital representation
    of data') - U junk, not machinery
- form: Employee Navigator
  reason: benefits-website brand name - looks like a named tool, is neither machine nor shop
    software
- form: Special Tooling
  reason: purchasing-T&C DEFINED TERM for Purchaser-owned property ('tools, equipment, material,
    drawings ... (Special Tooling)') - legal term of art, not a machine designation
- form: equipment
  reason: generic (G) - 'equipment redundancy' marketing and T&C 'parts or equipment'
- form: Bulletin Board
  reason: employee-benefits website feature - U junk
- form: mechanical breakdown
  reason: force-majeure list in the seller T&Cs - an event, not a machine
- form: tooling
  reason: bare form names the tool & die PRODUCT line ('fabricated parts and tooling') and the
    T&C Special Tooling term - as an equipments return it is the known product/tooling confusion
    (code D/T), the real entities being the dies the shop builds
- form: machine
  reason: bare form occurs only inside 'machine readable files' and 'Milling Machines' - no
    standalone machine designation
