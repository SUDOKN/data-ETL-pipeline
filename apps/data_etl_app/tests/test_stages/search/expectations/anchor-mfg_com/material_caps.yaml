notes: Rich field - all positive designations sit in one 'Materials' list block on
  /capabilities-services/ (offsets 6564-6760). Note the substring nesting - 'High Strength Steel'
  is contained inside both 'Ultra High Strength Steel' and 'Advanced High Strength Steel', so
  form-level containment matching will cross-credit these three; the bare-line occurrence at
  offset 6604 is its own designation.
  VERIFIER 2026-08-26 - independent pass - all 10 entries confirmed, all 11 quotes verbatim, all inside the one Materials block on /capabilities-services/ plus the powder-coating wash line. expected_empty false AGREED. false_friend concern - 'Powder' is contained in 'Powder Coating', which the locked material keep-rule KEEPS (a treatment named after a substance implies that substance); if false-friend scoring is containment-based, a keep-rule-compliant 'Powder Coating' return would be miscounted as junk.
