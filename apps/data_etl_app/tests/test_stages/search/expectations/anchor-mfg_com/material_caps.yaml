false_friends:
- form: Lead
  reason: occurs only inside 'industry leader' / 'leadership' / 'leads company' - the known
    brute-substring false positive; zero in-window material sense (code U)
- form: wood
  reason: agriculture marketing filler ('the wood in our desks') - word-association, not a worked
    material
- form: metal
  reason: generic (G) - 'metal stampings', 'metal forming'; no alloy/grade content on its own
- form: material
  reason: generic and legal ('raw material contract', 'substitution of material' in T&Cs) - G
- form: Class A
  reason: cosmetic appearance grade ('Class A Cosmetic Parts', 'Class A appearance trim'), a spec
    qualifier - not a material designation
- form: Coil
  reason: appears only inside 'Coil Fed Servo Transfer System' - names the press feed system, not
    a coil-stock material offering
- form: Powder
  reason: appears only inside the powder-coating process lines; bare form has no material
    designation content (the process entities live in process_caps)
- form: goods
  reason: T&C legal generic - not a material
