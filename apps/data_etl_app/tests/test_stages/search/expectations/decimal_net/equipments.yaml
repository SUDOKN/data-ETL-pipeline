  that Decimal built. Everything in the Testing & Inspection Equipment column, the whole quality department (Mitutoyo/Keyence/Virtek/TESAHITE),
  all fixturing and dies, the gas tank, the storage tower, the box truck and every CAD/CAM package are recorded
  as false_friends.
