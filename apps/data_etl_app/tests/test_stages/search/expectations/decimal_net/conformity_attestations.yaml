false_friends:
- form: SFMA Manufacturer of the Year
  reason: an award, not a certification or standard
- form: Large Business Award
  reason: a city award, not an attestation
- form: Business Excellence Awards
  reason: an awards ceremony, not an attestation
- form: Presidents Award
  reason: an internal staff award
- form: Award of Excellence
  reason: an internal staff award
- form: SFMA
  reason: South Florida Manufacturers Association appears only as an award-giver and event host - no membership
    is claimed
- form: FloridaMakes
  reason: a hashtag in a social post, not an accreditation
- form: Trust Agreement
  reason: a family ownership instrument from the About page
- form: ABB Contract
  reason: a customer contract won in 2019, not a certification
- form: SPC (Statistical Process Control)
  reason: a quality technique in the Inspection & Process Control column, not something a company holds
- form: FMEA (Failure Mode & Effects Analysis)
  reason: a quality technique, not an attestation
- form: Job Title
  reason: an RFQ form field label
- form: Any .STP File
  reason: a CAD file format in the File Formats column, not a standard a company holds
- form: Privacy Policy
  reason: a website document, not a compliance credential
