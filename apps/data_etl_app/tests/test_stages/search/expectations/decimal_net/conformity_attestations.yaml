eval_set_version: 2
expected_empty: false
notes: Six credentials repeat in a footer on all 51 pages (AS9100, ISO 9001, ITAR, DFAR, RoHs, SVHC); the Industry
  Standards table adds REACH and Conflict Materials; case studies add customer-imposed specs (MIL-A-8625, QQ-A-250/11F,
  P.S. 806-x, four IEC standards, two GB standards). NADCAP is the supplier-held trap. Awards (SFMA Manufacturer
  of the Year, city Large Business Award) are false_friends.
