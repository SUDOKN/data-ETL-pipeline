- form: United Arab Emirates
  reason: ISO country dropdown
- form: Zimbabwe
  reason: ISO country dropdown (last entry of the run)
- form: District of Columbia
  reason: US-state dropdown on the RFQ form
- form: Fabricating and Machining Industry
  reason: the subject's OWN activity presented as an industry (Alan Garey's bio line)
- form: Modern Machine Shop
  reason: a trade magazine that featured them, not a market they serve
- form: Precision Machining
  reason: own service line; returned as an industry it is own-activity-as-sector
- form: Manufacturing
  reason: generic - 'precision manufacturing business', 'Manufacturing plant'
- form: Oil & Gas
  reason: word-association from 'Stainless Oil Tank Energy'; the phrase never occurs
- form: Coral Springs
  reason: the plant's city, not a market
- form: Vocational Training
  reason: a community-outreach commitment, not a sector served
