  reason: 'witnessed: the parent''s youth-sports charity'
- form: The Strength of Steel
  reason: 'witnessed: a heading on /About/History announcing the Steel Partners acquisition; no metal is meant'
- form: Titanium
  reason: 'anticipatory: does not occur anywhere; heavy word-association from aerospace brazing'
- form: Hastelloy
  reason: 'anticipatory: does not occur; word-association from Monel and Inconel'
- form: Kovar
  reason: 'anticipatory: does not occur; word-association from hermetic ceramic-to-metal sealing'
- form: '6061'
  reason: 'anticipatory: no numeric aluminium grades occur -- the aluminium designations here are AL 718 / AL 822
    / 88AL/12SI, which are filler-metal names, not wrought grades'
- form: 304 Stainless
  reason: 'anticipatory: does not occur; the only stainless designation is ''300-series, non-magnetic stainless
    steel'''
- form: Lead
  reason: the bare token occurs ~24x and is 'lead time' or 'leading' in all but three places; the real lead senses
    are 'lead-free', 'Tin-Lead Soft Solder' and '97.5PB'
- form: Cone Cored
