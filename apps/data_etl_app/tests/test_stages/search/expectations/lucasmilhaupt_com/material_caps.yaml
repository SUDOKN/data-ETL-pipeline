subject: lucasmilhaupt.com
field: material_caps
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/lucasmilhaupt.com.txt
  sha256: d92eed67ef99d67a791896d0467d78dc0c60bf7a96e2ec6f99926618da193236
eval_set_version: 2
expected_empty: false
notes: 'The corpus''s densest material inventory, and its only subject whose PRODUCT IS A MATERIAL: Lucas Milhaupt
  makes brazing filler metals, fluxes and pastes, so every own-brand product name (Sil-Fos, Silvaloy, Premabraze,
  AL 718, AL 822, Handy One, Handy Flux) is legitimately BOTH a material_caps entry and a products entry -- both
  are seeded, on purpose, rather than one being chosen. Four separate strata: (1) elements and generic metals in
  prose; (2) the Pastes-page filter facets, which enumerate alloy families and base materials as bare list items;
  (3) the Technical-and-Safety-Data-Sheets page, whose first 30 of 517 rows are raw composition designations (78ZN/22AL,
  97.5PB/2.5AG, 35AU/62CU/3NI VTG); (4) ''Nominal Composition'' lines on the product detail pages. Brazing atmospheres
  are seeded because the field clause covers a substance the work is ''performed in''.'
