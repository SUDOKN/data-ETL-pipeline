false_friends:
- form: dies
  reason: 'witnessed heavily (4,000 dies, stock dies, progressive dies, carbide and diamond dies): TOOLING, which
    the equipment clause excludes by name'
- form: progressive dies
  reason: 'witnessed: tooling the stamping press holds, not the machine'
- form: carbide and diamond dies
  reason: 'witnessed: wire-drawing tooling; the metals in it belong to material_caps'
- form: fixture
  reason: 'witnessed ~20x with a whole ''Fixture Facts'' and ''Fixturing Tips'' section: tooling, excluded by name.
    The densest equipment-shaped trap in this subject.'
- form: brazing support fixture
  reason: 'witnessed: tooling, excluded by name'
- form: grinding wheel
  reason: 'witnessed: an abrasive the machine acts through -- tooling, and the operation (''abrasive cleaning'')
    belongs in process_caps'
- form: wire brush
  reason: 'witnessed 3x: a hand tool for flux removal, not a production machine'
- form: spray bottle
  reason: 'witnessed: a hand applicator, not a production machine'
- form: mass spectrometer
  reason: 'witnessed: leak-detection instrumentation -- equipment that only tests, excluded by name; the operation
    ''Vacuum testing'' is a process_caps entry'
- form: transducer
  reason: 'witnessed: ultrasonic inspection instrumentation -- measures only'
- form: ventilating fans
  reason: 'witnessed: plant ventilation -- conditions the plant, excluded by name'
- form: exhaust hoods
  reason: 'witnessed: plant ventilation, excluded by name'
- form: respirators
  reason: 'witnessed: personal protective equipment, not a production machine'
- form: Oxygen cylinders
  reason: 'witnessed: gas storage -- stores and carries, excluded by name'
- form: regulators
  reason: 'witnessed: gas pressure conditioning, not acting on the work'
- form: check valves
  reason: 'witnessed: torch gas-line safety hardware'
- form: flashback arrestors
  reason: 'witnessed: torch gas-line safety hardware'
- form: spools
  reason: 'witnessed: ''feeding filler wire automatically from big spools'' and ''package the material on either
    spools or coils'' -- carries and stores, and is also packaging'
- form: stencil
  reason: 'witnessed: paste-application tooling (''automated dispensing, stencil, or syringe'')'
- form: lab equipment
  reason: 'witnessed: ''state of the art lab equipment'' -- testing and analysis, excluded'
- form: analytical labs
  reason: 'witnessed: a facility for testing, excluded'
- form: clean lab room
  reason: 'witnessed: a facility, not a machine'
- form: MRI
  reason: 'witnessed: a CUSTOMER''S medical device that brazed joints go into -- a product, not a production machine
    (belongs in products)'
- form: X-ray
  reason: 'witnessed twice with different senses: the customer''s diagnostic machine, and ''X-ray absorption ratios''
    inside radiographic examination -- neither is a production machine'
- form: compressors
  reason: 'witnessed: HVAC/R components the customer builds -- a product, and an air compressor would be plant utility
    anyway'
- form: evaporators
  reason: 'witnessed: HVAC/R components the customer builds -- a product'
- form: condensers
  reason: 'witnessed: HVAC/R components the customer builds -- a product'
- form: CNC machine
  reason: 'anticipatory: does not occur anywhere; word-association from ''precision'', ''stamping'', ''tolerances'''
- form: press brake
  reason: 'anticipatory: does not occur; word-association from ''stamping'' and ''strip'''
- form: rolling mill
  reason: 'anticipatory: does not occur -- the text says ''Strip Rolling'' and ''not available directly from the
    mills'', never a named mill machine'
