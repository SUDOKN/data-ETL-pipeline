field: equipments
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/lucasmilhaupt.com.txt
  sha256: d92eed67ef99d67a791896d0467d78dc0c60bf7a96e2ec6f99926618da193236
eval_set_version: 2
expected_empty: false
notes: 'SEEDED TO THE PROMPT''S BOUNDARY, NOT THE WORD ''EQUIPMENT''. The subject sells consumables, so most of
  its own plant is described only as ''high precision equipment'' / ''high speed machines''; the named hardware
  sits in the Brazing Fundamentals manual, and most of it is EXCLUDED by the clause: dies, fixtures, grinding wheels
  and wire brushes are tooling; the mass spectrometer and transducer only test; cylinders, regulators, check valves,
  flashback arrestors, ventilating fans and exhaust hoods power or condition the plant; spools carry. Those are
  all false_friends, not entries. What survives as a production machine: furnaces, torches, the induction work coil,
  the stamping/preform machines, the flux applicator gun, and the cleaning tanks the work is immersed in. This is
  the field where the alecmfg false-RED lesson bites hardest.'
