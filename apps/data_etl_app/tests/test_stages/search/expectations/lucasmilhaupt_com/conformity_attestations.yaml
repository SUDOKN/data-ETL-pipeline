subject: lucasmilhaupt.com
field: conformity_attestations
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/lucasmilhaupt.com.txt
  sha256: d92eed67ef99d67a791896d0467d78dc0c60bf7a96e2ec6f99926618da193236
eval_set_version: 2
expected_empty: false
notes: 'Two distinct populations. (1) Company quality-system certifications, concentrated on /About/Certification
  and repeated in the industry-page intros: AS9100 D, ISO 9001, ISO 14001, IATF 16949, ITAR, DFARS, RoHS, NATE.
  (2) PRODUCT specification designations printed in the ''Industry Specifications'' block of every product detail
  page: AWS filler-metal classifications (BVAg-8, BAlSi-4, BCuP-5), ISO 17672 alloy numbers (Ag 272, Al 112) and
  AMS numbers (4185, 3410, 3411). The second population is the one a name-only reading of the field would miss.
  TDS/SDS occur ~500 times and are documents, not attestations.'
