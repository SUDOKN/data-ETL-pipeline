false_friends:
- form: TDS
  reason: 'witnessed ~250x: ''Technical Data Sheet'', a product document, not an attestation'
- form: SDS
  reason: 'witnessed ~250x: ''Safety Data Sheet'', a product document, not an attestation'
- form: VTG
  reason: 'witnessed: ''vacuum tube grade'', an alloy purity grade in product names (SILVALOY 721 VTG Gr1) -- a
    material designation, not a certification'
- form: Braze School
  reason: 'witnessed ~15x: a training course, not a certification (only its NATE accreditation is)'
- form: Brazing Academy
  reason: 'witnessed: the company''s training portal, not an accreditation'
- form: Steel Partners Operational Excellence Programs
  reason: 'witnessed: the parent''s internal improvement programme, not a standard held or met'
- form: Grade 1
  reason: witnessed only as the tail of the AWS class 'BVAg-8 Grade 1'; alone it names no standard
- form: NADCAP
  reason: 'anticipatory: does not occur; strong word-association from AS9100 + aerospace brazing'
- form: ISO 13485
  reason: 'anticipatory: does not occur; word-association from the medical-device pages, which cite only ISO 9001'
- form: AS9100 Rev D
  reason: 'anticipatory: the text says ''AS9100 D'', never ''Rev D'''
- form: FDA
  reason: 'anticipatory: does not occur; word-association from ''medical-device purity mandates'''
- form: REACH
  reason: 'anticipatory: does not occur; word-association from RoHS'
