false_friends:
- form: REACH
  reason: witnessed as a substring only, inside 'CANCELLATION AND BREACH' at line 856. The EU REACH regulation is
    never mentioned.
- form: API
  reason: witnessed as a substring only, inside 'RAPID PROTOTYPING' at line 1909. The API standards body is never
    mentioned.
- form: NADCAP
  reason: 'anticipatory: never occurs. AS9100 at line 3239 makes an aerospace-accreditation hallucination likely.'
- form: ITAR
  reason: 'anticipatory: never occurs, despite ''compliant with NATO and military standards'' at line 1612.'
- form: IATF 16949
  reason: 'anticipatory: the text says only the superseded ''TS16949'' (1630, 2914, 3239, 3361, 3916). The modern
    IATF name never appears and would be a normalization, not a designation.'
- form: ISO 9001:2015
  reason: 'anticipatory: the text pins ISO9001:2000 (1630, 2914, 3239). Any later revision number is invented.'
- form: Underwriters Laboratories
  reason: the issuing body behind the UL Mark; the mark is the attestation, the laboratory is a company name
- form: Group Technology
  reason: 'word-association trap: an uppercase acronym-shaped software method sitting among genuine uppercase standard
    names'
- form: certified calibration
  reason: 'looks like a certification but has no identity of its own - no name, number, mark or issuing body: ''laboratory-grade
    models with certified calibration'''
- form: safety standards
  reason: 'generic, unnamed: ''to ensure products meet safety standards'''
- form: industry standards
  reason: 'the generic phrase carrying the real ones: ''based on industry standards such as GSM, W-CDMA (UMTS) and
    Wi-Fi (IEEE 802.11)''; the phrase itself names nothing'
- form: gloss standard
  reason: a physical reference surface the glossmeter is compared against ('the ratio for the gloss standard'),
    not a certification with an issuing body
- form: ITAR
  reason: 'witnessed as a substring only: the sole occurrence is inside ''mILITARy rangefinders''. No export-control
    registration is claimed'
- form: NADCAP
  reason: 'anticipatory: never occurs, but the AS9100 aerospace paragraph makes it an easy invention'
- form: Warranty
  reason: 'witnessed twice (''All our equipment is under warranty''; ''design and warranty specifications''): a
    commercial promise, not a certification, standard or accreditation with an issuing body'
- form: QC Department
  reason: 'witnessed (''Suitable for research institutes, industrial labs and QC departments''): an organisational
    unit that buys the instrument, not an attestation'
- form: ISO 9001
  reason: 'anticipatory: never occurs anywhere in this slice; the slice names ISO 7632 and a bare ''ISO'' only,
    so any ISO 9001 is minted from word association'
- form: NADCAP
  reason: 'anticipatory: does not occur in this slice'
- form: 316L
  reason: 'witnessed: an austenitic steel grade, not a certification a company holds - it appears as a material
    designation on the hoses and vacuum-chamber pages'
- form: Pascal's law
  reason: 'witnessed: ''Hydrostatic pumps ... work on the principle of Pascal''s law'' - a physical law, not a standard
    with an issuing body'
- form: Rz 0.7 microns
  reason: 'witnessed: a surface-roughness specification value, not a certification'
- form: Torr
  reason: 'witnessed: a pressure unit used throughout the vacuum pages'
- form: UHV
  reason: 'witnessed: a vacuum pressure regime (''Ultra High Vacuum''), not a standard'
- form: OEM
  reason: 'witnessed: ''compared to the OEM''s originally installed hydraulic filter elements'' - a supplier category,
    not an attestation'
- form: office regulations
  reason: 'witnessed: "support luminaries to fulfill office regulations for de-glaring" - a regulation with no identity,
    name, number or issuing body'
- form: RC
  reason: 'witnessed: the Rockwell C hardness scale ("The hardness achieved is 60 - 65 RC"), a measurement unit
    rather than a standard a company holds'
- form: OEM
  reason: witnessed as a business model label ("OEM option available"), not a certification
- form: NADCAP
  reason: 'anticipatory: a special-process accreditation a reader would expect from a shop describing heat treating,
    coating and welding; it appears nowhere in the file'
- form: ITAR
  reason: 'anticipatory: easy to mint from the NASA / satellite instrument work; absent from the file'
- form: NSC
  reason: a seal-catalog section prefix; reads like a standards-body abbreviation but names no standard
- form: OSI layer 2
  reason: a reference-model layer used to place network devices, not a standard a company holds or meets
