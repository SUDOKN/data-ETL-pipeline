eval_set_version: 2
expected_empty: false
notes: 'The densest field on this subject, and the one with the widest gap between what the text NAMES and what
  the plant DOES. Three sources: (1) the Manufacturing page''s real process chain (cutting, forging, heat treatment,
  post-forging, testing); (2) a TYPES OF FORGING list of eleven forging variants printed on four duplicate page
  fetches and again in a blog - most of them list-only, with Open Die Forging being the explicitly REJECTED comparator
  of a blog titled HOW CLOSED DIE FORGING TOPS OPEN DIE FORGING; (3) the IMRC research centre''s microwave processes,
  which are concluded lab research rather than production. All three are entries under recall-first, with the grounding
  status recorded in notes. Inspection, testing and measurement qualify here by the clause''s own second sentence,
  which is where the CMM / Spectrometer / Tensile Tester / Microscopy block belongs.'
