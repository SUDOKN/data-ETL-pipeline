  notes: named software steps (AutoCAD, Siemens NX / Unigraphics, DEFORM, CIMATRON - note the ™ characters) on the
    Design & Engineering page. Toolpath generation arguably IS the first step of die manufacture; simulation and
    modelling are not. Disputed | DEFORM simulation, CIMATRON tool-path generation and Siemens NX 3-D modelling
    are CAD/CAM/simulation software used before the work exists. The clause wants 'an operation performed on materials,
    parts, or products'; none of these is performed on the work. Separately, all three forms are whole design-engineering
    lines rather than phrases.
