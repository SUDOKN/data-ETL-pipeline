snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/pradeepmetals.com.txt
  sha256: d3b7875e2769b8347084c18df480028cf319fc9595695734c21041dff6961bc0
eval_set_version: 2
expected_empty: false
notes: This file doubles as the contract_products expectation. The company's five product categories (Forged Flanges,
  Valves, Gears & Automative, Manifolds, General Engineering) are named on the nav strip, the Products page and
  in the footer of 112 pages - but four of the five category PAGES are either photo-caption stubs ('Valve1'..'Valve6',
  'GENERAL ENGINEERING 1'..'4') or 'Coming Soon'. The real product detail is in three long valve explainers (ball,
  butterfly, globe) whose types are entries. The dominant junk pressure is the ~24 pages of INVESTOR-RELATIONS DOCUMENTS
  - Annual Reports, AGM Notices, Proxy Forms, Scrutinizer's Reports, Postal Ballot Forms, Voting Results - which
  the products clause explicitly excludes ('awards, memberships, training, documents'), together with the 28-row
  directorship register of company names, which it also explicitly excludes.
