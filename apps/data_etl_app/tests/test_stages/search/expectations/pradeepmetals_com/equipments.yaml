subject: pradeepmetals.com
field: equipments
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/pradeepmetals.com.txt
  sha256: d3b7875e2769b8347084c18df480028cf319fc9595695734c21041dff6961bc0
eval_set_version: 2
expected_empty: false
notes: 'SEEDED TO THE PROMPT''S CLAUSE, NOT TO THE WORD ''EQUIPMENT''. A production machine acts on the work itself,
  which excludes anything that only measures/inspects/tests, anything that powers or conditions the plant, anything
  that moves/stores/carries, and all tooling. This subject supplies unusually rich traps in every one of those four
  exclusion classes, and they are seeded as false_friends rather than entries: the CMM / Spectrometer / Tensile
  Tester / Microscopy testing block, the Wind Mill and ETP plant and mist collectors and recuperators, the vertical
  storage yard and Vibro-feeder, and the dies and forging dies and tool-room equipment. Two real sources of named
  machines: the Manufacturing page (shear, saws, hammers, presses, furnaces) and the Machining page (eight HAAS
  models). A third block, the IMRC lab, names a dozen microwave and mineral-processing machines - research kit,
  kept as entries with actor: lab.'
