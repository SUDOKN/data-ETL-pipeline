- id: pradeepmetals_com-equipments-0003
  name: die cast (as a force-delivering machine)
  status: disputed
  acceptable_forms:
  - a die cast
  - A die-cast
  evidence:
  - quote: using an industrial hammer or a die cast
    approx_offset: 4920
  - quote: A die-cast or industrial hammer is harnessed
    approx_offset: 230707
  actor: unknown
  notes: the explainer uses 'die cast' as the thing that delivers forging force, alongside 'industrial hammer'.
    On the clause it is tooling (a die), which is excluded; on the sentence it is being used as the machine. Disputed
    - and it is also a strong casting-process false lead | 'a die cast' / 'A die-cast' is the text's loose name
    for the die that delivers the forging force. The equipments clause explicitly excludes tooling - 'what a machine
    holds, guides, or acts through rather than the machine driving it' - and names a die as the example. The text
    does present it as the force-delivering device, which is why this is arguable rather than wrong.
  provenance:
  - action: added
    by: seed-agent-pradeepmetals-com
    date: '2026-08-27'
    source: corpus-seed
  - action: disputed
    by: verify-agent-pradeepmetals
    date: '2026-08-27'
    reason: '''a die cast'' / ''A die-cast'' is the text''s loose name for the die that delivers the forging force.
      The equipments clause explicitly excludes tooling - ''what a machine holds, guides, or acts through rather
      than the machine driving it'' - and names a die as the example. The text does present it as the force-delivering
      device, which is why this is arguable rather than wrong.'
