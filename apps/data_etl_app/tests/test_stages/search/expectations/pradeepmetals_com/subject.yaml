context: 'Pradeep Metals Limited, Navi Mumbai - a closed-die steel forging house, BSE-listed since 1993. The corpus''s
  only Indian and only investor-relations-heavy subject. 114 page fetches / 96 distinct URLs: ~24 investor-relations
  pages (AGM/EOGM, announcements, policies, quarterly disclosures, financial reports, corporate governance, unpaid
  dividend), 15 blog posts, and only ~12 real capability pages (manufacturing, machining, quality, material grades,
  design & engineering, products, IMRC research centre).'
scrape_hazards:
- hazard: a 42-line site footer (ABOUT US ... Powered by) is repeated 112 times - 4,704 of the file's 10,412 lines,
    45%. It carries nav labels that read as products, industries and quality items (Forged Flanges / Valves / Manifolds
    / Material Grades / Approvals / Certificates / Quality Policy / Industries We Serve), so the same handful of
    forms is in scope for nearly every window
  quote: © 2016 Pradeep Metals Limited. All rights reserved | XML Sitemap | Powered by
- hazard: '33-35% of page fetches are duplicates: http:// and https:// variants, with and without a trailing slash,
    fetched as separate pages (114 fetches, 74 distinct bodies once the login/share-price chrome is normalized).
    /quality, /machining, /forging, /clientele, /our-team, /corporate-governance, /material-grades, /india-facilities
    all appear 2-3 times'
  quote: http://www.pradeepmetals.com/quality/
- hazard: '15 ''Coming Soon'' stubs, and they are exactly the pages whose names promise the densest in-field content:
    /tool-die-development, /aluminium-forging, /industries-we-serve, /stainless-steel-forgings, /testing-validation,
    /gears-automative, /forged-steel-check-valve, /forged-steel-globe-valve, /us-facilities, /investors'
