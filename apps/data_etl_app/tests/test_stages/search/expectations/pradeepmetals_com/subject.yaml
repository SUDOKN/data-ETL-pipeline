sampling_notes: 'Read EXHAUSTIVELY. Method: (1) stripped the 112 identical 42-line footers and blank lines, leaving
  3,397 substantive lines, and read all of them in nine sed slices, covering original lines 1-10,412 and every one
  of the 114 page fetches; (2) targeted greps over the FULL unmodified file for standards bodies (ISO/ASTM/ANSI/API/AMS/NADCAP/ASME/DNV/TUV/Lloyd/IBR/EIL/CRN/ISI/DSIR/PED/NORSOK/AD2000/AS
  9100), every -ing word (231 distinct), alloy and grade patterns, machine/brand words, industry words and product
  words. Nothing was sampled. The footer text itself was read once in full (lines 44-89) and is quoted in the hazards.'
notes: 'Six non-empty fields. The subject''s own capability content is concentrated in ~12 pages; the other ~84
  fetches are investor relations, blog explainers and duplicates. Two recall-relevant consequences: (a) many process/material
  entries are named ONLY in generic blog explainers about the forging industry, not as this company''s own capability
  - those carry actor: unknown and a note, because search is recall-first and downstream owns attribution; (b) the
  IMRC (Industrial Microwave Research Center) pages name a large amount of lab equipment and a set of microwave
  processes that are concluded research, not production - they are entries with the research context in notes. products.yaml
  doubles as the contract_products expectation.'
