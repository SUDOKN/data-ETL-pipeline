- id: sterlingmfg_net-material_caps-0021
  name: sodium bicarbonate blast media
  status: disputed
  acceptable_forms:
  - Sodium-bicarbonate-based micro-blast
  - Sodium-bicarbonate-based
  evidence:
  - quote: Sodium-bicarbonate-based micro-blast stations
    approx_offset: 43399
  notes: a blast medium, i.e. a substance the work is processed with rather than made from - the prompt's 'named
    after a substance' clause is the closest fit | sodium bicarbonate is the blast MEDIA of the deburring station,
    not a substance the work is made from or performed in, and micro-blasting deposits nothing on the part (the
    sentence's point is that parts come out 'Burr Free'). The deposit/diffuse extension in the clause therefore
    does not reach it. Retained as deburring under process_caps-0032.
  provenance:
  - action: added
    by: seed-agent-sterlingmfg-net
    date: '2026-08-27'
    source: corpus-seed
  - action: disputed
    by: verify-agent-sterlingmfg
    date: '2026-08-27'
    reason: sodium bicarbonate is the blast MEDIA of the deburring station, not a substance the work is made from
      or performed in, and micro-blasting deposits nothing on the part (the sentence's point is that parts come
      out 'Burr Free'). The deposit/diffuse extension in the clause therefore does not reach it. Retained as deburring
      under process_caps-0032.
