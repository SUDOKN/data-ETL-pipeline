  reason: a system, not a certification with an identity of its own - the thing ISO 13485 certifies, not itself
    an attestation (line 971)
- form: IQMS
  reason: IQMS(TM) is an ERP software product listed inside the 'Our quality system' bullet list, immediately below
    real certifications (line 1267/2094)
- form: 8D Problem-Solving Methodology
  reason: a problem-solving methodology, not a certification; sits in the same bullet list as the ISO rows (line
    1269)
- form: Total Cost of Non-Quality of Less than 1%
  reason: a performance metric printed in the certification bullet list (line 1266)
- form: Counterfeit Parts Prevention Policy
  reason: an internal company policy document on the Policies page, no issuing body (line 2997)
- form: Management Commitment Statement
  reason: an internal policy document (line 3003)
- form: Purchase Order Terms and Conditions
  reason: a commercial document (line 2999)
- form: Customer Terms and Conditions
  reason: a commercial document (line 3001)
- form: Privacy Statement
  reason: a website legal document (line 3005)
- form: Private IPO
  reason: New Heritage Capital's trademarked investment structure, printed with a (R) mark next to compliance-flavoured
    prose (line 5902)
- form: Lean Enterprise Initiative
  reason: a named internal efficiency program at a former employer, not a standard (line 690)
- form: MBA from UC Irvine
  reason: an academic degree, not a certification (line 690)
- form: West Point graduate
  reason: an academic credential (line 690)
- form: Society for Human Resource Management
  reason: a professional-association membership (line 728)
- form: certified to produce polymer implants
  reason: a customer survey outcome with no named standard or issuing body (line 1154)
- form: ISO 14001
  reason: 'anticipatory: the environmental-management sibling standard. EPTAM''s page has a ''Sustainability Initiatives''
    section (line 4615) and this string occurs ZERO times'
- form: ISO 45001
  reason: 'anticipatory: the occupational-health sibling standard; ZERO occurrences'
- form: IATF 16949
  reason: 'anticipatory: the automotive QMS standard. The site names Automotive as an industry (line 4631) but this
    string occurs ZERO times'
- form: NADCAP
  reason: 'anticipatory: the aerospace special-process accreditation. AS9100D + passivation + anodizing are all
    present, which is exactly the association that mints it; ZERO occurrences'
- form: MDSAP
  reason: 'anticipatory: the Medical Device Single Audit Program pairs with ISO 13485 + ANVISA in world knowledge;
    ZERO occurrences'
- form: CE Mark
  reason: 'anticipatory: EU MDR is named (line 5560) but ''CE Mark'' occurs ZERO times'
- form: ISO 14644
  reason: 'anticipatory: the cleanroom standard the ''ISO Class 7/8'' rows actually come from - never spelled out
    in the text'
- form: D-U-N-S
  reason: 'anticipatory: business-registry identifier; the site carries a CAGE Code but ZERO D-U-N-S'
