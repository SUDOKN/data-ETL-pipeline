    approx_offset: 56222
  notes: 'DISPUTED: the AIAG Production Part Approval Process is a named industry standard, but here it is offered
    as a service the plant performs, which reads as a process_cap. Seeded in BOTH fields; disputed here | PPAP appears
    once, as a customer service EPTAM performs: ''can handle all its customers'' assembly, packaging, DFM, and PPAP
    and IQ OQ PQ needs''. Read as a part-approval process it is a capability (already confirmed at process_caps-0042);
