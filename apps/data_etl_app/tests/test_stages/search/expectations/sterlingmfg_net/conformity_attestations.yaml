    approx_offset: 3254
  notes: a US government supplier registry identifier; footer prints it unattributed. Registry identifiers have
    been argued either way (see SEEDING_BRIEF on D-U-N-S) but this one has a name, a number and an issuing body
    | a CAGE code is a government-assigned entity identifier, the same class of thing as D-U-N-S, which SEEDING_BRIEF
    section 4 says has repeatedly been argued either way and should be seeded disputed. It attests to registration
    in a supplier registry, not to conformity with any standard.
