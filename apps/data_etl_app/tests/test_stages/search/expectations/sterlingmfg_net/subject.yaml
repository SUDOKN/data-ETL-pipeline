context: 'ENTITY DRIFT - this is the corpus''s entity-drift case. The seed domain is sterlingmfg.net but every one
  of the 51 scraped pages is served from eptam.com and the site names itself EPTAM Precision Solutions, headquartered
  at 2 Riverside Business Park, Northfield, NH 03276. Sterling Manufacturing (founded 1968, Lancaster MA) was ACQUIRED
  by EPTAM on 2022-09-19; the press release on line 4819 is the only page that explains the link, and line 4835
  is the only place the seed domain itself appears, as ''For more information about Sterling and Albright, visit
  (http://www.sterlingmfg.net/)''. The old database record''s Colorado HQ is also wrong for the group as a whole,
  though EPTAM does run two Colorado sites (Colorado Springs metals/laser, Broomfield rapid launch). FIVE-ACQUISITION
  ROLL-UP, all named in the news posts: Relius Medical (2018, Colorado Springs metals), Mendell Machine and Manufacturing
  (2021, Lakeville MN micro-machining), Ingram Machining (2022, Broomfield CO, re-branded EPTAM Rapid Launch Center),
  Sterling Manufacturing + its subsidiary Albright Silicone (2022, Lancaster and Leominster MA molding). Owned by
  Frazier Healthcare Partners since Dec 2019; previously New Heritage Capital. NINE named sites across NH, MA(2),
  NJ, CT, MI, MN, CO(2). MEDICAL-DEVICE REGIME: ISO 13485:2016 at all four registrants, four separate FDA establishment
  registration numbers, 21 CFR 820, AS9100D, ITAR/DDT, CAGE code, ANVISA.'
scrape_hazards:
- hazard: the site is eptam.com, not sterlingmfg.net - the subject name and the text's self-name disagree completely;
    anything keyed on the domain will mis-attribute every fact
  quote: ©2023 EPTAM Precision - All Rights Reserved. Site by wedu
- hazard: a ~240-entry ISO country dropdown from the careers form is dumped into the text TWICE (lines 2663-2911
    and 3900-4148), roughly 8% of all lines; countries are not industries
  quote: Bonaire, Sint Eustatius and Saba
- hazard: a 54-line nav+footer block repeats on all 52 pages (3,120 of 6,102 lines, 51% of the file). It carries
    the CERTIFICATIONS list, so every certification form occurs 52+ times and every window sees them
  quote: 'EPTAM Plastics, LTD Registration Number: 3005144609'
- hazard: certifications are scoped to FOUR DIFFERENT LEGAL REGISTRANTS with four FDA numbers, and the footer names
    them differently from the quality page (EPTAM Plastics LTD vs EPTAM Precision Plastics; EPTAM West LLC vs EPTAM
    Precision Metals)
  quote: 'FDA #3011302692 (West/Metals)'
- hazard: 'the quality page and the silicone-molding page CONTRADICT each other: one lists FDA #3005144609 and #3011302692
    as held, the other as pending'
  quote: 'Pending FDA Registration (#3005144609, #3011302692)'
- hazard: 'scrape-faithful typos throughout: ''Hass VF-SS'' for Haas, ''semi-conductur'', ''Polyproplene'', ''Nylond
