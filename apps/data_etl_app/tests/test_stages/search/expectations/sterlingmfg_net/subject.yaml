sampling_notes: 'READ EXHAUSTIVELY. 211,477 bytes / 6,102 lines / 51 distinct page URLs, all on eptam.com. Method:
  the whole file was read in sed slices after mechanically stripping the 52 repeated nav+footer blocks (3,120 lines,
  51% of the file) into markers, leaving 3,086 unique-content lines, every one of which was read. Both copies of
  the ~240-line country dropdown were read once and skimmed the second time. Then targeted greps: standards bodies
  (ISO/AS/CFR/FDA/ITAR/Mil-I/NCSL/ANVISA/EU MDR), machine brands (Okuma/Tsugami/Komo/Mazak/Haas/Tornos/Star/Engel/Arburg/Toyo/Brother/Topper/Fanuc/UR10),
  generic machine nouns (printer/furnace/lathe/mill/router/press/turret/spindle/welder/cutter/marker), every -ing
  word in the file (ranked by frequency), a 60-term word-boundary material roll-call, an industry roll-call, and
  a product-designation sweep. Unique content is: 9 capability pages, 9 industry pages, about/leadership/locations/quality/policies/careers,
  and 12 news posts; the rest is duplicate stubs, 404 stubs and repeated resource-index listings.'
notes: 'All six fields are non-empty and dense. products.yaml doubles as the contract_products expectation: EPTAM
  is an OUTSOURCED/contract manufacturer, so most product entries are parts made for OEM customers, and the semiconductor
  applications list is explicitly client-side (actor: client). The site''s own service lines (machining, molding,
  laser, additive) are process_caps, not products. equipments was seeded strictly to the equipment prompt''s exclusion
  list: the five CMM mentions, the Zeiss O-inspect/Contura metrology line, the cleanrooms, the molds and the tooling
  are all false_friends there, not entries - the alecmfg false-RED failure mode. UR10 cobots, the Fanuc control,
  the ATC and the turret are seeded DISPUTED because they sit exactly on that boundary. NOTE FOR THE BUILD STEP:
  build_expectations.py does not carry `status_hint` through, so the 17 disputed entries will land as `candidate`
  unless their status is set by hand.'
