notes: >-
  DELIBERATELY NOT AN INVENTORY. The file carries 1,291 /equipment/ resale
  listings; recall on this subject is measured mainly by the mechanical
  brand/model sweep over listing pages, not by this entry list. The entries
  below are representative probes chosen from the sampled listings, spread
  across brands, machine types, and file offsets. Every machine is a resold
  third-party unit (actor reseller_inventory) — ACI is a dealer; nothing
  here is ACI's own shop equipment. VERIFY 2026-08-26 (second independent
  pass): all 14 entries confirmed; every evidence quote verified verbatim
  against the snapshot after NBSP normalisation and whitespace collapse.
  Independent listing sample - six /equipment/ pages at fresh offsets NOT in
  subject.yaml's pages_read (line 20074 ACER SMC 2442, 52003 CHEVALIER
  FBL-530, 96032 JET SLT-1100, 118004 JET 22-44, 160005 EXPAND MACHINERY
  T-500, 228105 CHEVALIER FVM-3016DCL) - reproduces the seeded page
  structure exactly: uniform Overview (Type / Manufacturer / Model /
  Condition / Status), a flattened Specifications table, an optional OEM
  Description paragraph, a 12-item Suggested Equipment block of further
  BRAND MODEL pairs, the 14-brand Related Brands block and a Related Types
  block. This confirms the 'DELIBERATELY NOT AN INVENTORY' framing from the
  other side: each listing page mints roughly a dozen MORE brand/model
  designations than the one machine it is about, so recall here has to be
  measured by the mechanical brand/model sweep, never by this 14-entry list.
  One form flagged in-entry (0003).
