eval_set_version: 1
profile: >-
  ACI Machine Tool Sales (2001 Foundation Drive, Lawrenceburg, KY) is a
  machine-tool DEALER/DISTRIBUTOR founded 2001 by Mark Cox, selling and
  servicing new machine tools in Kentucky and southern Indiana. 1,291 of the
  1,430 pages are /equipment/<id>-<brand>-<model> resale listings. Every
  equipment, material, and product mention belongs to resold third-party
  machines; the subject's OWN capabilities are only the support-page field
  services (troubleshooting, spindle/control repairs, installations, part
  replacements, retrofit, precision leveling, maintenance, ball bar testing).
