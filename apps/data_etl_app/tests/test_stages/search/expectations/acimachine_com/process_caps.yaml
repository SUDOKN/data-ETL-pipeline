notes: >-
  The subject's OWN process capabilities are exactly the field-service
  operations on the /support page (plus 'servicing machine tools' on
  /About_Us) — entries 0001-0009, all actor own. Machine spec-
  sheet/marketing operations (grinding, shearing, sawing, forming, ...)
  belong to the resold machines, not ACI; entry 0010 is ONE representative
  reseller_inventory probe for that pattern — hundreds more like it exist in
  listing prose and are deliberately not enumerated. A second pass may
  promote more of them as reseller_inventory entries under strict recall-
  first; on this scale-stress subject they are the wrong-actor precision
  trap. VERIFY 2026-08-26 (second independent pass): all 10 entries
  confirmed; every evidence quote verified verbatim. The /support page (line
  958) was read in full and the eight service-list items plus 'selling and
  servicing machine tools' are exactly as seeded. TWO ISSUES RECORDED RATHER
  THAN ACTED ON. (1) CROSS-SUBJECT INCONSISTENCY on taxonomy code I. Most of
  the own-actor entries here are field-site work performed at the customer's
  plant - 0003 Machine & Option Installations explicitly, 0006 Precision
  Leveling in substance, and arguably 0001/0004/0005/0008 - and
  TAXONOMY.md's code I (installation/field-site work) does NOT roll up to
  in_field. The austinelectricservices seed applied exactly the opposite
  rule, stating in its own process_caps notes that code-I operations are
  'NOT in_field under the rollup' and seeding zero entries for the same
  class of work. As written, one subject requires a run to return field-site
  services for recall while the other counts them against precision. That
  needs a single ruling from the user, not a per-entry dispute, so all 10
  were confirmed here for internal consistency and the conflict is flagged.
  (2) Over-broad or absent acceptable_forms flagged in-entry on 0002, 0003
  and 0006.
