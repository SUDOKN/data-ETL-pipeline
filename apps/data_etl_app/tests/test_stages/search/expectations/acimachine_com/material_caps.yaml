      gauge' — machine capacity, not an ACI material capability
  - form: "aluminum"
    reason: >-
      machine construction ('Heavy duty cross-ribbed cast aluminum frame' x12)
      and cuttable-material lists in third-party marketing; 34 lines total,
      none an ACI capability
  - form: "stainless steel"
    reason: >-
      components of resold machines: 'hardened and tempered stainless steel
      blades', 'Separate Stainless Steel Tank'
  - form: "cast iron"
    reason: >-
      machine bases/frames ('heavy-duty cast iron base', 'Meehanite processed
      cast iron frame'); ~90 lines, all resold-machine construction
  - form: "carbon steel"
    reason: "machine roll material ('polished carbon steel' slip-roll rolls)"
  - form: "Meehanite"
    reason: >-
      cast-iron grade of resold machine structures (59 lines, all in listing
      descriptions); reads like an alloy designation but is machine
      construction, not a worked material
  - form: "Lead"
    reason: >-
      polyseme and known substring trap: blog prose 'this new lead' (sales
      lead), machine components 'lead screw' (5 lines), and one genuine
      material sense inside a resold shear's cuttable list 'steel, aluminum,
      brass, copper, lead, plastic and zinc'
  - form: "steel"
    reason: >-
      bare form is generic/machine construction ('rigid steel construction');
      no worked-material sense anywhere
  - form: "ferrous"
    reason: >-
      bandsaw cutting-capacity phrasing 'precision sawing of ferrous and
      non-ferrous materials' — the machine's rating
