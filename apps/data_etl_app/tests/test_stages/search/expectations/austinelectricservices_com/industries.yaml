false_friends:
  - form: "Manufacturing"
    reason: >-
      Occurs only in the marketing tagline "We Lead the Industry in Efficiency
      and Manufacturing Productivity" (electrical landing + umbrella home page).
      No manufacturing activity anywhere in the corpus; G/W, not a sector served.
  - form: "fabricación"
    reason: >-
      Spanish mirror of the same tagline: "productividad de fabricación" (2
      occurrences, both taglines). The classic Spanish manufacturing false
      friend for this corpus.
  - form: "industria"
    reason: >-
      Spanish generic: "Somos líderes en la industria...", "líderes de la
      industria" (leadership boilerplate). Generic, names no sector.
  - form: "Industry"
    reason: >-
      "We Lead the Industry..." taglines and "experienced industry leaders"
      bio boilerplate; bare generic.
  - form: "residential construction"
    reason: >-
      "reduce residential construction cycle times" (4x, Synergos acquisition
      blurbs) describes the group's OWN activity - code O, not a sector served.
  - form: "Construction"
    reason: >-
      Own trade of the whole umbrella ("general construction tools",
      "new construction tract homes"); O/G, never a customer sector.
  - form: "Defense"
    reason: >-
      Word-association only: security-marketing verb "ready to defend your
      space with precision" on /security-systems/. No defense-sector content.
  - form: "Automotive"
    reason: >-
      Word-association from the "Connected Car" monitoring add-on ("Extend your
      security to your vehicle"); a $7/month subscription, not an automotive
      sector claim.
  - form: "Energy"
