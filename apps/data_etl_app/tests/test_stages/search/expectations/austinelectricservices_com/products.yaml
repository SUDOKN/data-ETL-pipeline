notes: >-
  This file also serves contract_products: the contract_products expectation
  for this subject IS empty - nothing in the corpus is manufactured, under
  contract or otherwise. The products entries below all come from the ONE
  designation-rich page in the corpus, /security-systems/, where sibling
  division Austin Integration offers resold third-party security devices;
  per the recall-first contract they are must-find product designations
  (code B: third-party part offered, actor reseller_inventory). Everything
  on the other 99 pages should yield nothing, so this file is simultaneously
  a recall probe (one page) and a junk-minting probe (the rest). Judgment
  line drawn here: the shipped DIY hardware bundle and the named devices are
  entries; the professionally-installed "Pro" tiers and monthly monitoring
  add-ons (Water Management, Connected Car, Pro Video Package, Video
  Expansion, Doorbell with Analytics) are service-plan names, kept as false
  friends. VERIFY 2026-08-26 (second independent pass): expected_empty=false
  AGREED and all 9 entries confirmed; /security-systems/ (line 1515) was
  read in full and every device designation verified in context. ON THE
  REQUESTED OUT-OF-FIELD SCRUTINY: none of the nine is out of field, and I
  would resist a dispute on any of them. TAXONOMY.md's products table makes
  code B explicitly cover 'third-party part offered', and
  EXPECTATIONS_SCHEMA.md's recall-first rule admits an entity the text names
  regardless of actor - so resold Austin Integration hardware is must-find
  with a reseller_inventory flag, exactly as acimachine's resold machines
  are. The five model-numbered devices (VDB750, V723X, V515, PowerG panel,
  Flex IO) are unarguable; the three category-named sensors and the DIY
  bundle are B, with the weakest form flagged in 0008. The seed's line
  between shipped/named devices (entries) and service-plan tiers (false
  friends: Pro / Pro Plus / Pro Premium Package, Water Management, Connected
  Car, Pro Video Package, Video Expansion, Doorbell with Analytics) is drawn
  correctly and survives re-reading - those name subscriptions and
  installation service levels, not goods. ONE GAP FOUND, not filled per the
  no-add rule: the Security Add-On Features list on the same page names
  Glass Break Detectors, Panic Buttons (Wall or Pendant), Extra Door/Window
  Contacts, Smoke & CO Detectors, Flood Sensors and Remote Key Fobs, which
  are the same class of device as entries 0007/0008 but appear in neither
  entries nor false_friends, so a run returning them currently scores as
  neither recall nor junk. ('Smart Locks' from the automation list IS
  covered.)
