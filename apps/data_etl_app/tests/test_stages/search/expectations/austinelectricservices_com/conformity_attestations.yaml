subject: austinelectricservices.com
field: conformity_attestations
snapshot:
  file: apps/data_etl_app/src/data_etl_app/knowledge/sample_scraped_texts/austinelectricservices.com.txt
  sha256: "26d3b2d8c2d57c0219a2c12e0727aeca1bbf2da11f0d1142bae3a58adaabd118"
eval_set_version: 2
expected_empty: true
notes: >-
  Out-of-domain negative. ISO, AS9100, IATF, NADCAP, ASTM, ANSI, NFPA, NEC,
  UL, ITAR are all grep-absent (word-boundary verified) - no manufacturing
  certification exists in this corpus. The four candidates below are the
  only named certification/regulatory designations in the text, and every
  one is marginal: technician-level credentials in job ads, a sibling
  division's trade-body program, a product-level program on installed goods,
  and a state contractor license. They are seeded recall-side per the
  recall-first contract; yield beyond them is junk-minting signal, and
  "electrical code"/"HVAC code" building-code prose is the headline false
  friend. VERIFY 2026-08-26 (second independent pass): expected_empty=true
  AGREED. Independent word-boundary greps reproduce zero for ISO <digits>,
  AS9100, IATF, NADCAP, ASTM, ANSI, NFPA, NEC, UL, OSHA and 'accredit'; the
  3 case-insensitive 'ITAR' hits are substring artifacts inside Spanish
  'militar' and 'facilitar', not the regulation. The 'CE' false friend is
  correctly scoped - word-boundary CE occurs exactly 4 times, all 'CE George
  Mechanical'. Of the four seeded entries 0001, 0002 and 0003 are confirmed
  and 0004 (Arizona ROC#) is DISPUTED; reasons in each entry. FALSE-FRIEND
  FORM DEFECT: "driver's license" is written with a straight apostrophe but
  the text uses a curly U+2019 ('Reliable transportation & valid driver's
  license.', 'Valid driver's license.'), so that false friend can never
  match an echoed surface form and should be re-typed with the curly
  character or reduced to 'license'. 'SMS opt-in consent' likewise never
  occurs, but as a pure mint-probe that is legitimate.
entries:
  - id: austinelectricservices_com-conformity_attestations-0001
    name: "EPA 608"
    status: confirmed
    acceptable_forms:
      - "EPA 608 certification"
      - "EPA 608"
      - "certificación EPA 608"
    evidence:
      - quote: "Candidate must EPA 608 certification and be willing to attend regular trainings."
        approx_offset: 36298
      - quote: "Candidate must EPA 608 certification and be willing to participate in an On-Call rotation."
        approx_offset: 61680
      - quote: "El candidato debe contar con la certificación EPA 608"
        approx_offset: 86211
    actor: parent_sibling
    notes: >-
      EPA Section 608 refrigerant-handling certification, required of Austin
      HVAC (sibling division) job candidates. Genuine regulatory
      designation, but a technician-level credential appearing ONLY in job
      ads (evidence_kind job_ad) - sits on the V-vs-Z line; second pass
      should decide whether HR context demotes it. VERIFY 2026-08-26
      CONFIRMED, and answering the seed's open question: HR context does NOT
      demote this. EPA Section 608 is a genuine federal regulatory
      certification designation under the Clean Air Act, so it is V/B on the
      conformity table. Code Z covers the non-conformity certificate SENSE
      (an HR 'certificate program'), not the page genre a real certification
      happens to be named on; job-ad context is an evidence_kind flag, not a
      code demotion. Both English quotes (lines 938, 1639, including the
      source's own grammar slip 'must EPA 608 certification') and the
      Spanish mirror (line 2270) verify verbatim.
    provenance:
      - {action: added, by: "seed-agent-austinelectric", date: "2026-08-26", source: corpus-seed}
      - {action: verified, by: "verify-agent-acimachine-austin", date: "2026-08-26"}
  - id: austinelectricservices_com-conformity_attestations-0002
    name: "Post-Tensioning Institute Field Certification Program"
    status: confirmed
    acceptable_forms:
      - "Post-Tensioning Institute’s Field Certification Program"
      - "Post-Tensioning Institute"
      - "Field Certification Program"
      - "Programa de Certificación de Campo del Post-Tensioning Institute"
    evidence:
