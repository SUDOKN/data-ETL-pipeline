false_friends:
- form: Act Contact Manager
  reason: 'the agency''s contact-management SOFTWARE, the only thing on the site that Mathews itself ''utilizes'':
    ''Mathews & Company utilizes Act Contact Manager to track customer activity''. Processes no material.'
- form: Harris Industrial Guides
  reason: a printed industrial directory used for SIC lookups, not a machine
- form: Agricultural Equipment
  reason: a MARKET name in the Kansas Markets list, repeated in all 25 page footers; the agency sells INTO this
    market, it owns no such machine
- form: Construction Equipment
  reason: a MARKET name in the Kansas Markets list, repeated in all 25 footers
- form: heavy equipment
  reason: 'a market segment in Stadco''s copy: ''parts for trucks and heavy equipment'''
- form: equipment knobs
  reason: 'a DimcoGray product line: ''Competitive purchase costs for equipment knobs and handles'' - the artifact,
    not the machine'
- form: Air Conditioning units
  reason: the artifact a principal MAKES ('Heaters & Air Conditioning units for commercial vehicles and buses');
    even as plant gear, conditioning equipment is excluded by the clause
- form: in-house tooling
  reason: 'tooling is excluded by name in the clause - what a machine holds, guides or acts through: ''in-house
    tooling with CAD assistance'''
- form: customized tooling
  reason: 'tooling, excluded by the clause: ''tool & die makers build customized tooling'''
- form: permanent mold
  reason: a mold is tooling, excluded by the clause; the phrase IS a legitimate process_caps entry (permanent-mold
    casting), which is where it belongs
- form: Die Springs
  reason: a Fox Valley Spring PRODUCT line, not a die; 'die' would be tooling anyway
- form: EDI capability
  reason: electronic data interchange - a business system, not a production machine
- form: CAD assistance
  reason: design software, not a production machine
- form: CMM
  reason: 'the canonical equipment-boundary trap: measuring machines are excluded by the clause. Never occurs in
    this text either'
- form: press brake
  reason: word-association from the stamping and press pages; never occurs
- form: lathe
  reason: word-association from 'rough turned bar' and Swiss machines; never occurs
- form: milling machine
  reason: word-association from '5-axis vertical milling'; never occurs
- form: machining center
