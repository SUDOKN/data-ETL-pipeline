subject: mathewsco.com
field: equipments
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/mathewsco.com.txt
  sha256: f1a1ace7c17205dc4906f4f87eb1844cefd0661483e58b3f5d6538d30b33b15b
eval_set_version: 2
expected_empty: false
notes: 'NOT empty, but small and entirely third-party. Mathews owns no production machine; its only literal ''equipment''
  is Act Contact Manager (contact-management software) and Harris Industrial Guides (a printed SIC directory), both
  seeded as false friends. The real entries come from two principals'' plant descriptions. Seeded strictly to the
  prompt''s clause: a production machine ACTS ON THE WORK, which excludes measuring/inspecting/testing gear, plant
  power and conditioning, material movement and storage, and ALL TOOLING (dies, molds, jigs, fixtures). That is
  why ''in-house tooling'', ''permanent mold'' and ''Die Springs'' are false friends here even though they are real
  entries in other fields.'
