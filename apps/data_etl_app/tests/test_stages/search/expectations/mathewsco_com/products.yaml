false_friends:
- form: Sun Microstamping
  reason: a principal's COMPANY NAME, excluded by the clause; it appears 12 times and reads like a product line
- form: Missouri Pressed Metals
  reason: a principal's company name (also abbreviated Mo-Press / MO-PRESS)
- form: Rowley Spring & Stamping Corp
  reason: a principal's company name that is built entirely from product and process words
- form: Insulation Components Associates
  reason: one of the two 1892 predecessor AGENCIES, named in the 1992 magazine profile; reads like a component product
    line
- form: Amatom Electronic Hardware
  reason: 'a company name: ''We also own Carey''s sister company, Amatom Electronic Hardware'''
- form: Ellwood City Forge
  reason: a principal's company name, appearing in nav lists on 9 pages
- form: Line Card
  reason: the agency's own sales document listing its principals - a document, excluded
- form: Online Catalog
  reason: a document/website link on the Amatom page, not an artifact
- form: Harris Industrial Guides
  reason: a printed SIC directory the agency subscribes to
- form: Act Contact Manager
  reason: the agency's contact-management software
- form: 1992 Agency Magazine
  reason: a document - the trade-magazine reprint page title
- form: Brochure from 1952
  reason: a document - a nav entry for a content-empty page
- form: Pump and Valve Manufacturers
  reason: a CUSTOMER GROUP in the Kansas Markets list, explicitly excluded by the clause; the pumps and valves themselves
    are never named as artifacts the site's principals make
- form: Agricultural Equipment
  reason: a market name in the Kansas Markets list, repeated in 25 footers
- form: Construction Equipment
  reason: a market name in the Kansas Markets list, repeated in 25 footers
- form: in-house tooling
  reason: tooling is excluded from products by the clause
- form: Transition From Direct Sales To Manufacturers' Representatives
  reason: one of the founder's two seminars - training, excluded by the clause by name
- form: bicycle
  reason: occurs only in 'Bill had met Henry Ford at a bicycle show in 1903' - an event
- form: World Class Status
  reason: an award-shaped marketing claim, excluded by the clause
