eval_set_version: 2
expected_empty: false
notes: 'Rich field. The cert wall (17 items) appears verbatim on the homepage AND the why-able page; the footer cert string
  repeats on all 27 pages. All attestations are the subject''s own; none of the press releases attribute certifications to
  other companies, but OEM authorizations name their grantors (Airbus, Bell, Leonardo). SECOND-PASS VERIFICATION 2026-08-26
  (verify-agent-ableengineering): all 23 evidence quotes located verbatim in the snapshot; 22 confirmed, 1 disputed (0023
  DER - personnel job title, not a company attestation). Short-form audit: PMA, CAA, CAAT, DGCA, ECAA, JCAB, SMS, ARSA, NATA
  are all real word-bounded designations in the text, none is a substring artifact; the over-broad ones on the MATCHING side
  are ''Part 145'' (shared by 0001/0003), ''NADCAP'' (shared by 0010/0011/0012), ''CAA'' (contained in CAAC/CAAT/ECAA and
  in Able part numbers ending -CAAA) and ''DER''. All 6 false friends checked and agreed: ''FAA-approved'' is a bare adjective
  19x, ''Certified'' is the footer trailing word plus the QUALIFIED/VERIFIED/CERTIFIED heading, and the two footer document
  titles carry no standard id.'
