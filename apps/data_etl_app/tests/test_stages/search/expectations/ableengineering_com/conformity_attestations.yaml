- id: ableengineering_com-conformity_attestations-0023
  name: Designated Engineering Representative (DER)
  status: disputed
  acceptable_forms:
  - designated engineering representatives (DER)
  - DER
  evidence:
  - quote: designated engineering representatives (DER), specialists, avionics techs
    approx_offset: 742
  notes: 'borderline: FAA designation held by staff members, not a company certificate; second pass may dispute | DISPUTED
    by second pass 2026-08-26: both occurrences are personnel-roster text - ''a dedicated team of more than 350 mechanics,
    engineers, designated engineering representatives (DER), specialists, avionics techs'' and ''our on-site engineering and
    DER specialists have - on average - 20 years of industry experience''. DER is a staff job title here; the text never presents
    it as an attestation the company holds and makes no compliance claim from it. Separately the bare form is unsafe for containment
    matching: only 2 of the 18 case-insensitive substring hits are the acronym, the rest sit inside provider/providers/leader/Federal/grinders/under/understanding,
    so any returned form containing ''der'' would be credited.'
  provenance:
  - action: added
    by: seed-agent-ableengineering
    date: '2026-08-26'
    source: corpus-seed
  - action: disputed
    by: verify-agent-ableengineering
    date: '2026-08-26'
false_friends:
- form: FAA-approved
  reason: generic approval adjective repeated ~20x; the concrete attestations are FAA Part 145 / FAA PMA
- form: CERTIFIED MULTIPLIED
  reason: marketing heading above the cert wall, contains no standard id
- form: Certified
  reason: generic ('QUALIFIED. VERIFIED. CERTIFIED.' heading, 'ISO9001:2015 Certified' trailing word alone)
- form: Instructions for Continued Airworthiness
  reason: regulatory document title in footer resource links (taxonomy D), not a certification held
- form: Able Aerospace Warranty
  reason: company document title in footer resource links (taxonomy D)
- form: Privacy Policy
  reason: legal boilerplate link (junk)
