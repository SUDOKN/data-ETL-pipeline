false_friends:
- form: 204B
  reason: aircraft-model search facet from the flattened filter lists ('204-B 204B 205A-1 205B 206A...'), not a product
- form: B737
  reason: aircraft-model facet / platform designation, not a subject product
- form: AS350
  reason: customer helicopter model facet, not a subject product
- form: Boeing
  reason: OEM/customer platform brand (Make facet), not a product designation
- form: Bell
  reason: OEM/customer platform brand (Make facet), not a product designation
- form: Skydrol
  reason: third-party hydraulic fluid brand whose components Able services, not a product sold
- form: OEM P/N
  reason: catalogue row label (junk); bare part-number strings after it are identifiers, not designations
- form: ADD TO REQUEST
  reason: UI button text (junk)
- form: Airbus H125/H130
  reason: rotor-wing literature/datasheet title (taxonomy D), not a product
