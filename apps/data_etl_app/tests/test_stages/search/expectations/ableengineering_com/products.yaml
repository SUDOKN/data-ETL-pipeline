subject: ableengineering.com
field: products
snapshot:
  file: apps/data_etl_app/src/data_etl_app/knowledge/sample_scraped_texts/ableengineering.com.txt
  sha256: ffc5c3234c4dff2387887d61903a00d5320905f296fcff4b731c3f8d76529eb9
eval_set_version: 2
expected_empty: false
notes: 'This file also serves the contract_products field (single expectation set for both). Entries 3-9 are exchange components;
  18-22 are representative picks from the PMA parts catalogue - the catalogue''s generic single-noun rows (BEARING, BOLT,
  BUSHING, ADAPTER...) are real parts offered (code B if returned) but are deliberately not seeded as must-find entries. MRO
  catalogue rows (e.g. 42 DEGREE GEARBOX ASSEMBLY, 200SGL STARTER GENERATORS) name components repaired/overhauled, not goods
  sold; treated as repair-scope, not product entries. The flattened MODEL facet lists on /parts/ and /mro/ pages are search-filter
  junk, covered by false_friends and subject.yaml hazards. SECOND-PASS VERIFICATION 2026-08-26 (verify-agent-ableengineering):
  all 22 entries confirmed, all quotes verbatim. Checked specifically against the facet-list hazard: no entry rests on the
  flattened MODEL filter lists (''204-B 204B 205A-1 ...'') or on bare part numbers - entries 18-22 were each traced to a real
  catalogue PART row (designation line + OEM P/N + Able P/N + Make + Model), which is spec-table content but is an entity.
  Noted inconsistency for the user, not disputed: entries 12-17 are components named in the fixed-wing REPAIR capabilities
  list, which is the same repair-scope basis this file uses to exclude the MRO catalogue rows (42 DEGREE GEARBOX ASSEMBLY,
  200SGL STARTER GENERATORS, ...); under recall-first both are defensible, and a must-find list is allowed to be a subset.
  All 9 false friends checked and agreed; consider also ''Rotor Wing PMA''/''Fixed Wing PMA'', which are datasheet-page literature
  titles of the same kind as ''Airbus H125/H130''.'
