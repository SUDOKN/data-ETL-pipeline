notes: 'TWO entries, both from one clause on line 19. The prior corpus-vetting note claimed this field was hard-empty;
  that is REFUTED - ''machine shops and fabricators'' names the market MED-TEK''s services serve, which is exactly
  the field''s clause (''a recognizable domain of economic activity that a manufacturer''s goods or services can
  serve''). Beyond those two the field really is bare: a full sweep for aerospace, automotive, defense, firearms,
  oil and gas, energy, agriculture, mining, marine, dental, surgical, implant, semiconductor, electronics, food,
  pharma, nuclear, rail, truck and construction returned ZERO hits. DEFENSIBLE BORDERLINES not seeded and not false-friended:
  ''HEAT TREATING TECHNOLOGY'' (line 10) and ''commercial'' / ''commercial clients'' (lines 19, 100) - commercial
  heat treating is a real sector, but it is MED-TEK''s OWN sector rather than one its services serve, so a run returning
  it is a code-B borderline, not a must-find and not junk.'
