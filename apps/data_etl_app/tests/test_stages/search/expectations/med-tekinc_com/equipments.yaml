false_friends:
- form: Rockwell Hardness Machines
  reason: WITNESSED (line 32) - the site's most machine-shaped noun and the field's central trap. A hardness tester
    only MEASURES the work; the prompt's clause excludes 'equipment that only measures, inspects, or tests the work'.
    Belongs to process_caps (Rockwell & Brinell testing), where it is seeded
- form: state-of-the-art equipment
  reason: WITNESSED (lines 21 and 32) - marketing filler containing the word 'equipment' but naming no machine at
    all
- form: loading docks
  reason: WITNESSED (line 21, 'three indoor loading docks') - excluded by the clause's 'moves, stores, or carries
    what it makes'; also a facility rather than a machine
- form: standard block
  reason: WITNESSED (line 32) - the reference block the Rockwell tester is verified against. Tooling for a measuring
    device, doubly excluded
- form: CNC machining center
  reason: ANTICIPATORY - zero occurrences of CNC, lathe, press brake or machining center. MED-TEK owns no metal-removal
    machinery; word association from 'machine shops', which are its customers
