false_friends:
- form: Flame Hardening
  reason: ANTICIPATORY - zero occurrences in the file (grep -i flame = 0). An earlier pipeline run emitted it for
    this subject; only fabrication can hit it. The site does list Induction, Spin, Neutral, Salt Bath and Tool Hardening,
    which is where the word association comes from
- form: Case Hardening
  reason: ANTICIPATORY - zero occurrences. Strong association with the carburizing/carbonitriding that IS listed,
    and with the equipment line's 'All Case Furnaces' (where 'Case' names the furnace type, not a hardening process)
- form: Cryogenic Treatment
  reason: ANTICIPATORY - zero occurrences. Word association from 'Sub Zero Stabilizing'
- form: Machining
  reason: ANTICIPATORY - zero occurrences on a word boundary. The file has 'machine shops' (the customers) and 'Rockwell
    Hardness Machines' (a tester); MED-TEK machines nothing
- form: shipping
  reason: WITNESSED - 'lower shipping costs' (line 27) and 'handle shipments' (line 21) are logistics. This field's
    boundary runs 'from raw material through to finished goods ready to ship', so shipping itself is past the end
    of it
