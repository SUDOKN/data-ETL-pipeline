  notes: 'EXPLICITLY NEGATED: the subject states it does NOT machine automobile parts. Kept per recall-first semantics (the text names the domain; negation/attribution is downstream''s job) - surfacing it at search is not an error, but the judged pass should flag the negation. No actor set: it is a negated own-capability statement. Confirming pass should weigh whether this should ever gate recall. DISPUTED (verify-agent-101machine, 2026-08-26): disagree that this should be a must-find entry. The schema''s recall-first carve-out covers ACTOR concerns only (client/supplier/lab/reseller); negation is not an actor concern. The text names automobile work solely as a sector explicitly NOT served, so it is not an in-field ''industry served or targeted''. Confirming would gate recall against runs that correctly honor the negation; products already treats the same sentence as a false friend. Recommend it stay non-gating unless the user rules otherwise.'
