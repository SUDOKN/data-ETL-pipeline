false_friends:
- form: etching
  reason: appears only as a client's 'etching equipment' (the subject machined components FOR it); zero subject-operation
    sense
- form: wafer handling
  reason: the semiconductor client's own system being upgraded, not an operation of the subject
- form: manufacturing
  reason: generic (G)
- form: production
  reason: 'generic (G): ''production lines'', ''mass production'''
- form: Quality Management
  reason: facility zone name / business function (Z), not an operation on the work
- form: Engineering & Project Management
  reason: facility zone name / business function (Z)
- form: Manual Work
  reason: facility zone name with no operation content (G)
- form: packaging
  reason: dominant sense is protective shipment packaging / logistics (Z); 'packaging lines' are a client's product
