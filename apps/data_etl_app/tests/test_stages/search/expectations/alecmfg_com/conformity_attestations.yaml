- id: alecmfg_com-conformity_attestations-0016
  name: D-U-N-S Number
  status: disputed
  acceptable_forms:
  - D-U-N-S
  evidence:
  - quote: obtained its official D-U-N-S® Number from Dun & Bradstreet
    approx_offset: 114607
  notes: 'borderline (B) and dispute-prone: a business registry identifier, but the text itself calls it
    a certification. DISPUTED (verify-agent-alecmfg 2026-08-26): the D-U-N-S Number is a Dun & Bradstreet
    business registry identifier attesting company identity and credit standing, not conformity to any
    standard; the certification wording on the page is marketing framing, and it fits none of the V/B senses
    (standard, named program, audit scheme, code body).'
  provenance:
  - action: added
    by: seed-agent-alecmfg
    date: '2026-08-26'
    source: corpus-seed
  - action: disputed
    by: verify-agent-alecmfg
