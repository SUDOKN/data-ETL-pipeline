false_friends:
- form: STC
  reason: Sound Transmission Class is a performance RATING metric ('STC 46'), not a standard designation - the standard
    behind it (ASTM E413) is the entry
- form: Sound Transmission Control
  reason: application-page heading for the rating family, not a standard designation
- form: LU/HSW
  reason: AIA continuing-education credit units ('1.0 LU/HSW Hour'), not a product standard
- form: Limited Warranty
  reason: warranty document ('Republic and Steelcraft Limited Warranty') - code D, not a conformity attestation
- form: Authorized Seller Program
  reason: commercial sales program (code Z/B-), not a conformity scheme
- form: 08 17 13
  reason: CSI MasterFormat spec-section number for their own product specification - document organization, not
    a standard designation
- form: CCPA
  reason: privacy-law designation from website legal boilerplate (California Consumer Privacy Act) - about the WEBSITE,
    not product conformity; same for CPRA
- form: DMCA
  reason: copyright-law designation from the terms-of-use page - website legal boilerplate, not product conformity
- form: 'NYSE: ALLE'
  reason: 'stock-exchange listing of the parent (''Allegion (NYSE: ALLE)'') - not a conformity designation'
- form: EHPA
  reason: appears only inside the doc title 'Allegion EHPA Tornado Systems Data Sheet' - document title (D), no
    prose designation
