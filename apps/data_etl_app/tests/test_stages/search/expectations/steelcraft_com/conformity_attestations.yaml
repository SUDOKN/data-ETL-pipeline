eval_set_version: 2
expected_empty: false
notes: 'THE subject''s most important field: a dense standards inventory (50 entries) spanning SDI/ANSI construction
  standards, fire tests (ASTM E152, UL-10B/10C, UL 1784, NFPA 80), the tornado family (ICC 500, FEMA P-320/P-361),
  the WINDSTORM TEST FAMILY the 2026-08-25 run lost - TAS 201/202/203 and ASTM E1886/E1996 are ALL verbatim in the
  text (plus ASTM E330 and ANSI/SDI A250.13 beside them) - paint tests (B117/D4585/D2794/D3359), stainless/coating
  specs (A666/A653), approval regimes (FBC, SFBC, Miami-Dade NOA, TDI, HVHZ), bodies (SDI cert, Intertek, UL), and
  green-building programs (LEED, CALGreen, Clean Air Gold, EPD/HPD/Declare, Living Building Challenge). ACTOR HAZARD:
  FL/Miami-Dade/TDI approvals are filed under ''Allegion-Schlage Lock Company'' / ''Schlage Lock Co.'' - stated
  in-text; still the subject''s product attestations. The privacy/terms pages contribute legal-only designations
  (CCPA, DMCA) seeded as false friends. VERIFICATION PASS 2026-08-26 (verify-agent-steelcraft, second independent
  read of the full 225KB snapshot): all 50 entries confirmed; 0 disputed; 0 quote failures - every evidence quote
  in this file is byte-exact verbatim in the snapshot, NBSPs included. WINDSTORM FIVE VERDICT: all five are genuinely
  in the text and the entries are sound - TAS 201 (2 occurrences), TAS 202 (3), TAS 203 (2), ASTM E1886 (3, twice
  fused as ''ASTM E1886/E1996''), ASTM E1996 (3 occurrences of the E1996 string, only 1 as the standalone ''ASTM
  E1996'' bigram); ASTM E330 (2) and ANSI/SDI A250.13 (1) sit beside them as the seed says. FALSE FRIENDS: agreed
  as written - STC/Sound Transmission Control, LU/HSW, Limited Warranty, Authorized Seller Program, 08 17 13, CCPA,
  DMCA, ''NYSE: ALLE'' and EHPA all check out against the text, and I found no false friend that is actually in-field.
  OVER-BROAD FORMS: bare ''FBC'' and ''TDI'' are credited by containment from their own Excel download titles; bare
  ''EPD''/''HPD'' are 3 chars; bare ''A115'' is 4. OBSERVED GAPS (recorded, NOT added): ''U.S. Green Building Council
  (USGBC)'' and ''California Department of Public Health (CDPH)'' are named bodies of the same kind as the seeded
  Intertek/UL entries and are absent from the entry list.'
