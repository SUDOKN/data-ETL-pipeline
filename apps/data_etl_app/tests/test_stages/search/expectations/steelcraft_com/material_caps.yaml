false_friends:
- form: Lead
  reason: 'bare form: dominant in-corpus senses are ''lead time''/''Lead Time Bulletins'' (support pages) and LEED/Leadership
    word-shapes; the genuine metal sense occurs only inside ''lead-lining''/''lead-lined'', which the entry forms
    cover (the alecmfg substring false positive, reproduced here)'
- form: wood
  reason: comparison and simulated-finish material ('the beauty of wood with the benefits... of steel', 'outperforms
    wood') - never worked by the subject
- form: aluminum
  reason: competitor door material in comparison prose only ('outperforms wood, aluminum, and fiberglass')
- form: vinyl
  reason: comparison only ('compared to traditional vinyl separators')
- form: concrete
  reason: installation wall substrate ('poured concrete'), not a material the subject works
- form: CMU block
  reason: installation wall substrate (frames anchored to it), not a worked material
- form: drywall
  reason: wall type the frames install into ('DW Series Drywall frames' = frames FOR drywall walls)
- form: masonry
  reason: wall/opening type ('masonry frames' = frames for masonry openings), not a worked material
- form: paint
  reason: consumable coating (code C); the finishing OPERATION lives in process_caps
- form: primer
  reason: consumable coating (code C); the priming operation lives in process_caps
- form: glass
  reason: component openings ('glass lights') and supplier-provided glazing; bare 'glass' has no worked-material
    sense here (specific glazing entries live in products/ceramic glass)
- form: Inland Steel
  reason: historical company name ('sold its metal building division to Inland Steel Products Company', 1959) -
    not a material
- form: ash
  reason: wood-stain appearance name ('from ash to walnut') - word association, not a material worked
- form: walnut
  reason: wood-stain appearance name - word association
