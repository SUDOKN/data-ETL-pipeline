subject: steelcraft.com
field: material_caps
snapshot:
  file: apps/data_etl_app/src/data_etl_app/knowledge/sample_scraped_texts/steelcraft.com.txt
  sha256: c10c1a3e4a24ade49fc7af157e8eb1f8975a371e7ae5e3dc081172790e6728b0
eval_set_version: 2
expected_empty: false
notes: 'Materials are construction-spec designations: American steel, stainless (304/316), A60 galvannealed (three
  spellings in-text), galvanized, and the five-way core-material menu (kraft honeycomb, polystyrene, polyurethane,
  mineral board, steel stiffened) plus fiberglass batting, epoxy, ceramic glass, polymer, and the genuine lead-lining
  context. Bare ''steel'' deliberately NOT an entry (trivially contained in dozens of forms - free recall); bare
  ''Lead'' is a false friend (lead-time flood) while lead-lining/lead-lined forms carry the entry. VERIFICATION
  PASS 2026-08-26 (verify-agent-steelcraft, second independent read): all 16 entries confirmed; 0 disputed; 0 quote
  failures (all evidence byte-exact verbatim). Agreed with the two structural calls: keeping bare ''steel'' out
  as an entry, and carrying the metal-lead sense only on lead-lining/lead-lined forms. FALSE FRIENDS: agreed as
  written - wood/aluminum/vinyl are comparison-only, concrete/CMU block/drywall/masonry are install substrates or
  opening types, ash/walnut are stain appearance names, and ''Inland Steel'' is the 1959 history line. ONE FORMS
  GAP recorded on material_caps-0005: the third in-text spelling ''Galvanealled'' is not covered by any acceptable
  form.'
