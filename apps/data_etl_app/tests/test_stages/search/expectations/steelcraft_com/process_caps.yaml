false_friends:
- form: missile impact tests
  reason: 'certification-lab test procedure (code L, actor lab): ''TAS 201: Missile impact tests'' - performed by
    Intertek/test houses, a measured wrong-actor flood class'
- form: salt spray testing
  reason: paint-lab test procedure per ASTM B117-18 (code L) - the other named exemplar of the measured lab-procedure
    flood
- form: cyclic wind pressure tests
  reason: lab test procedure (TAS 203 / ASTM E1886) - code L
- form: uniform static air pressure tests
  reason: lab test procedure (TAS 202 / ASTM E330) - code L
- form: condensation testing
  reason: paint-lab test per ASTM D4585 - code L
- form: film adhesion test
  reason: paint-lab test per ASTM D3359 - code L
- form: impact test
  reason: lab paint test ('Impact test D2794-93R19') and product-claim prose ('high resistance to impact damage')
    - L/S, never an own operation here
- form: positive pressure testing
  reason: fire-lab test regime (UL-10C) - code L
- form: neutral pressure testing
  reason: fire-lab test regime (ASTM E152/UL-10B) - code L
- form: air leakage
  reason: lab test subject (UL 1784 (Air Leakage)) - code L
- form: physical endurance
  reason: lab test category (ANSI/SDI A250.4 (Physical endurance)) - code L
