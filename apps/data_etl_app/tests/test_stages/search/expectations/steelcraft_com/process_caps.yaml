subject: steelcraft.com
field: process_caps
snapshot:
  file: apps/data_etl_app/src/data_etl_app/knowledge/sample_scraped_texts/steelcraft.com.txt
  sha256: c10c1a3e4a24ade49fc7af157e8eb1f8975a371e7ae5e3dc081172790e6728b0
eval_set_version: 2
expected_empty: false
notes: 'Sparse in-passing operations on a catalogue site: welding/reinforcing/priming/embossing plus service-center
  modification menus. The two measured wrong-actor flood classes are seeded as false friends: certification-lab
  test procedures (missile impact, salt spray, cyclic wind, ...) and installation-site work (installation, field
  assembly, grouting, anchoring). NOTE on ''anchor prep'': flagged as a false friend per the measured flood, but
  the Chino/Kansas City *Special anchor preps* occurrences are own service-center work - adjudicate per window on
  promotion. VERIFICATION PASS 2026-08-26 (verify-agent-steelcraft, second independent read): 12 of 13 entries confirmed,
  1 disputed (process_caps-0006 Embossing - reason in that entry''s notes); 0 quote failures (all evidence byte-exact
  verbatim). ANCHOR-PREP ADJUDICATION (the seed''s flagged question, settled here): the false friend ''anchor prep''
  is WRONG AS SCOPED and should be narrowed to the installation-context anchoring surfaces only. Both in-snapshot
  occurrences of ''Special anchor preps'' sit inside a service-center capability menu - the Chino ''Chino Products
  & Services'' list (beside ''Local, custom frame manufacturing and welding'', ''Many door and frame stock modifications
  available'', ''Modifications for lights and louvers'', ''Labeling with Intertek and UL fire ratings'') and the
  Kansas City ''Lenexa Products & Services'' list (beside ''3-sided frame welding'', ''Door modifications for light
  and louvers'', ''Custom crates''). Every one of those neighbours is already a seeded own-work entry (0001/0003/0010/0012/0013),
  so ''Special anchor preps'' is OWN service-center work performed on the frame - code V, actor own - not installer
  field work. The distinguishing surface is reliable in this corpus: ''prep'' only ever occurs in factory/service-center
  senses (''hardware preps'', ''function hole preps on doors'', ''door preps for hardware'', ''factory prepared
  for field-installed silencers''), while the genuine installation flood uses ''anchor(s)''/''anchoring'' (''adjustable
  base anchors allow for installation adjustment'', ''quick anchoring in place'', ''butted to CMU block using wire
  or Masonry-T anchors'', ''Standard Anchor Locations''). RECOMMENDATION (not applied - the verification pass adds
  no entries): narrow the ''anchor prep'' false friend to ''anchoring''/''anchor locations'', and seed ''Special
  anchor preps'' as its own process_caps entry. REST OF THE FALSE FRIENDS: agreed as written - the lab-procedure
  block (missile impact / salt spray / cyclic wind / uniform static air pressure / condensation / film adhesion
  / impact / positive+neutral pressure / air leakage / physical endurance) and the installation block (installation,
  field assembly, grouting, field conversion, anchoring, wall framing) both check out, as do the code-Z business
  activities. OBSERVED GAP (recorded, NOT added): the LS Series page names polishing and etching as finishing operations
  (''custom doors are available in a wide range of polished and etched finishes'', ''#4 Brushed Satin - Polished
  with one directional grain'') and no entry covers them.'
