field: conformity_attestations
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/tanfel.com.txt
  sha256: 4942d992128752abeace6e11e1235e9e55f4737a21b51d3778cb2f818667bf9b
eval_set_version: 2
expected_empty: false
notes: '25 entries — 15 actor=supplier, 6 own, 4 unknown, 7 of them disputed. EXACTLY ONE is presented in Tanfel''s
  own name: the ''ISO 9001:2015 CERTIFICATE'' download on the About page. Every numbered standard other than that
  one appears as a bare list item inside a partner factory''s capability block (investment casting, MIM, stamping)
  or as an unnumbered ''ISO certified facilities'' claim about the offshore network. Note also that ISO 9001 is
  spelled three incompatible ways on one site (:2015 on About, :2008 on stamping, -2008 on MIM), which is itself
  evidence that the registrations belong to different legal entities.'
