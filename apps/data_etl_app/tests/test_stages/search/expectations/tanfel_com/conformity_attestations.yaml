false_friends:
- form: ISO 16949
  reason: 'anticipatory AND historical: this exact string does NOT occur. The file prints ''ISO/TS 16949:2009'',
    ''TS 16949'' and ''TS16949''. The old pipeline credited ''ISO 16949'' here, and separately double-counted it
    as IATF 16949.'
- form: IATF 16949
  reason: 'anticipatory: ''IATF'' occurs once, bare, in ''ISO & IATF certified facilities''; ''16949'' only ever
    follows TS. Joining them is the documented double-count.'
- form: AS9100
  reason: 'anticipatory: the text prints ''AS 9100 Rev. C'' with a space.'
- form: CE
  reason: 'anticipatory: the letters ''CE'' appear only inside words (SURFACE FINISH, PERFORMANCE); no CE mark is
    claimed anywhere.'
- form: ITAR
  reason: 'anticipatory: never occurs, and the aerospace/defense mentions are textbook prose and a form dropdown.'
- form: NADCAP
  reason: 'anticipatory: never occurs.'
- form: RoHS
  reason: 'anticipatory: never occurs, despite the electronics/plastics pages.'
- form: Fortune 500
  reason: 'witnessed: ''project relationships with Fortune 500 companies'' is a customer credential, not an attestation
    the company holds.'
