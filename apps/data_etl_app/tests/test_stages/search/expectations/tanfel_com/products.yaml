notes: 71 entries (51 own, 18 unknown, 2 client, 1 disputed); this file doubles as the contract_products inventory.
  Two clear own-brand groups (the four Tanfel-branded thread plug gage SKUs plus the gage line itself, and the silicone/membrane-switch
  component catalog) sit next to a long tail of artifacts named only as textbook examples (train wheels, lamp posts,
  beverage-can lids, O-ring seals) or as customer products in testimonials (sporting goods, energy efficient dog
  doors). The textbook tail is labelled actor=unknown and the testimonial items actor=client.
