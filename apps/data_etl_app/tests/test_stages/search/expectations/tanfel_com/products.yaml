- form: Tanfel
  reason: 'witnessed everywhere: the company''s own name, not a product. The gage SKUs legitimately begin with it,
    so only a BARE ''Tanfel'' is the trap.'
- form: ROJO SPORT, INC.
  reason: 'witnessed: a customer''s company name in a testimonial byline.'
- form: ENDURA FLAP PET DOORS
  reason: 'witnessed: a customer''s company name. The product named in that testimonial is ''energy efficient dog
    doors'', which IS an entry.'
- form: AutoCAD
  reason: 'witnessed: CAD software from the ''COMMONLY USED SOFTWARE'' list — not a made artifact. Same for Solid
    Works, Unigraphics NX, CATIA, Pro Engineer, ProNest, Autodesk.'
- form: METAL OVERVIEW PRODUCT SHEET
  reason: 'witnessed: a downloadable document. Same for ''SILICONE PRODUCT SHEET'', ''COMPANY PROFILE PRESENTATION'',
    ''MEMBRANE SWITCHES & OVERLAY PRODUCT SHEET'' and ''DOWNLOAD INDUSTRY SHEETS''.'
- form: plant machinery and tools
  reason: 'witnessed: machinery is excluded from this field by the products clause.'
- form: Design Parameters
  reason: 'witnessed: a capability page title (a comparison table), not an item.'
