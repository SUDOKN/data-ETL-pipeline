subject: tanfel.com
field: equipments
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/tanfel.com.txt
  sha256: 4942d992128752abeace6e11e1235e9e55f4737a21b51d3778cb2f818667bf9b
eval_set_version: 2
expected_empty: false
notes: '23 entries (14 own, 9 unknown, 1 disputed) and ZERO equipment brands. The brand absence is confirmed by
  a sweep of 60+ machine-tool makers with no hits, so any branded machine a run returns here is fabricated. What
  the text DOES name splits three ways: an owned-fleet claim (six CNC lathe/turning-centre types, 3/4/5-axis machining
  centres, turret punch, 7-axis press brake, tonnage presses, trim press); a generic-definition mention (hot/cold
  chamber machine, forging hammer); and an aluminum-extrusion textbook walkthrough (aging ovens, stretcher, extrusion
  puller, saws) carrying actor=unknown. Metrology instruments — of which this site has many, including the products
  it sells — are excluded by the field''s own clause and are seeded as false friends instead.'
