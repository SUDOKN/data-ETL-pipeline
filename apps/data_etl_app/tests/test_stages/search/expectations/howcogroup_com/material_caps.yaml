- id: howcogroup_com-material_caps-0034
  name: aluminium oxide blast media
  status: disputed
  acceptable_forms:
  - aluminium 60-80
  - Shot blasting (aluminium 60-80)
  evidence:
  - quote: Shot blasting (aluminium 60-80)
    approx_offset: 40045
  notes: 'DISPUTED: ''aluminium 60-80'' is a grit size for blast media. It is a consumable the process is performed
    WITH, not a substance the work is made from or performed in, so it arguably falls outside the material_caps
    clause. Kept on the record because a reader could reasonably call blast media a material | ''aluminium 60-80''
    is a blast-media grit spec: an abrasive consumable that acts on the work, not a substance the work is made from
    or performed in, and nothing in the text says ''oxide''. Mechanically it also cannot ever miss independently:
    any returned ''aluminium'' (material_caps-0049) is contained in this form and credits it.'
  provenance:
  - action: added
    by: seed-agent-howcogroup-com
    date: '2026-08-27'
    source: corpus-seed
  - action: disputed
    by: verify-agent-howcogroup
    date: '2026-08-27'
    reason: '''aluminium 60-80'' is a blast-media grit spec: an abrasive consumable that acts on the work, not a
      substance the work is made from or performed in, and nothing in the text says ''oxide''. Mechanically it also
      cannot ever miss independently: any returned ''aluminium'' (material_caps-0049) is contained in this form
      and credits it.'
