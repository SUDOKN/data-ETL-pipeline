    reason: 'SUBSTRING ARTEFACT: forms_overlap is bare case-insensitive containment for forms over 3 chars, so the
      form ''destructive testing'' is contained in ''non-destructive testing'' and in ''NONDESTRUCTIVE TESTING''
      (the accreditations page). Every return of NDT would silently credit this entry. ''both destructive testing''
      is verbatim in the evidence quote, still credits a plain returned ''destructive testing'' by containment,
      and no longer credits ''non-destructive testing''.'
