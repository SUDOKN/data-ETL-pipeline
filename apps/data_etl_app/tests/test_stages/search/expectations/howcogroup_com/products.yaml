false_friends:
- form: SLM280
  reason: the old pipeline emitted this as a PRODUCT. It is the model name of a metal 3D PRINTER at Howco AM Houston
    (291-294); it is seeded under equipments and belongs nowhere else
- form: Brochure
  reason: the news page lists seven downloadable brochures (2132-2139, e.g. 'Brochure – Capabilities 1.0.3'); the
    products clause explicitly excludes documents
- form: Made in Sheffield
  reason: an accreditation mark, not a made artifact; the products clause excludes awards and memberships. Seeded
    under conformity_attestations
- form: Cock o’ the North
  reason: the name of a 1934 LNER locomotive recounted as history (7441); Howco made no part of it - its order was
    for the separate new-build 'Prince of Wales'
- form: Cheshire Seals and Components
  reason: a COMPANY Howco acquired in September 2024, not a product. The products clause excludes 'the names of
    companies, brands, or customer groups'
- form: Solar Photovoltaic Energy System
  reason: a £750,000 roof installation Howco BOUGHT for its Sheffield and Cumbernauld sites (6714); it is a facility,
    not something that comes out of the work
- form: Nova-C
  reason: the Intuitive Machines lunar lander Howco supplied components INTO; the lander is the customer's product,
    and the name is a customer brand
- form: Take 5, Zero Harm
  reason: a Bredbury health-and-safety initiative (6867, 6871), not an artifact
- form: PCB Assembly
  reason: ZERO occurrences of 'PCB' anywhere in 7,573 lines. The old pipeline fabricated this from 'Electromechanical
    Assembly' (4525). Only fabrication can produce it
- form: Storage containers
  reason: '''storage containers need to be made from steel'' (2067) describes what LNG SHIPPERS need, in a paragraph
    of general LNG background; Howco is not said to make them'
