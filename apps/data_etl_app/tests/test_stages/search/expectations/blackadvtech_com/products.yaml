notes: 'Doubles as the contract_products inventory. TWO distinct product populations. (a) An OWN-BRAND CATALOGUE:
  seven named standard military & marine furniture items on /industries-served/military/, the strongest own-product
  evidence in this subject. (b) CONTRACT PARTS made to customer print - transportation/rail components, scientific
  laboratory furniture, industrial enclosures - which stay entries under recall-first with actor: client where the
  text attributes them. A third population is blog-explainer artifacts (soda cans, kitchen sinks, school lockers,
  racing-car chassis) that Blackstone never claims to make; those carry actor: unknown.'
