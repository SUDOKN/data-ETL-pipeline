field: process_caps
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/blackadvtech.com.txt
  sha256: cf1b9015df24bc7839f887e729c3408b761b970f78773e999c724227129fb9fb
eval_set_version: 2
expected_empty: false
notes: 'The densest field on this subject and the one carrying the SEO-blog trap. Entries split two ways. (a) CAPABILITY-PAGE
  processes: named on /capabilities/*, /about-us/facility/, /capabilities/machinery/ or the home page as things
  Blackstone does - actor omitted (own). (b) BLOG-ONLY processes: named ONLY inside industry-explainer articles,
  never as a first-party capability claim - actor: unknown, and every one says so in notes. Both are entries: the
  search stage extracts in-field designations the text NAMES, and deciding whose capability it is happens downstream.
  Do NOT read a blog-only entry as a defect when search returns it.'
