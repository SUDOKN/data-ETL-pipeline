expected_empty: false
notes: 'One real registered certification (ISO 9001:2015) with a CONTRADICTORY registrar between pages, a woman-owned
  business certification, four AWS welder/inspector credentials and an ASQC-CQE. The business-registry identifiers
  (CAGE Code, NAICS Codes) and the personnel credentials are seeded but flagged in notes as the arguable ones the
  brief says to record rather than drop. Four standards bodies (SAE, AISI, UNS, ABYC) appear only inside blog prose
  and carry actor: unknown.'
