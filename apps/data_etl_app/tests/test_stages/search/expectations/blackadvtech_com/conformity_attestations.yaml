    approx_offset: 1730
  notes: a named management system rather than a numbered standard; arguable under the 'identity of its own' test
    but it is always stated as the thing backing the ISO registration | a quality management system is the thing
    ISO 9001 certifies, not itself a certification, accreditation, registration or standard with an identity of
    its own - the text never names it by a number, mark or issuing body ('we have a comprehensive Quality Management
    System'). ISO 9001:2015 at 0001 is the attestation. Membership arguable.
