expected_empty: false
notes: 'Sheet metal, steel, stainless and aluminum are the shop''s declared working materials, with hard thickness
  limits on the laser page. Everything beyond those four comes from the blogs: the metals-numbering, sheet-vs-plate
  and thickness articles list a dozen metals as generic metallurgy, and the marine-fuel-tank article gives real
  5xxx aluminum grade designations. Per the field clause, treatments named after the substance they deposit (iron
  phosphate, zinc coating) are material entries too. Blog-sourced materials carry actor: unknown.'
