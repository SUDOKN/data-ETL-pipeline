subject: superiortech.org
field: process_caps
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/superiortech.org.txt
  sha256: 96bf25a3e1f14d03fd06d8743ed8a1cbe3ed3d72169d96fbe2c81300bf03951f
eval_set_version: 2
expected_empty: false
notes: 'The densest field on this subject, and the one that carries its STRATIFIED DEPTH. Tier 1 — five capabilities
  with a dedicated page AND named machines in the census: CNC turning, CNC milling, large-part CNC turning/milling,
  grinding-lapping-honing, electro-mechanical assembly & test. Tier 2 — a value-added secondary list where the sub-processes
  are explicitly OUTSOURCED to ''trusted vendors'' and no machine exists behind them (heat treatment and its 7 sub-processes,
  plating/paint/surface treatment and its 9, and the 5 destructive/chemical tests). Tier 2 entries carry actor:
  supplier. Both tiers are entries — the search stage is recall-first and the text names the operation either way.
  Note also that inspection, testing and measurement QUALIFY under this field''s clause, which is where every metrology
  device excluded from `equipments` lands.'
