      fastener industries'' distributes ''industries'' over all three heads. But the only acceptable form was the
      whole five-word comma list, which no single returned phrase can ever equal or contain, so the entry could
      never credit: a silent hole in the denominator. ''auto industries'' credits a returned ''auto'', ''auto industry''
