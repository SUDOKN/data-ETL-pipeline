- id: superiortech_org-industries-0001
  name: OEM
  status: disputed
  acceptable_forms:
  - OEM’s
  - OEM
  evidence:
  - quote: Fortune 500 companies, OEM’s, small independent companies, and startups
    approx_offset: 721
  - quote: allows the OEM the confidence of a known fixed cost
    approx_offset: 15493
  notes: 'DISPUTED — ''OEM'' names a CUSTOMER TYPE (original equipment manufacturer), not a domain of economic activity.
    The prompt''s clause wants ''a recognizable domain of economic activity that a manufacturer''s goods or services
    can serve'', which an OEM is not — it is a rung in a supply chain that exists across every domain already listed.
    Recorded rather than dropped because it is the single most likely industries over-generation on this text (4
    occurrences, always beside the real industry lists) and the boundary is arguable. | OEM is a customer category,
    not a domain of economic activity: it appears only inside ''Fortune 500 companies, OEM''s, small independent
    companies, and startups'' and ''allows the OEM the confidence of a known fixed cost'' -- both lists of company
    TYPES, alongside ''startups'' and ''Fortune 500'', which nobody would seed as industries. The field''s clause
    asks for a recognizable domain of economic activity; original-equipment-manufacturer names who buys, not what
    sector.'
  provenance:
  - action: added
    by: seed-agent-superiortech-org
    date: '2026-08-27'
    source: corpus-seed
  - action: disputed
    by: verify-agent-superiortech
    date: '2026-08-27'
    reason: 'OEM is a customer category, not a domain of economic activity: it appears only inside ''Fortune 500
      companies, OEM''s, small independent companies, and startups'' and ''allows the OEM the confidence of a known
      fixed cost'' -- both lists of company TYPES, alongside ''startups'' and ''Fortune 500'', which nobody would
      seed as industries. The field''s clause asks for a recognizable domain of economic activity; original-equipment-manufacturer
      names who buys, not what sector.'
