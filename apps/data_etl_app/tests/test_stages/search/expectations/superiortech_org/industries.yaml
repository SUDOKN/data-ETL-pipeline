      by containment, so it would falsely credit on ''Automotive'' and ''Automation'', both certain to be returned
      for this subject.'
false_friends:
- form: Fortune 500
  reason: a customer-size tier, not an industry; occurs twice ('Fortune 500 companies', 'Fortune 500') always adjacent
    to the real industry list on lines 18 and 44
- form: startups
  reason: a customer maturity class, not a sector; sits inside the same line-18 customer clause that the industry
    list follows
- form: PET
  reason: ZERO word-boundary occurrences. All 9 hits are the substring inside 'competitive'. Confirmed live on this
    file; only a substring matcher or a fabrication can return it
- form: ITAR
  reason: 'ZERO word-boundary occurrences. All 9 hits are the substring inside ''Military''. Doubly baited: the
    text really does name Military, Defense and Aerospace, so a model has every reason to mint the regime that usually
    accompanies them'
- form: Semiconductor
  reason: 'anticipatory: zero occurrences, but ''Electronics'', ''Optics and Precision Instruments'' and ''Clean
    Room'' are all present and habitually co-occur with it'
- form: Nuclear
  reason: 'anticipatory: zero occurrences; primed by ''Power Generation'' and ''Oil & Gas'''
- form: Energy
  reason: 'anticipatory: zero occurrences; primed by ''Power Generation'' and ''Oil & Gas'''
- form: Marine
  reason: 'anticipatory: zero occurrences; a standing companion of the Defense/Transportation pairing that is present'
- form: Pharmaceutical
  reason: 'anticipatory: zero occurrences; primed by the real ''Medical'' and by ''clean room'''
- form: Food and Beverage
  reason: 'anticipatory: zero occurrences; a stock machine-shop industry-list filler'
- form: Agriculture
  reason: 'anticipatory: zero occurrences; primed by ''Construction Equipment'' and ''On and Off-Road Axle Housings'''
