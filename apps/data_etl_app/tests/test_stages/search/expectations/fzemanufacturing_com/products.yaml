notes: 'Doubles as the contract_products inventory. FZE is a contract machine shop, so almost nothing here is an
  own-brand good: entries are customer parts it machines (actor: client) and artifacts named inside third-person
  explainer prose (actor: unknown). The densest genuine sources are the hydraulic components list, the part-assembly
  page''s ''mechanical parts assembly services'' list, the Assembled Products spec table and the shaft-machining
  industry sections. The agriculture page''s harvester/planter/tractor parts and the electropolishing blog''s blades/fasteners/springs/wire
  racks are explainer artifacts, not claimed work.'
