false_friends:
- form: Equipment List
  reason: '''DOWNLOAD OUR EQUIPMENT LIST'' / ''View Our Equipment List'' - a document on the equipment page, not
    an artifact that comes out of manufacturing work'
- form: Made In Wisconsin
  reason: a program and logo the company is registered with - an award/membership, which the product prompt excludes
    by name
- form: Blanket Orders
  reason: a commercial ordering arrangement in the Production Volume table, not a made thing
- form: Box Build Assembly
  reason: the NAME OF A SERVICE in the Assembly Services table ('Box-Build Assembly refers to the complete assembly
    of a customer's finished product'), not an artifact
- form: AutoCAD
  reason: a CAD file format in the File Formats table; software, not a made artifact
- form: Captcha
  reason: a contact-form field label repeated on ~20 pages
- form: Photo Gallery
  reason: an empty site page whose only content is its own title
- form: Kanban
  reason: an inventory-signalling system named in the equipment roster's Finished Goods Inventory line, not a product
- form: Ballizer
  reason: occurs only as the video title 'FZE “Ballizer”'; the site never says what it is, and in context it reads
    as a process/machine demo rather than a catalogued product
