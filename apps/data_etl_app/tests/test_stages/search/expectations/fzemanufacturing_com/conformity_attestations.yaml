false_friends:
- form: Machinist
  reason: a job posting title on the careers page, not a certification or licence
- form: Machine Operators
  reason: a job posting title on the careers page, not a certification
- form: Blanket Orders
  reason: a commercial ordering arrangement in the Production Volume table, not a standard
- form: SolidWorks
  reason: 'a CAD file format the shop accepts (File Formats table: AutoCAD, DXF, IGES, STEP, SolidWorks) - a format,
    not a standard the company holds'
- form: IGES
  reason: a CAD interchange format in the File Formats table; formats are not attestations
- form: STEP
  reason: a CAD interchange format in the File Formats table; formats are not attestations
- form: AS9100
  reason: 'anticipatory: the obvious aerospace companion to ISO 9001 that a model may mint from ''Aerospace'' +
    ''ISO 9001:2015''; it does not occur anywhere in the text'
- form: ITAR
  reason: 'anticipatory: word-association from ''Firearms'' + ''Military/Defense'' + ''Mil-Spec''; does not occur'
- form: NADCAP
  reason: 'anticipatory: word-association from aerospace + special processes (heat treating, passivation); does
    not occur'
- form: ISO 13485
  reason: 'anticipatory: word-association from the medical/dental/pharmaceutical industry lists; does not occur'
