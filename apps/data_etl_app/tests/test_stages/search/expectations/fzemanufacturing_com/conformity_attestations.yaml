subject: fzemanufacturing.com
field: conformity_attestations
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/fzemanufacturing.com.txt
  sha256: ff11844d0540b8e65c7c4c7f8f7614c3e36c192b093940bb99b8140eb5aace1e
eval_set_version: 2
expected_empty: false
notes: One real certification (ISO 9001:2015, named 16 times) plus a cluster of methodologies and programs that
  sit in the same sentences and read like certifications - Six Sigma Black Belt, Lean, Kaizen/5S, Lights Out. Six
  Sigma Black Belt is seeded as an entry (a certification people hold, and the text calls it one); Lean/Kaizen/Lights
  Out are seeded DISPUTED because they are practices with no issuing body or identity of their own. The Made In
  Wisconsin(R) registration and the Thomas Verified supplier mark are the two non-quality registrations.
