subject: fzemanufacturing.com
field: equipments
snapshot:
  file: apps/data_etl_app/tests/test_stages/sample_scraped_texts/fzemanufacturing.com.txt
  sha256: ff11844d0540b8e65c7c4c7f8f7614c3e36c192b093940bb99b8140eb5aace1e
eval_set_version: 2
expected_empty: false
notes: 'The strongest owned-machine roster in the corpus: two listings on /equipment/ naming ~35 machines by make
  and model. SEEDED TO THE PROMPT''S BOUNDARY, not to the everyday sense of ''equipment'': the Sheffield Discovery
  CMMs, Keyence IM7030T, J&L Optical Comparator, granite tables and hand gages that sit in the SAME roster under
  ''Inspection Equipment'' are metrology and are EXCLUDED here (they are recorded as process_caps inspection operations,
  and as false_friends for this field). Rotary tables, tombstones, pallets, vices, chucks, collets, live tooling,
  drill bits and inserts are tooling and are excluded. Bar feeders and the part-tending cobots/gantry robot are
  recorded as DISPUTED - they move material rather than act on the work.'
