    approx_offset: 109826
  notes: 'DISPUTED: a collaborative robot TENDING a lathe (the video title says ''Doosan M1013 Cobot tending Doosan
    Puma2600SY'') - it loads and unloads parts, which this prompt excludes as moving what the plant makes. Kept
    as a boundary question. | the cobot is a part-handling robot, not a machine that acts on the work: the video
    list says ''Doosan M1013 Cobot tending Doosan Puma2600SY'', and the site elsewhere calls this ''robotic part
    loading and unloading''. Tending = load/unload = the clause''s ''moves, stores, or carries'' exclusion. (Contrast
    the Miller Welding Cobot, which welds and does act on the work)'
