  - bar feeder
  - Bar Feeder
  - bar feed equipment
  evidence:
  - quote: 4’ Magazine Bar Feeder
    approx_offset: 109625
  notes: 'DISPUTED: a bar feeder LOADS raw stock into the lathe; under this prompt''s exclusion of equipment that
    ''moves, stores, or carries'', it reads as material handling rather than a machine acting on the work. Kept
    on the record because it is an integral, named part of nine machine listings and a reasonable reader would call
    it production equipment. | a bar feeder does not process, shape, assemble or convert - it presents bar stock
    to the lathe. That is the clause''s ''moves, stores, or carries'' side of the line, even though it is an integrated
    subsystem of a production machine rather than a standalone conveyor'
  provenance:
