role_provenance: 'search/expectations/blackadvtech_com/subject.yaml assigns role: genre_probe, which is
  NOT one of this schema''s five values, so it could not be reused verbatim. Mapped to degenerate_input_probe
  on measured evidence: 3 live DB-error page blocks, 2 404s scraped as content, 2 lorem-ipsum slots, a
  raw Divi shortcode dump, a raw HubSpot <script> blob, 10 unrendered CTA shortcodes, 13 pages scraped
  twice, and 339 NBSP-only lines. NOT scale_stress: at 246 KB it is the largest of this batch but far
  below acimachine. The genre_probe sense the search harness meant (SEO blog naming processes the shop
  does not perform) is a search-admission question and is out of scope for this stage.'
