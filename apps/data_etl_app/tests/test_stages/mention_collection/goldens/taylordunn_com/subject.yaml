    residents of the European Economic Area, the United Kingdom and Switzerland.
  occurrences: 31
  approx_offset: 201
- hazard: duplicate_page
  note: '31 page blocks, ONE distinct body. Every non-URL line in the file therefore occurs 31 times exactly.
    For an occurrence label this means the true count is always a multiple of 31, and 31 is the floor
    rather than evidence of emphasis. It also means the occurrence half of this stage can be graded here
    with total confidence while the snippet half discriminates nothing: 30 of every 31 clips are byte-identical
    to the first.'
  quote: https://www.taylor-dunn.com/supplier-code-of-conduct/
  occurrences: 1
  approx_offset: 220316
- hazard: repeated_footer
  note: 'the footer menu is 38 non-blank lines repeated 31 times and is the ONLY in-domain text in the
    file: 9.0% of the characters on non-blank lines, against 88.9% for the cookie policy. Every product-shaped
    and industry-shaped form on this subject resolves here and ONLY here, to a bare menu label with no
    sentence, no verb and no claim around it.'
  quote: Bigfoot Burden Carriers
  occurrences: 31
  approx_offset: 6749
- hazard: repeated_nav
  note: the 9-line top nav is 110 characters per block, 31 times. Note the TRAILING SPACE on four of its
