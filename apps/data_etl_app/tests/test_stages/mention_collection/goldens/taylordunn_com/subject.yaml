    spells 'SALES & SERVICES' where the nav says 'SALES & SUPPORT'. A form matched in the nav and the
    same form matched in the footer are not the same span even when they look identical.
  quote: 'SALES & SUPPORT '
  occurrences: 31
  approx_offset: 132
- hazard: heading_only_line
  note: 'the footer menu''s five section headings sit alone on their own ALL-CAPS lines (VEHICLES, INDUSTRIES,
    SALES & SERVICES, ABOUT, RESOURCES) and are the only thing that says what the bare labels beneath
    them are. A snippet clipped to the line cannot carry that heading, so ''Aviation'' and ''Federal Government''
    arrive with no marker that they are served-industry menu entries. The numbered cookie-policy headings
    (''1. Introduction'' through ''10. Contact details'') have the same shape. The quoted string occurs
    62 times: 31 as the bare footer heading and 31 more inside the nav line ''INDUSTRIES '' with its trailing
