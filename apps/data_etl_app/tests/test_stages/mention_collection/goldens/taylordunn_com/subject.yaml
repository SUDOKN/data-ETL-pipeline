notes: 'The corpus''s degenerate input, and its value to THIS stage is narrow and real. The occurrence
  half is trivially gradeable and perfectly determined: one distinct body repeated 31 times means every
  true count is a multiple of 31, so any count that is not is a defect the eval can name without a judgment
  call. The snippet half is untestable here -- 30 of every 31 clips are byte-identical. The location half
  is where the subject earns its place: 88.9% of the text is third-party generated legal prose written
  in the site''s own first person, exactly the shape that makes whose_words fail, and the file offers
  a parent-company block and a 13-brand vendor table as the two other speakers. Everything a manufacturing
  ontology would want from Taylor-Dunn -- vehicles, industries served, plant, standards -- exists only
  as bare footer menu labels totalling 529 characters per block, 9.0% of the file. NOTE for anyone reading
  the grounding and synthesis expectations alongside this: those say 30 crawled URLs, this file has 31
  page blocks and 28 distinct URL paths after slash-normalisation; the discrepancy is the three paths
  that appear both with and without a trailing slash.'
