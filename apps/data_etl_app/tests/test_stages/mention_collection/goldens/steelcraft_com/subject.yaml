- hazard: landing_page_duplication
  note: seven landing pages duplicate their child pages nearly verbatim (products~steel-doors, resources~resources/Literature,
    why-steelcraft~about-steelcraft, locations~steelcraft-main-plant, applications~fire-rated, finish-options~graintech,
    support~support/contact). Occurrence counts are inflated by duplication, not by new information; two occurrences
    that look like independent evidence are one sentence scraped twice.
  quote: Steelcraft fire-rated doors and frames play a critical role in keeping people safe and minimizing property
    damage. Doors play a very important role in the fire resistance of a building; they allow people to evacuate
    safely from a building along with limiting the spread of fire and smoke to other areas. Fire doors must meet
    the requirements of the International Building Code and International Fire Code, as well as NFPA 80 Standard
    for Fire Doors and Other Opening Protectives. Fire ratings range from 20 minutes to 3 hours. Hollow metal is
    the only door material widely available with a 3 hour label.
