text_hazards:
- hazard: heading_names_third_party
  note: 'THE canonical location case for this whole project, and the hardest and most consequential one. Line 146
    of the sustainability page is a standalone heading that names the PARENT, not the subject; every line under
    it is Allegion''s, and the sentence directly beneath sends the reader off-domain. The heading itself ends in
    a NON-BREAKING SPACE, not an ASCII space, so a byte-exact echo of it typed with a trailing plain space does
    not match. Unique in the file (1 occurrence, approx_offset 5193). A location that reports whose_words: site
    here is an S4 major fail; the grounding and synthesis judges are already instructed that "a heading like ''More
    from Allegion'' is provenance".'
  quote: More from Allegion 
  context_quote: 'To support the Living Building Challenge, Allegion provides Declare labels for products. 



    For the most updated information and documentation related to Declare Labels, see The Living Building Challenge
    page on us.allegion.com.


    More from Allegion 


    Find industry affiliations, resources and more in the Sustainability section of us.allegion.com. 


    General Sustainability Information

    LEED Credits CalGreen Building Standards'
  approx_offset: 5193
- hazard: repeated_support_blurb
  note: 'the "GET THE SUPPORT OF STEEL" block closes all 54 rendered pages. Its sentence occurs 54 times, byte-identical
    - one snippet, 54 occurrences, one location to describe. It is a footer service blurb, NOT product prose, so
    anything it is credited to inherits customer-care copy as capability evidence. NOTE FOR THE HARNESS: this is
    the exact sentence GOLDEN_LABELS_SCHEMA.md uses as its worked example evidence quote for `doors and frames`
    with occurrences: 14. Measured against this snapshot, `doors and frames` occurs 115 times and this quote occurs
    54 of them; the illustrative number in the schema is not the real one.'
  quote: Our steel doors and frames set the industry standard. We strive to do the same with our service and support.
    Steelcraft is committed to delivering best-in-class customer care – making everything from sales to ordering
    to delivery to installation as smooth and easy as possible. 
- hazard: repeated_nav
  note: 'the eight-item nav strip opens all 54 rendered pages, each label on its own line with a tab-only continuation
    line between entries. Per-label counts in this snapshot: Resources 58, Literature 54, Contact 54, 360Portal
    54, 360 Portal Login 54, Products 54, Why Steel 54, Locations 54, Support 54. Every one is a bare nav label
    with no sentence context at all.'
  quote: "Literature\n\t\nContact\n\t\n360Portal \n360 Portal Login\nProducts "
- hazard: cookie_banner
  note: a single ~460-character cookie-consent paragraph, 6 occurrences, ending with the link label fused onto the
    last sentence ("...third-party partners.Steelcraft Cookie Policy"). Pure chrome; no capability content.
  quote: This website uses cookies and similar technologies to help us provide you with a good experience when you
    browse our site, to improve our site, and to better engage with you as you interact with the site. We also share
    information about your use of our site with our social media, advertising, and analytics partners. By clicking
    ACCEPT you are agreeing to the placement of cookies and similar technologies on your computer by us and our
    third-party partners.Steelcraft Cookie Policy
- hazard: prop65_block
  note: the California PROP65 warning repeats on 25 product pages as three consecutive bare lines. A regulatory
    notice, not the site describing a product.
  quote: 'In accordance with California PROP65 -


    WARNING: Cancer & Reproductive Harm

    www.P65Warnings.ca.gov'
- hazard: nbsp_splits_form
  note: 'MEASURED THIS PASS: 843 NO-BREAK SPACE (U+00A0) characters, on 532 distinct lines, of which 127 sit BETWEEN
    TWO WORD CHARACTERS and therefore split a form. Counted with python: t.count(chr(0xA0)) for the total, one line
    per line containing it, and re.finditer(r"(?<=[A-Za-z0-9])\xa0(?=[A-Za-z0-9])", t) for the form-splitting kind.
    The concrete cost: the designation ANSI A250.10-2011 is written 14 times with an ASCII space and 6 times with
    an NBSP between ANSI and A250 - 20 occurrences, of which a byte-exact matcher on the ASCII spelling finds only
    14 (a 30% undercount). Same split on ASTM D4585-D4585M-18 and on the boundaries of SDI Certified (8 NBSP copies,
    8 ASCII copies of the same sentence). This is the trap most likely to make this instrument report a false occurrence
    failure, so occurrence labels here must be computed with a space-elastic matcher and the label must say so.'
  quote: Factory-applied baked-on rust inhibiting primer meets ANSI A250.10-2011
- hazard: features_list_no_subject
  note: '"FEATURES AND BENEFITS" heads 23 stacks of bare bullet lines. The bullets are subject-less fragments repeated
    verbatim across five or more door-series pages, so an occurrence clipped to its own line cannot be attributed
    to a series - the series name is only in the page heading tens of lines above. This is the S1 (extent) and S3
    (belongs-to) case for this subject.'
  quote: Standard 14 gauge inverted top and bottom channels provide excellent door stability, and is able to be
    dressed with top and bottom caps
- hazard: document_title_listing
  note: the Literature page is a bare stack of document titles under one-word category headings (Doors / Frames
    / Solutions / Service Centers / Programs), including a SIBLING BRAND's document (Falcon SZ Series) and the PARENT's
    (Allegion EHPA Tornado Systems Data Sheet), then a run-together row of external link labels. Every line here
    is a document_title, not prose, and two of them are third_party_named. "Steelcraft Technical Data Manual" occurs
    46 times across the site the same way.
  quote: 'Steelcraft Portfolio

    Steelcraft Catalog

