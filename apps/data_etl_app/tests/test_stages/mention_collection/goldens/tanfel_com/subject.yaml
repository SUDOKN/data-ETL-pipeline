text_hazards:
- hazard: first_person_for_someone_elses_shop
  note: 'THE hazard on this subject and the reason it is in the corpus. Tanfel owns no plant, and the
    quoted sentence -- occurring twice, on the two URLs of the CNC machining page -- says ''Our facility
    maintains a fleet''. There is no hedge, no partner attribution and no brand name anywhere near it.
    A location label reading grammar alone gets whose_words: site right and the actor completely wrong,
    and NOTHING in the sentence, the line or the paragraph disconfirms it. The disconfirming evidence
    is 2,000 lines away in a customer testimonial.'
  quote: Our facility maintains a fleet of 3-axis, 4-axis, and 5-axis machines
  approx_offset: 80097
- hazard: bare_list_lines
  note: the owned-fleet claim is followed immediately by six machine types, one per line, each indented
    with THREE NBSP-plus-space pairs and nothing else -- no verb, no subject, no sentence. A clip on any
    of them returns the bare machine name preceded by invisible whitespace, and the only thing asserting
    that Tanfel uses them is the 'We use the following types of CNC lathes' line above. This is the single
    place in the file where equipment forms are genuinely non-empty, so getting it wrong manufactures
    a false empty-field verdict.
  quote:       Swiss style
  approx_offset: 81453
- hazard: form_dropdown
  note: the RFQ and Contact forms print their entire Industry dropdown -- 19 options -- as plain text,
    and they do it THREE times. This is where Aerospace, Energy / Utility, Government / Military, Maquiladora,
    Wireless and Oil / Gas come from; none is a statement that Tanfel serves that market. Worse, the label
    'Industry *' occurs exactly ONCE in the file while '-Select-' occurs four times, so on two of the
    three copies the 19 industry names are bare lines with no label above them at all. The separate 'Product
    Interest' dropdown adds 16 more options, printed once, and is where PCB comes from -- 'PCB' occurs
    exactly once in the whole file, as a dropdown option.
  quote: Maquiladora
  measured:
    industry_options: 19
    industry_dropdown_printed: 3
    product_interest_options: 16
    product_interest_printed: 1
    label_Industry_star_occurrences: 1
    PCB_occurrences: 1
  approx_offset: 60943
- hazard: supplier_attestations_on_one_line
  note: 'FOUR standards on ONE line, inside a metal-injection-molding supplier''s specification block
    (tool steels, weight limits, wall thickness, tolerances), and the line occurs exactly ONCE. Every
    one of those four attestations therefore shares a single snippet that is a bare comma list in a supplier
    spec sheet -- no sentence, no holder named, no verb. Contrast the site''s OWN certificate, which appears
    three times as a document title, ''ISO 9001:2015 CERTIFICATE''. The count asymmetry is inverted from
    what matters: the four certificates Tanfel does not hold occur once, the one it does holds occurs
    three times.'
  quote: ISO 9001-2008, ISO/TS 16949:2009, ISO/13485:2003, AS 9100 Rev. C
  approx_offset: 28763
- hazard: network_scoped_attestation
  note: 'twice the site states plainly that the certifications belong to the NETWORK, not to itself. This
    is the rare in-text sentence that resolves the attribution question, and it is the correct `belongs_to`
    for most conformity mentions on this subject. A sibling sentence, ''With our worldwide network of
    quality ISO & TS certified facilities'' (3 occurrences), says the same thing. Note that ''IATF'' appears
    here as a BARE token and never as a standard number: ''IATF 16949'' and ''ISO 16949'' both have ZERO
    occurrences in this file, while ''ISO/TS 16949:2009'' has one, ''TS 16949'' two and ''TS16949'' one.'
  quote: Our global network of quality ISO & IATF certified facilities can support your prototype to large
    production requirements.
  approx_offset: 92204
- hazard: testimonial_block
  note: four customer testimonials, and the block is printed TWICE within the same page and on three pages,
    so each testimonial has 6 occurrences. The speakers are named on the FOLLOWING line, in ALL CAPS with
    a leading hyphen -- the attribution is never inside the quoted sentence, so a sentence-level clip
    loses the speaker entirely. The dog-door testimonial is the one the expansion doc flags, and the industry
    it implies (pet products) is imported into Tanfel's profile from a customer's product line.
  quote: There are a variety of manufacturing challenges with our line of energy efficient dog doors,
    but great suppliers like Tanfel makes our job much easier.
  approx_offset: 7075
- hazard: textbook_prose
  note: 'the materials list is a run of DICTIONARY DEFINITIONS, one per line, with no Tanfel subject and
    no capability claim -- ''Aluminum is a lightweight, non-magnetic metal...''. Ten materials in ten
    consecutive lines, each clipping to a definition that asserts nothing about who processes it. Three
    whole pages are the same genre at length: the aluminium-extrusion walkthrough, the metal-casting explainer
    and the metrology explainer. Machines and processes named in those pages belong to nobody.'
  quote: Aluminum is a lightweight, non-magnetic metal that can be easily formed or drawn.
  approx_offset: 81873
- hazard: hard_wrapped_duplicate
  note: 'the metal-stamping blog post exists in the file TWICE in two different LINE LAYOUTS: once as
    single long lines (line 3158, 364 characters) and once hard-wrapped to a median of 93 characters per
    line (lines 4838-4894). The consequence is exact and measurable -- ''metal stamping machine'' has
    ZERO occurrences in the whole file, because in the wrapped copy ''metal'' ends line 4869 and ''stamping
    machine,'' begins line 4870, and in the long copy the phrase happens not to occur. A form can be genuinely
    present in the document and unmatchable by a line-scoped matcher. The quoted line is the second half
    of that split.'
  quote: stamping machine, different stations will form punches and bends to achieve the desired shape.
  approx_offset: 167129
- hazard: duplicate_page
  note: 61 page blocks, 47 distinct bodies. Whole pages are served under two and sometimes three URLs
    -- /about, /about-tanfel and /about-tanfel/ are one body; /quotes/, /quotes and /quote are another;
    and eleven more pairs. So the baseline occurrence count on this subject is 2, not 1, and for the About
    page it is 3. The home page additionally repeats its own hero and testimonial blocks twice WITHIN
    one page, which is why the testimonial count is 6 rather than 3.
  quote: https://www.tanfel.com/about-tanfel/
  approx_offset: 169977
- hazard: repeated_banner
  note: the thread-plug-gage banner is an ALL-CAPS standalone line on 42 of the pages, and it is the ONLY
    product Tanfel unambiguously makes under its own name. So the site's one genuine own-product claim
    is also its most-repeated boilerplate line -- occurrence frequency and attribution confidence point
    the same way here and the opposite way everywhere else on this subject.
  quote: TANFEL NOW MAKES HIGH-QUALITY THREAD PLUG GAGES.
  approx_offset: 2613
- hazard: heading_style_all_caps
  note: headings are bare ALL-CAPS lines throughout, and the file splits a single heading across TWO consecutive
    lines ('CUSTOMER' then 'TESTIMONIALS', 'WHAT' then 'CUSTOMERS SAY'). A clip that takes one line takes
    half a heading; the quoted line is the second half of one of them, and its partner 'WHAT' is a five-occurrence
    string on its own. The nav line is also ALL-CAPS with four trailing spaces on some items ('CAPABILITIES
    ', 'INDUSTRIES '), the same trailing-space trap taylordunn has.
  quote: CUSTOMERS SAY
  approx_offset: 5816
- hazard: off_topic_page
  note: one entire page is a 2019 trade-policy explainer with no manufacturing content at all. It is a
    genre the rest of the corpus does not carry, and every country, industry and product word inside it
    is policy vocabulary rather than capability vocabulary.
  quote: SECTION 301 TARIFFS ON CHINA
  approx_offset: 96893
- hazard: nbsp_mid_sentence
  note: '263 NO-BREAK SPACEs, and unlike sterlingmfg most of them are MID-LINE: 158 mid-line, 67 trailing,
    38 leading. They sit after full stops, after commas, and between ordinary words inside sentences,
    so a phrase retyped with ordinary spaces silently fails to match. The quoted fragment carries two
