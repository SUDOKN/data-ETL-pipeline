third_party_voice:
- speaker: unnamed offshore partner factories, narrated by Tanfel in the first person
  whose_words: site
  note: THE case this subject exists to test, and note that whose_words is `site` throughout -- Tanfel
    really is the speaker. What is wrong is never the speaker, it is the ACTOR, and the two come apart
    with no grammatical signal at all. This is the inverse of the taylordunn failure (where the speaker
    is wrong and the actor is nobody) and a sibling of superiortech's trusted-vendors tier (where the
    site flags the hand-off explicitly). Tanfel never flags it in the capability prose. The one place
    the model is stated is in a CUSTOMER's testimonial, quoted here, which is the only sentence in the
    file that says outright that an offshore company does the work.
  quote: The great thing is that Tanfel not only vets these companies fully, but my business dealing is
    with Tanfel, not the offshore company.
- speaker: four named customers (Dr. Rod; Zane Forier; John Marcin of Rojo Sport, Inc.; the CEO of Endura
    Flap Pet Doors)
  whose_words: customer
  note: the corpus's cleanest `customer` voice, and the attribution line always sits on the line AFTER
    the quote, never inside it. Their products -- dog doors, sporting goods, custom fabrications -- are
    the customers' catalogue items, not Tanfel's, and the industries they imply are imported into Tanfel's
    profile by exactly this route.
  quote: '- JOHN MARCIN – PRESIDENT, ROJO SPORT, INC.'
- speaker: Tanfel itself, on the two things it genuinely owns
  whose_words: site
  note: the true positives, and there are only two. Tanfel Metrology is a named division selling its own
    branded GO/NO-GO thread plug gauges, described once in an explicitly self-referential sentence, and
    the ISO 9001:2015 certificate is offered as a downloadable document title three times. Anything else
    attributed to Tanfel on this site is either a partner's capability or a customer's product.
  quote: Tanfel Metrology was created as a division of Tanfel, Inc., to provide affordable, high-quality
    metrology solutions online.
- speaker: nobody -- generic textbook prose with no subject
  whose_words: third_party
  note: three long pages are manufacturing-engineering explainer text in which the actor is a generic
    'you' or the passive voice. The quoted sentence names a piece of extrusion equipment that belongs
    to no one -- it is describing how extrusion works, not what Tanfel has. This is the `third_party`
    bucket in the sense that the words are encyclopedia copy rather than anyone's claim, and it is worth
    a location label precisely because no other value fits.
  quote: An extrusion puller guides the extrusion to the runout table
- speaker: ISO, IATF, AS 9100 and the standards regime
  whose_words: standards_body
  note: 'nine distinct standard designations occur in the file and the search-stage count is NOT inflated
    -- what is wrong is the holder. The trap the old pipeline fell into is an echo defect, not an attribution
    one: ''ISO 16949'' and ''IATF 16949'' have ZERO occurrences here. What exists is ''ISO/TS 16949:2009''
    (1), ''TS 16949'' (2), ''TS16949'' (1) and a bare ''IATF'' (2). Three spellings of one standard plus
    one bare acronym -- a grouping case as much as an attribution one.'
  quote: Tolerances per ISO 2768 (m)
notes: 'The batch''s `whose_words` subject, and its lesson is that the failure is not in the speaker element.
  Tanfel is the speaker of almost every sentence in this file and the location model will say so correctly;
  what it cannot see is that the shop being described is somebody else''s. The disconfirming evidence
  exists but is never adjacent -- it is in a customer testimonial and in two ''our global network of certified
  facilities'' sentences, both far from the capability prose they qualify. That makes this the corpus''s
  argument for grading `belongs_to` separately from `whose_words`, which GOLDEN_LABELS_SCHEMA.md already
  requires. Three prior-profile corrections came out of this pass: the file has 61 page blocks and 54
  distinct paths, not 52 URLs; ''ISO & IATF certified facilities'' occurs twice, not once; and ''metal
  stamping machine'' has ZERO occurrences not because of a single line break but because the blog post
  exists in the file twice in two different line layouts, hard-wrapped in one of them. Equipment is genuinely
  NON-empty here -- six lathe types in a first-person owned-fleet claim -- and seeding it empty would
  manufacture a false junk-minting verdict on correct output.'
