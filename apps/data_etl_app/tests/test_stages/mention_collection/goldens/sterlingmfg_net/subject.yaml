text_hazards:
- hazard: country_dropdown
  note: THE headline mention-stage hazard on this subject, and the measurement corrects the profiles on
    record. The list is 249 entries, not '~240', and it is printed TWICE verbatim -- lines 2663-2911 and
    3900-4148 -- so 498 of the file's 4,923 non-blank lines (10.1%) are a one-line bare place name with
    no sentence around them. It is the careers page's address form, dumped as plain text at both /careers/
    and /about/careers/. Every one of the 498 clips to a snippet that is the country name alone. Sixteen
    entries collide with ordinary or manufacturing vocabulary -- Chad, Chile, China, Georgia, Grenada,
    Guinea, India, Israel, Japan, Jersey, Jordan, Mali, Malta, Niger, Oman, Panama -- and each of those
    is an industry-shaped or material-shaped false friend that occurs exactly twice.
  quote: Bonaire, Sint Eustatius and Saba
  measured:
    entries: 249
    printed_times: 2
    line_instances: 498
    share_of_nonblank_lines: 10.1%
    share_of_total_lines: 8.2%
    share_of_nonblank_chars: 2.5%
  approx_offset: 94068
- hazard: label_below_its_list
  note: the detail that makes the dropdown worse than decimal.net's, and it is new here. The word 'Country'
    occurs exactly TWICE in the whole file, and both times it sits BELOW the 249 entries it labels --
    line 2912, immediately after Åland Islands, and line 4149. The nearest line ABOVE the list is 'ZIP
    / Postal Code'. So a snippet that reaches upward for context, which is the correct move for a bare
    list item everywhere else in this corpus, finds a postcode field 250 lines from the bottom of the
    list and never finds the word that would identify these as countries. The disambiguating token is
    downward-only.
  quote: Country
  approx_offset: 96668
- hazard: repeated_footer
  note: '47 distinct lines occur 52 or more times, accounting for 2,742 line-instances -- 55.7% of all
    non-blank lines but only 23.0% of the characters. The block carries the ENTIRE certification list,
    so every attestation form on this subject occurs 52+ times in an identical footer snippet and only
    a handful of times in prose. The quoted line is a certificate BOUND TO A NAMED LEGAL REGISTRANT, repeated
    52 times, and it is the cleanest single artifact on this subject: the FDA number and the registrant
    name travel together on one line, so a correct clip preserves the binding and a line-splitting clip
    destroys it.'
  quote: 'EPTAM Plastics, LTD Registration Number: 3005144609'
  approx_offset: 3181
- hazard: attestation_bound_to_registrant
  note: the quality page states the bindings properly, under a heading that occurs exactly ONCE, and then
    gives four registrant names as bare lines each followed by its own certificate lines. 'ISO 13485:2016
    Certified' appears under all FOUR registrants, so the string alone carries no scope and the ONLY thing
    separating the four is the bare name line above each group. The quoted heading is the single most
    load-bearing line in the file for whose_words and belongs_to, and it occurs once against the footer's
    52 scope-free repetitions.
  quote: Certifications by location
  approx_offset: 136611
- hazard: registrant_naming_mismatch
  note: 'the footer and the quality page name the SAME legal entities differently, and the FDA number
    is the only join key. Footer: ''EPTAM Plastics, LTD'' (52x) and ''EPTAM West, LLC'' (52x). Quality
    page: ''EPTAM Precision Plastics'' (2x) and ''EPTAM Precision Metals'' (6x). #3005144609 and #3011302692
    are what tie them together. A grouping label that merges on the name will produce two entities where
    there is one, and a location label reading the footer will attribute to a company name the quality
    page never uses.'
  quote: 'FDA #3011302692 Registered'
  approx_offset: 136981
- hazard: self_contradiction
  note: the silicone-molding page lists the SAME two FDA numbers the quality page and footer call held
    as PENDING, once, in a single line. The word that inverts the claim is the first word of the line,
    so any clip that starts after it reports a registration the text says does not exist yet.
  quote: 'Pending FDA Registration (#3005144609, #3011302692)'
  approx_offset: 48808
- hazard: two_spellings_one_standard
  note: 'the same medical-device standard is spelled two ways with different punctuation and the counts
    are wildly asymmetric: ''ISO:13485:2016 Certified'' with an extra colon occurs 53 times (it is the
    footer form), while ''ISO 13485:2016 Certified'' occurs 7 times (the prose form). Two more variants
    exist once each, ''ISO 13485 Certified'' and ''ISO 13485:2016 Registered''. A grouping label that
    does not fold the colon reports the footer variant as the dominant entity and the real prose evidence
    as a rare one.'
  quote: ISO:13485:2016 Certified
  approx_offset: 3136
- hazard: entity_drift
  note: the corpus's entity-drift case, and it is total. All 52 page URLs are on eptam.com, the site names
    itself EPTAM Precision Solutions, and the seed domain sterlingmfg.net occurs exactly ONCE in 210,482
    characters -- inside a press release's 'About Sterling Manufacturing and Albright Silicone' paragraph,
    as a pointer to a company EPTAM acquired. Every location label on this subject that says 'the site'
    is naming EPTAM, not Sterling, and the one place the two are connected is third-person boilerplate
    about the acquiree.
  quote: For more information about Sterling and Albright, visit (http://www.sterlingmfg.net/)
  approx_offset: 160168
- hazard: error_page
  note: 'FOUR of the 52 pages scrape to a 404 stub, three of them byte-identical (993 characters: /?page_id=3433,
    /news/ and /rapid-launch-center/) and a fourth at the malformed URL https://eptam.com/www.eptam.com.
    The /news/ index and the Rapid Launch Center page being dead is the notable part -- the Rapid Launch
    Center is one of the five acquisitions, and its own page has no content.'
  quote: It looks like nothing was found at this location.
  approx_offset: 4025
- hazard: duplicate_page
  note: 52 URLs, 48 distinct bodies. /resources/ and /resources are the same page at two URLs; /careers/
    and /about/careers/ likewise, which is why the country dropdown is printed twice rather than once.
    Baseline occurrence for anything on those pages is 2, not 1.
  quote: https://eptam.com/about/careers/
  approx_offset: 124343
- hazard: flattened_spec_table
  note: 'the additive-manufacturing page is a table flattened to consecutive bare lines -- machine name,
    unit count, machine name again, build envelope, filament list -- with no sentence anywhere and no
    column headers. It also carries THREE spellings of one thing within thirty lines: ''FDM printer''
    (lowercase p), ''FDM Printer'', and ''FDM Printer'' followed by a ZERO WIDTH SPACE. The quoted line
    is a unit count with a trailing ZWSP, which is what a clip on any of these machines returns as its
    neighbouring context.'
  quote: 1 in shop​
  approx_offset: 88634
- hazard: invisible_trailing_characters
  note: '92 NO-BREAK SPACEs and 13 ZERO WIDTH SPACEs, and their placement is the opposite of what search/expectations
    reported. Measured here: ALL 13 ZWSPs are line-TRAILING, and of the 92 NBSPs, 69 are trailing, 23
    are mid-line and none is leading. So the certification lines quoted below end in an invisible character
    rather than containing one -- a form matched against them succeeds, but a snippet clipped to the line
    carries a trailing NBSP that any exact-span check will see. There are also 5 U+202F NARROW NO-BREAK
    SPACEs, one of them adjacent to an NBSP in a single phrase.'
  quote: ISO Class 8 certified cleanrooms 
  approx_offset: 77891
- hazard: mis_filed_footer_column
  note: the footer prints 'Rapid Prototyping' TWICE per page -- once under the CAPABILITIES heading and
    once under INDUSTRIES -- so a process is asserted as a served industry 52 times over. The form has
    110 occurrences in the file in total. Its two footer occurrences are 12 lines apart and identical,
    so nothing in the snippet distinguishes them; only the ALL-CAPS heading above each column does.
  quote: Rapid Prototyping
  approx_offset: 2937
- hazard: heading_style_all_caps
  note: the footer's five column headings are bare ALL-CAPS lines (CAPABILITIES, CERTIFICATIONS, TECHNICAL
    MANUFACTURING, INDUSTRIES, COMPANY) and are the only thing assigning the bare labels beneath them.
    CAPABILITIES occurs 105 times and INDUSTRIES 104 -- roughly twice per page, because the same word
    is also a top-nav item. So the heading a snippet would need to reach for is itself an ambiguous, doubly-occurring
    string.
  quote: TECHNICAL MANUFACTURING
  approx_offset: 3475
- hazard: scrape_faithful_typos
  note: 'seven typos survive the scrape and each one is a form that can only be matched as spelled: ''Hass
    VF-SS'' for Haas (1), ''semi-conductur'' (1), ''Polyproplene'' (1), ''Nylond 12'' (1), ''Wood FIll''
    (1), ''manfanufacturing'' (1), ''design-forassembly'' (1). The quoted line is the machine-brand one
    and packs four builders into a single sentence, so all four share one snippet.'
  quote: Over 50 Machining centers driven by Star, Tornos Deco, TornosNanos, Hass VF-SS, and Mazak Integrex.
  approx_offset: 67097
- hazard: client_side_applications_list
  note: the semiconductor page lists END PRODUCTS OF EPTAM'S CUSTOMERS' CUSTOMERS as a bare comma list.
    These read as EPTAM products and are two steps removed from anything it makes. One line, one snippet,
    three product-shaped forms.
  quote: Computers, Laptops, Tablets
  approx_offset: 119174
