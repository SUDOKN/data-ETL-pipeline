  COMPANIES, each with an 'About <company>' block in a press release describing THEIR equipment, products
  and certifications in the third person. (2) NINE FORMER EMPLOYERS named in executive biographies, with
  the products those people made there. (3) Machine builders and standards bodies. The acquired-company
  blocks are the dangerous ones because they are grammatically indistinguishable from EPTAM's own capability
  prose and sit on EPTAM's own domain.
