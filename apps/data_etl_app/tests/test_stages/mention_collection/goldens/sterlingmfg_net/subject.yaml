- speaker: ISO, FDA, ANVISA, NCSL, AS9100/AS9102, ITAR/DDTC, 21 CFR 820, Mil-I-45662A/45208
  whose_words: standards_body
  note: 'the densest standards regime in the batch, and almost all of it lives in the 52-times footer
    rather than in prose. The FDA appears as four distinct establishment numbers, which is unusual: the
    standards body is referenced by the subject''s own registration identifiers, so the same body maps
    to four different scopes on one site.'
  quote: 'Equipment Calibration: ISO 10012 and/or NCSL Z540 Compliant'
notes: 'The batch''s hardest subject for this stage, for three separate reasons that do not overlap. (1)
  OCCURRENCE INFLATION: 47 lines repeat 52+ times and carry the entire certification list, so every attestation''s
  count is dominated by a footer with no sentence in it, while the one page that actually scopes those
  attestations to their legal registrants says so exactly once. (2) LIST CONTEXT: the 249-entry country
  dropdown is printed twice, 498 bare lines, and its ''Country'' label sits BELOW the list, so upward
  context-seeking -- the correct heuristic everywhere else -- fails here by design. (3) WHOSE_WORDS: five
  acquired companies, nine former employers and two private-equity owners are all described on EPTAM''s
  own domain in prose that is grammatically identical to EPTAM''s own. Add the entity drift on top: the
  subject is keyed to sterlingmfg.net and that string occurs once in the file, inside a paragraph about
  a company EPTAM bought. Anything that attributes by domain mis-attributes everything here.'
