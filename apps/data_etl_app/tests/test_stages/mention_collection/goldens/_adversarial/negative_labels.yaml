golden_set_version: 1
generated: '2026-08-27'
kind: adversarial_negatives
anchored_on: adversarial
notes: 'The NEGATIVE half of the mention-stage golden corpus: forms the stage must return ZERO mentions for. Two classes, both with verified live examples in this corpus. (1) SUBSTRING TRAPS - the form has no whole-word occurrence but does occur inside longer words, so a containment matcher ''finds'' it (expect.occurrences: 0 plus expect.substring_trap_inside naming one enclosing word). (2) ZERO-OCCURRENCE FORMS - the form is absent as a substring too, yet downstream stages produced tags for it (expect.must_not_occur: true). Every count in this file was measured by the author against the pinned snapshot, not copied from any prior document; where a prior claim did not survive the check it was dropped and reported as a correction instead of labelled.'
method: 'whole-word counts: _shared.text_matching.flexible_pattern(form, case_sensitive=...).findall(normalize_spaces(text)) - the same matcher the eval uses, so these numbers are the harness''s numbers; forms of 3 characters or fewer are forced to case-sensitive matching by that module (SHORT_FORM_MAX_LENGTH), which is the rule these labels exercise. naive-substring counts: normalize_spaces(text).lower().count(form.lower()). Quotes are verbatim contiguous substrings of the snapshot (long lines clipped outward to whitespace); approx_offset is advisory and indexes the untrimmed snapshot.'
status_policy: confirmed = an independent prior pass claimed the form (the expansion doc or a search-stage false_friend entry) AND this pass re-measured it and agrees - two passes, per GOLDEN_LABELS_SCHEMA.md. candidate = found only by this pass's own short-form probe and still owed a second reader.
