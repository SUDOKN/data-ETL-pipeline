coverage: full_text
coverage_note: 'full_text per the user''s choice, but this pass SAMPLED the 1,805,368-byte file. What was actually done: (1) a whole-file streaming pass computing line/byte repetition, the line-length distribution, the per-page non-blank line counts for all 165 pages and a complete non-ASCII codepoint census, so every number in `shape` and every count quoted below is measured over 100% of the file; (2) full reads of the homepage, the Quality/certification block, the customer-references page, the agsoutsourcing.com page and the longest-line essay page; (3) targeted reads of the welding, filtration, valves, fasteners, SADT-instrument and rack pages; (4) whole-file greps for the fusions, the Turkish letters, country lists, testimonials, ''Coming Soon'', lorem ipsum and the all-caps heading inventory. Boilerplate is 34.3% of non-blank BYTES (70.6% of non-blank LINES) - lower in bytes than acimachine, so a larger share of this file is unread unique prose. Judgment labels should stay on the pages listed here, or on the eight page-aligned slices search/expectations/agstech_net/subject.yaml records, until a second pass widens them.'
notes: 'Kept at role attribution_negative - see role_source for the schema drift. For THIS stage the subject is really two instruments at once. First, it is the corpus''s only test of snippet extent under adversarial line structure: 301 lines over 1,000 characters carrying 31% of the content, one of them 17 KB, against a median line of 38 characters. Second, it is the cleanest detached- attribution case on record - the sentence that assigns the certificates to supplier plants is six blank-line-separated lines away from the certificates themselves, so no snippet can carry it and the location label is the only surviving channel. The open question the search harness recorded (whether a process at a PARTIALLY-OWNED partner plant is the subject''s own capability) does not block this stage: it changes the actor downstream, not where a form occurs or what passage holds it.'
