text_hazards:
- hazard: repeated_footer
  note: 'VERIFIED THIS PASS. A 42-line footer block (lines 48-89: "ABOUT US" through "Powered by") repeats 112 times.
    4,789 of the file''s 10,413 lines - 46.0% - belong to a line repeating 50+ times; the expansion doc said 44%
    and the search profile 45%, both are right within rounding of a differently-drawn line. THE PURE MENTION-STAGE
    HAZARD: the footer nav labels ARE capability forms, so one bare two-word snippet carries hundreds of occurrences.
    Measured per form in this snapshot: `Forged Flanges` 123 total occurrences of which 114 (93%) are the bare footer
    line; `Manifolds` 118 / 114 (97%); `Material Grades` 114 / 112 (98%); `Industries We Serve` 113 / 112 (99%);
    `Quality Policy` 112 / 112 (100%); `Valves` 146 / 114 (78%). Every one of those hundreds of snippets is byte-identical
    and belongs to the site footer, not to product prose.'
  quote: © 2016 Pradeep Metals Limited. All rights reserved | XML Sitemap | Powered by
  context_quote: 'PRODUCTS

    Forged Flanges

    Valves

    General Engineering

    Manifolds

    Material Grades'
- hazard: duplicate_page_fetches
  note: 'MEASURED THIS PASS: 114 page fetches carrying 114 DISTINCT URLs but only 91 distinct bodies; 43 of the
    114 fetches (37.7%) have a body byte-identical to another fetch. The duplicates are http:// vs https:// and
    with vs without a trailing slash. /forging/, /general-engineering/ and /india-facilities are each fetched three
    times. This is invisible to a URL-keyed de-duplicator because no URL repeats, so occurrence counts are inflated
    2-3x on exactly the capability pages that matter.'
  quote: http://www.pradeepmetals.com/quality/
- hazard: financial_table_beside_capacity
  note: 'rupee money figures and metric-tonne capacity figures are interleaved in one voice on one page. In the
    quoted blog post, three number regimes sit within four paragraphs: the WHOLE INDIAN INDUSTRY''s tonnage (39.4
    lakh Metric Tonnes), the COMPANY''s money (175 crores in annual sales) and the COMPANY''s own capacity (8000
    MTPA to 9200 MTPA). Only the last is capacity. The homepage announcement ticker does the same at line level:
    "Rs 4,602.62 lakhs" sits two lines above the capability paragraph.'
  quote: With constantly increasing demand in the area of specialization Pradeep Metal indulges in- Metal Forging,
    we aim to develop new forging products and expand our clientele in the upcoming years. In the upcoming years,
    Pradeep Metals will particularly focus on the development of machined forgings for the Oil and Gas industry
    for increased turnover and ultimately, better profitability. With the acquisition of the new 3T Hammer, the
    forging capacity of Pradeep Metals has increased from 8000 MTPA to 9200 MTPA, which helps us to cater to the
    needs of many industries and providing a diverse range of manufactured products.
  context_quote: 'Original equipment manufacturers prefer forged products over other types for durability and reliability.
    India has become the 3rd largest manufacturers for forging in the world over the past decade, closely trailing
    Germany and China. Forging industry has become the most prominent contributor to the Indian manufacturing industry
    overall. The installed capacity for forging in India has grown from approximately 25 lakh Metric Tonnes to 39.4
    lakh Metric Tonnes in just the span of a decade. Moreover, the overall production of forgings in India was over
    25 lakh Metric Tonnes in 2018.


    Pradeep Metals generated over 175 crores in annual sales in the year 2018. With the market capitalization of
    Pradeep Metals growing rapidly year by year, we aim to adapt to the rising demand for machined components, and
    have taken up the initiative to set up a new machine shop within the existing plant by importing some of the
    high-end machinery from our step-down subsidiary- Dimensional Machine Works, LLC,Houston, USA. We continue to
    upgrade our plants, equipment, and infrastructure regularly by creating a lean process layout for assessing
    the needs of our inventory and reorganizing it effectively.'
- hazard: spec_table_flattened
  note: 'the MATERIAL GRADES USED table is a 5-column table (STAINLESS STEEL / Alloy Steel / Duplex / Carbon Steel
    / Die Steel) flattened to ONE CELL PER LINE. The column header that says which family a grade belongs to survives
    only on the first row; every other grade is a bare token on its own line with zero context. Three lines carry
    two columns'' cells jammed together by the flattening ("F92\tF51/1.4462/2205" at line 759, "Alloy 20\tSAE -
    1008" at 765, "LF2 / 1.0436\tEn24" at 781) and three cells are run together with NO separator at all: F347H1.4301
    = F347H + 1.4301, 414020MnCr5 = 4140 + 20MnCr5, 42CrMo4F5 = 42CrMo4 + F5. A snippet clipped to line 744 is the
    four characters "1.4435".'
  quote: "STAINLESS STEEL\tAlloy Steel\tDuplex\tCarbon Steel\tDie Steel\nF303\nF304/F304L\nF316 Ti\nF316/F316L\n\
    F321\nF347H1.4301\n1.4307\n1.4435"
