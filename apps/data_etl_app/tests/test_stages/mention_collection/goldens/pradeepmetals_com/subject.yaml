- hazard: coming_soon_stub
  note: '15 "Coming Soon" stubs (grep -ci "coming soon" = 15, in four spellings: "Coming Soon", "Coming soon", "Coming
    Soon....", "Coming Soon!.."), and they are exactly the pages whose names promise the densest in-field content
    - /tool-die-development, /aluminium-forging, /industries-we-serve, /stainless-steel-forgings, /testing-validation,
    /gears-automative, /us-facilities, /investors. A stub page is a page of footer plus two words, so every one
    of them contributes another full copy of the nav and footer occurrences and no content.'
  quote: Coming Soon….
- hazard: heading_all_caps
  note: 'MEASURED THIS PASS: 1,666 standalone ALL-CAPS lines. The most frequent are not headings at all but footer
    nav labels - QUALITY 115x, INVESTORS 113x, ABOUT US 112x, PRODUCTS 112x, FACILITIES 112x, AGM/EOGM 112x, STRENGTHS
    112x, CLIENTELE 112x, BSE SHARE PRICE 114x. A location model keying on casing will call every one of them a
    section heading.'
  quote: QUALITY
- hazard: heading_severed_from_row
  note: 'on the Quality page the qualifier that turns a name into a conformity attestation is on the NEXT line:
