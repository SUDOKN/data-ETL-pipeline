- hazard: document_title_listing
  note: 'the Policies and investor-relations pages are download listings: an ALL-CAPS document title on one line,
    the link label "(DOWNLOAD ENGLISH)" on the next (42 occurrences). Elsewhere the label is a bare "Download" (195
    occurrences, the single most repeated line in the file). Every title line is a document_title, never prose,
    and never the site describing itself.'
