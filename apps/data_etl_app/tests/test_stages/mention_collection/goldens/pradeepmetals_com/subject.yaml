- hazard: non_ascii
  note: 'CENSUSED THIS PASS: 787 non-ASCII characters - 244 EN DASH (the timeline and certificate-year separator),
    211 NO-BREAK SPACE, 114 COPYRIGHT SIGN, 73 RIGHT SINGLE QUOTATION MARK, 35 EM DASH, 40 curly double quotes,
    28 arrows, 13 ellipses, 9 MASCULINE ORDINAL INDICATOR (used where a degree sign was meant), 6 TRADE MARK SIGN.
    The NBSP count of 211 matches the search profile exactly. Unlike steelcraft, only 8 of the 211 sit between two
    word characters, so NBSP is a LOW occurrence risk here; the en dash is the higher one, because it separates
    a year from its event on 244 lines and a matcher that normalizes it to a hyphen changes the line. Separately,
    three in-text typos change a designation and are the only spelling the file has: "ISO 45001- 2018" (stray space),
    "ISO 140001-2015" (five digits, twice) and "Austentizing furnaces".'
  quote: ISO 45001- 2018
notes: The subject's own capability content is ~12 pages of the 114 fetches; the rest is investor relations (~24
  pages), blog explainers (15 posts), duplicates and stubs. For THIS stage the consequence is that most occurrences
  of most forms are footer nav labels and most snippets are byte-identical, so the interesting judgments are concentrated
  in a small minority of occurrences - the grouping and inheritance kinds will carry more signal here than occurrence
  counts. The IMRC (Industrial Microwave Research Center) pages carry a lab parameter table (lines 894-955) of microwave
  power ratings and zone dimensions that is concluded research, not production.
