- hazard: timeline_table_flattened
  note: the Our History decade table is flattened so each decade label appears three times in a row ("2000 / 2000
    / 2000'S") and each event is a subject-less fragment on its own line. "Added Capacity of 8000 tons" has no year,
    no subject and no verb in its own clip; the year that owns it is three lines up.
  quote: '1990

    1990

