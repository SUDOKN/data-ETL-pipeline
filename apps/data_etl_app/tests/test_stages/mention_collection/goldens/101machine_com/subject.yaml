text_hazards:
- hazard: bare_list_lines
  note: the Turning Services and Milling Services blocks are one process per line with no verb, no subject and no sentence. A clip on any of ~25 process forms yields the bare token alone, so the snippet carries no evidence that 101 Machine performs it - the only thing that does is the section heading two to fifteen lines above. This is the dominant snippet risk on this subject.
  quote: Counter Boring
- hazard: heading_only_line
  note: section headings sit alone on their own line, so the heading is both a candidate form itself and the only context the bare list beneath it has; approx line 64
  quote: Milling Services
- hazard: slash_delimited_material_line
  note: one line carries five distinct material forms (Cold Rolled, Hot Rolled, Carbon, Structual [sic], Tool); every one of them clips to this identical non-sentence, so five different mentions share one snippet. Note the curly apostrophe U+2019 in Steel’s - a form spelled with an ASCII apostrophe cannot match, and the form Steel matches INSIDE it (an inheritance case). approx line 96
  quote: 'Steel’s: Cold Rolled/Hot Rolled/Carbon/Structual/Tool'
- hazard: negation_sentence
  note: the only negative capability statement in the file. The clip must keep the negation or the snippet asserts the opposite of the text; the preceding sentence on the same line is about cleanliness, so a sentence-level clip is correct here and a line-level clip is misleadingly wide. approx line 125
  quote: We DO NOT machine automobile parts!
- hazard: duplicate_page
  note: https://101machine.com/index.html duplicates https://101machine.com/ verbatim, so every form on the homepage has exactly 2 occurrences rather than 1. This quote occurs exactly twice (lines 11 and 168) and is the cheapest probe for whether an occurrence count is real repetition or scrape duplication.
  quote: What began in a garage in 2004 has grown through a reputation of excellence.
- hazard: repeated_nav
  note: identical nav line on all 9 pages; 9 of 167 non-blank lines
  quote: 101 Machine Capabilities Contact Us FAQ NEW
- hazard: repeated_footer
  note: the 4-line address/phone footer repeats 10 times (once per page, twice on contact.html); 40 of 167 non-blank lines
  quote: 1937 Evans Rd
- hazard: own_name_substring
  note: the company name contains the ordinary word Machine. '101 Machine' occurs 30 times, 19 of them inside the repeated nav and footer, so any form containing Machine or Machining inherits boilerplate occurrences from the company's own name.
  quote: 101 Machine, Inc
- hazard: en_dash_in_list_item
  note: U+2013 EN DASH, not a hyphen; and the same list item is spelled 'Hexs' on the turning page (line 40) and 'Hexes' on the milling page (line 74). Two spellings of one thing, one character apart - a grouping case, and both source typos must be quoted uncorrected.
  quote: Broaching – Hexs and Square
- hazard: sparse_nonascii
  note: only 4 lines in the whole file hold a non-ASCII character (U+2013 twice, U+2019 twice) and there is not one NBSP. This subject is the corpus's clean control for encoding hazards.
  quote: 'Stainless Steel’s including: 300 & 400 series'
