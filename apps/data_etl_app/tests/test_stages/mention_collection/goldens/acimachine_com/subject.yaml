coverage: full_text
coverage_note: 'full_text per the user''s choice, but this pass SAMPLED the 4,037,573-byte file rather than reading it end to end. What was actually done: (1) a whole-file streaming pass computing line/byte repetition, line-length distribution and the non-ASCII census, so every number in `shape` and every occurrence count quoted in the hazards is measured over 100% of the file; (2) full reads of the homepage, About_Us, support, brands and blog pages; (3) full reads of the Chevalier FSG-3A1224, Winema RV 10 Flexmaster and Hurco VMX42i listings, plus strided 16-line slices at lines 30000, 60000, 120000, 180000 and 220000; (4) whole-file greps for cookie/testimonial/country-list/ lorem/404/ellipsis-truncated labels. 86.6% of non-blank BYTES sit on lines that occur five or more times, so the sampled remainder is overwhelmingly repetition of what was read: only 9,762 distinct non-blank lines exist in the whole file. Judgment labels should still be confined to the pages listed here and in search/expectations/acimachine_com/subject.yaml until a second pass widens them.'
notes: 'Largest text in the corpus and the stage''s worst-case on two axes at once: occurrence volume (a single form occurring 6,702 times) and voice (the first-person prose on ~1,292 pages belongs to fourteen different machine builders, not to the subject). Its own eight capabilities occur once each, so frequency and ownership point in opposite directions - which is why whose_words, not occurrence counting, is the thing worth labelling here.'
