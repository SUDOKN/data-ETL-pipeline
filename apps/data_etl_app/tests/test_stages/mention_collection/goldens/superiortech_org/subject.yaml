third_party_voice:
- speaker: unnamed subcontractors, referred to only as 'our trusted vendors'
  whose_words: site
  note: 'THE attribution problem on this subject, and note that whose_words is `site` while the CAPABILITY
    is the vendor''s -- the site really is speaking, it is simply speaking about somebody else''s shop.
    That is why this subject is worth a location label: the speaker and the actor come apart without any
    change of voice, and `belongs_to` is the element that has to carry it. The phrase appears 4 times
    and governs the heat-treatment, plating and destructive/chemical-testing lists beneath it. Everything
    on the same page under ''In house capabilities'' (2 occurrences) is genuinely Superior''s.'
  quote: Working with our trusted vendors, we are able to control all aspects of the process and guarantee
    the process, certifying and traceable parts to many industrial and Mil-Spec’s
- speaker: machine-tool and metrology builders (Hardinge, Okuma, Mazak, Doosan, Matsuura, Fanuc, Zeiss,
    Wenzel, Brown & Sharpe, Mitutoyo and 24 more)
  whose_words: vendor
  note: 34 brands, every one of them confined to the 90 census rows and named nowhere else in the file.
    The census is Superior asserting ownership OF another company's product, so the brand is the vendor's
    and the machine is the site's -- the inverse of the trusted-vendors case above, and the reason the
    expansion doc's 'owned machine -> own product leak' fires here ('Large Capacity 4-Axis Horizontal
    CNC Machining Centers').
  quote: (10) BRIDGEPORT Manual & CNC Milling Machines
- speaker: ISO, and ASME/AWS named as a certifiability standard
  whose_words: standards_body
  note: the footer strip states the one attestation the company holds. Separately, the TOOLROOM census
    carries a welding sub-heading that claims only CERTIFIABILITY, not certification -- 'ASME AWS certifiable'
    -- with two NO-BREAK SPACEs before the parenthesis. A snippet that clips away the word 'certifiable'
    converts a hedge into a held certificate, which is the single most damaging mis-clip available on
    this subject.
  quote: WELDING   (ASME AWS certifiable)
- speaker: customers, described only as a class and never named
  whose_words: customer
  note: no customer is named anywhere in 59,416 characters. The closest the site comes is the quoted line,
    which names a market segment and occurs once. Consequently `customer` should be close to an empty
    class on this subject, and a location label predicting it is almost certainly wrong -- a useful negative
    control against a model that over-predicts customer voice on build-to-print shops.
  quote: Serving diverse range of customers including Fortune 500, OEM’s, smaller companies and startups
    with parts that exceed quality expectations, are cost competitive, and meet production timing.
notes: 'The corpus''s best stratification case for THIS stage, because the two tiers are indistinguishable
  by voice and distinguishable only by structure. Tier one is a 90-row, 152-unit machine census that occurs
  ONCE in the file, has no sentences at all, and hangs entirely off seven ALL-CAPS section headings. Tier
  two is a set of hedged one-sentence vendor lists that occur TWICE each (URL duplication), read as first-person
  capability claims, and are governed by a ''our trusted vendors'' clause one or two lines above the clip.
  A snippet clipped to the sentence gets tier two wrong unless it reaches up for that clause; a snippet
  clipped to the line gets tier one wrong unless it reaches up for the heading. Both failures are the
  same failure and this subject is where to measure it. Second: the three substring traps (PET, ITAR,
  Iron) are all confirmed at the counts on record, and the new detail is that PET and ITAR are ZERO even
  as case-sensitive substrings -- the 9 hits each exist only for a case-folding matcher, while Iron''s
  7 exist regardless. Third: 30 pages, 20 distinct bodies, 4 of them a content-free 293-character stub,
  one of which is the ISO certificate page itself.'
