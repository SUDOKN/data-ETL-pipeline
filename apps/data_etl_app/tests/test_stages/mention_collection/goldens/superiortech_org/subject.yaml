text_hazards:
- hazard: substring_trap
  note: 'PET. The stage''s word-boundary and short-form rule in its purest form, and the numbers come
    out cleaner than reported. Word-boundary occurrences of PET: ZERO. Case-SENSITIVE substring occurrences
    of the literal ''PET'': ZERO -- the uppercase string is not in the file at all. Case-INSENSITIVE substring
    occurrences: 9, and all 9 sit inside the single word ''competitive''. So the trap only fires for a
    matcher that case-folds, which is exactly the refinement a short-form rule has to get right: PET is
    a polymer abbreviation, it is spelled in capitals, and folding case to find it is what turns 0 into
    9. Confirms the expansion doc''s ''9x'' and adds the case condition.'
  quote: are cost competitive, and meet production timing.
  measured:
    word_boundary_any_case: 0
    substring_case_sensitive_PET: 0
    substring_case_insensitive: 9
    enclosing_words:
      competitive: 9
  approx_offset: 1703
- hazard: substring_trap
  note: 'ITAR. Same shape, same count, same case condition. Word-boundary occurrences: ZERO. Case-sensitive
    substring ''ITAR'': ZERO. Case-insensitive substring: 9, every one inside the word ''Military''. The
    quoted line is the crispest of the nine because it is a STANDALONE served-industry heading -- so a
    case-folding matcher does not merely find a phantom ITAR, it finds one in the highest-confidence context
    the page offers, a bare heading line with no sentence to disconfirm it. Confirms the expansion doc''s
    ''9x''.'
  quote: Military & Defense
  measured:
    word_boundary_any_case: 0
    substring_case_sensitive_ITAR: 0
    substring_case_insensitive: 9
    enclosing_words:
      Military: 9
  approx_offset: 29826
- hazard: substring_trap
  note: 'Iron -- the third of the same family, carried over from search/expectations and re-verified here.
    Word-boundary occurrences of ''iron'' in any case: ZERO. Substring occurrences: 7, five inside ''environment''
    and two inside ''environmental''. Unlike PET and ITAR this one is NOT case-conditional, which makes
    it the harder of the three: no casing rule saves a matcher from it, only the word boundary does.'
  quote: environmental and durability testing.
  measured:
    word_boundary_any_case: 0
    substring_any_case: 7
    enclosing_words:
      environment: 5
      environmental: 2
  approx_offset: 12064
- hazard: table_like_structure
  note: 'the equipment census: 90 rows in the shape ''(N)<space-ish>DESIGNATION; spec; spec; spec'', one
    machine family per line, no sentence anywhere. Every equipment form on this subject clips to one of
    these rows, so the snippet is a parts list and the only thing saying whose machines they are is the
    ALL-CAPS section heading up to 30 lines above. The quoted row is the first row of the census and carries
    a unit count of 4.'
  quote: (4)  HARDINGE CONQUEST GT; Super Precision; 1” Capacity; .00001 programmability; bar feeders
  approx_offset: 20142
- hazard: table_like_structure
  note: the outsourced tier has NO table and NO machines -- it is a single hedged sentence per process
    family, and the hedge is the point. 'Available process include but are not limited to;' introduces
    a seven-item comma list, so seven distinct process forms all clip to the SAME sentence, and that sentence's
    subject is 'our trusted vendors' two lines above, not Superior Technology. This exact line occurs
    twice (the value-added page is served at two URLs); its sibling at lines 184/1026 does the same for
    nine surface treatments. This is the corpus's clearest side-by-side of a machine-backed capability
    and a vendor-list capability written in one voice.
  quote: Available process include but are not limited to; steel case hardening, alloy steel heat treatment,
    induction hardening, nitriding, annealing, stress relieving, aluminum and copper alloy treatments.
  approx_offset: 10203
- hazard: heading_style_all_caps
  note: the census's seven section headings are bare ALL-CAPS lines and are the ONLY thing assigning the
    rows beneath them to a capability. They are also candidate forms in their own right, so the same string
    is both the heading a snippet needs and a mention to be collected. Fifteen distinct ALL-CAPS standalone
    lines exist in the file; three of them are census ROWS that happen to be fully capitalised, which
    means an ALL-CAPS test cannot be used to identify headings here.
  quote: MISCELLANEOUS EQUIPMENT
  approx_offset: 25138
- hazard: heading_only_line
  note: an ALL-CAPS census row that is indistinguishable from a heading by shape -- no count digits are
    visible without the parentheses, no specs follow, and the whole line is capitalised. Two more like
    it exist ('(1) HANDSFORD KEY SEATER', and the CMM row at line 586). Any heuristic that treats a fully-capitalised
    standalone line as a section heading will mis-classify these three machines.
  quote: (1)  CREST ULTRASONIC CLEANER
  approx_offset: 25300
- hazard: nbsp_inside_designation
  note: '139 NO-BREAK SPACEs, and their placement in the census is INCONSISTENT in three different ways:
