role_source: 'the search harness assigned role: attribution_negative (search/expectations/mathewsco_com/subject.yaml),
  which is not a value in this instrument''s vocabulary. Re-keyed to the nearest mention-stage role: the correct
  capability answer for six of seven fields is the empty set because the subject performs nothing, so every capability
  snippet on this domain is somebody else''s words. The attribution_negative rationale is what the voices block
  records, and it is the reason this subject is in the corpus.'
