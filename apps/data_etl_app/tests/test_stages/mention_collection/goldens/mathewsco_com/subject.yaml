voices:
- whose_words: site
  note: 'ONLY three page bodies are genuinely first-party: the two "Markets Covered" lists and the Kansas Office
    Services page. Everything else on this domain is somebody else''s words under Mathews'' copyright footer.'
  quote: Erikson - Howard INC., DBA Mathews & Company of California was established in 1978 as a sales representative's
    organization by Bob Mathews. We specialize in selling related products to the OEM's and Distributors for California,
    Arizona, Nevada, Washington and Oregon.
- whose_words: third_party
  note: PRINCIPALS' FIRST-PERSON MARKETING COPY PASTED ONTO THE AGENCY'S DOMAIN. Roughly 12 of the 25 pages are
    this. Seven principals get a named page each (Sun Microstamping, Ellwood City Forge, Hudson Technologies, DimcoGray,
    Rowley Spring & Stamping, DuPont, Missouri Pressed Metals) and each page is that firm's own "we" copy. The name
    appears once, in a heading two or three lines above; a snippet clipped to the sentence loses it entirely and
    the page closes with "(c) Mathews & Company".
  quote: Operating from 2 forging manufacturing facilities, ELLWOOD City Forge Group is known worldwide as a leader
    in the open-die forging industry. We manufacture concentric and eccentric contoured forgings and single cross-section
    products from carbon, alloy, stainless, tool steels, aluminum and nickel alloys in weights up to 70,000 pounds,
    lengths to 57 feet, and diameters to 135 inches.
- whose_words: third_party
  note: 'the SAME construction with the attribution even further away: on the Missouri Pressed Metals page a first-person
    EQUIPMENT CENSUS names no company at all. Clip this sentence and there is nothing in it, or in the two lines
    either side, that is not Mathews.'
  quote: Presently, we operate 70 compacting (molding to 100t in 2) and 40 coining (sizing to 60T in 2) presses.
    For impregnation we utilize five complete vacuum systems with synthetic, graphite fortified, petroleum-based
    lubricants, food grade oils and Gulf Plastic Petroleum E. Seven controlled atmosphere sintering furnaces heat
    up the situation as we operate our plant 24 hours a day, five days a week.
- whose_words: third_party
  note: 'A THIRD SPEAKER the corpus has nowhere else: the 58-line 1992 trade-magazine profile of the founder is
    written in a JOURNALIST''S first person plural ("When we talked with Bob", "we suspect") and quotes Bob Mathews
    in HIS first person ("We have the greatest portfolio of quality suppliers"). Three distinct "we"s on one page:
    the magazine, the founder, and (in the footer) the agency.'
  quote: 'Someone once said that getting there is half the fun. This has to be the case with Bob Mathews, because
    we suspect that he''s got the next hundred years very carefully planned. But planning and good business sense
    are only two of the characteristics of this man that stand out. The other is that he is a man who cares about
    others. For example, Bob has developed two seminars: "Transition From Direct Sales To Manufacturers'' Representatives,"
    and "How To Start As A Manufacturers'' Representative." When fees are charged for the presentation of either
    of these seminars, he donates the proceeds to the Salvation Army at the Camp Pendleton (California) Marine base.
    His goal is to help the dependents of the Marines stationed there. He also does seminars for college students
    to help them find jobs, and to help them quit jobs with dignity for the employer and employee.'
- whose_words: vendor
  note: the agency's only literal equipment is business software and a printed directory - Act Contact Manager and
    Harris Industrial Guides, named on the Kansas Office Services page. Neither is a production machine.
text_hazards:
- hazard: anonymous_third_party_voice
  note: 'THE HARDEST whose_words CASE IN THE CORPUS. The Kansas Product Line page (lines 586-614) describes EIGHT
    principals in the first person with NO COMPANY NAME ANYWHERE TO KEY ON - each is a bare "Capability - description"
    paragraph, and nothing on the page, before it or after it, ties any of them to a firm. Worse, the pronouns are
    incoherent WITHIN a single paragraph: the Cold Heading entry says "Our cold header offers..." and then "They
    are licensed..." and "They product fasteners..."; the Investment Castings entry says "They also offer rapid
    prototype..." then "We can supply your rapid prototype machined"; the Rubber entry says "They offer Die Cutting..."
    then "We can apply Pressure Sensitive Adhesives". The only honest whose_words here is third_party-unnamed, and
    no evidence in the text supports naming anyone. Any location that answers "site" is a major S4 fail and any
    that names a company is a fabrication.'
  quote: Cold Heading - Our cold header offers external thread parts from 3/4" diameter parts by 1/16" to 5 1/2"
    in length. They are licensed to produce a number of different products for optimum fastening solution. They
    product fasteners in carbon steel, Alloy Steel, Stainless Steel and a number of non-ferrous metals. They offer
    a wide variety of sorting so you receive what you ordered. ISO 9001 and ISO 14001
  context_quote: 'Investment Castings - Investment castings offer a near net shape casting eliminating costly machining
    and surface finishes of 100 RMS or better in a number of ferrous and non-ferrous materials. They also offer
    rapid prototype in a cast metal in a couple of weeks from your CAD drawings. We can supply your rapid prototype
    machined. ISO 9001




    Aluminum Die Casting - This American manufacturer of aluminum die casting has position itself to compete against
    off shore manufacturer by offering quick turnaround lead times, medium to high volume runs, competitive tooling
    pricing and producing high quality parts. We look forward to working with you on any new or existing projects.
    ISO 9001:2000 certified.




    Stampings - For short to medium run stampings or laser cutting up to 1/2 thick . A large range of materials;
    Stainless Steel, Aluminum, CRS and HRPO . Equipment- presses from 20 to 400 tons. Laser cutters including 2-D
    and 5 axis 3-D. Secondary operations included deburring, tapping, reaming, welding and assembly. They have in
    house engineering and tooling. ISO 9001




    Rubber Fabrication & Gaskets - With manufacturing and being a distributor of elastomeric rubber, silicone materials,
    FDA approved Buna, Cellular foam material. They offer Die Cutting Water Jet Cutting, Slitting, Extrusions, Transfer,
    Injection and Compression Molding. We can apply Pressure Sensitive Adhesives on most materials. ISO 9001'
  approx_offset: 26373
- hazard: own_name_in_subject_position
  note: THE SMOKING GUN, line 602. Ungrammatical agency shorthand puts THE AGENCY'S OWN NAME in the subject position
    of a foundry's capability sentence. Read literally, the page says Mathews & Company casts aluminium and iron
    - which it does not do and has never done. This is the single sentence in the corpus where the text itself asserts
    the wrong party, so the correct location must say third_party while the grammar says site. It sits in the middle
    of the eight anonymous principals, so there is no neighbouring name to recover from either.
  quote: Sand Castings - Mathews & Company a large range of Aluminum (319, 356 and A357), Ductile (Full range of
    ASTM A536-80) and Gray Irons (Full range of ASTM A4876) Castings. Size ranges from 1lbs to 10,000lbs in a variety
    of processes floor molding, cope & drag, semi-automatic and permanent mold. ISO 9001
  approx_offset: 25513
- hazard: third_party_first_person_pasted
  note: 'the flagship instance of the pasted-copy construction: ''We manufacture concentric and eccentric contoured
    forgings'' is ELLWOOD CITY FORGE speaking, not Mathews. This one sentence is recoverable because the firm is
    named in the same sentence - but the two sentences immediately after it are not: "We specialize in a variety
    of custom forgings including shafts, blocks, eccentrics..." and "Our metallurgical expertise allows us to..."
    carry no company name at all, and the page footer says "(c) Mathews & Company". The Sun Microstamping page repeats
    the pattern exactly at line 168.'
