notes: 'This subject exists in the corpus to test attribution, and for THIS stage that means it is almost entirely
  a whose_words instrument: the mechanical half (occurrences, spans) is easy on 61 KB, and the judgment half is
  the hardest in the corpus. The three constructions to grade, in increasing difficulty: (1) a principal named in
  the same sentence as its own "we" (recoverable); (2) a principal named only in a page heading several lines above
  the sentence (recoverable only if the clip or the model reaches the heading); (3) EIGHT principals with no name
  anywhere, one of which puts the agency''s own name in the subject position of the capability sentence (not recoverable
  - the only correct answer is third_party-unnamed). Search-stage note carried forward: no field is expected_empty
  here, because search is recall-first and scores what the TEXT NAMES.'
