subject_name: Mathews & Company
business_type: manufacturers' representative / commissioned sales agency (Kansas office est. 1962, California predecessor
  Hughson & Merton est. 1892). Owns no plant, no equipment and performs no process; it sells the output of the factories
  ('principals') that pay it commission.
