# Shared configuration for the synthesis-stage eval's mechanical battery.
# Judged-metric policy (dimensions, agent protocol) lives in TAXONOMY.md /
# RUNBOOK.md.

thresholds:
  # The synthesis stage has NEVER failed mechanically (2,133/2,133 delivered
  # on every run on record), so delivery is gated at zero tolerance: any
  # unsynthesized record, unknown answer id, or pv/header disagreement is RED.
  not_synthesized_max: 0
  unknown_answer_ids_max: 0
  # Content metrics are TRACKED, never gated per run — no synthesis A/A floor
  # has been measured yet (see born_from_baselines.noise_floor_note).
  gate_on_judged_rates: false

prices:
  # USD per million tokens, gpt-4.1 (matches the evidence folders' estimates).
  input_per_million: 2.00
  output_per_million: 8.00

# Numbers already on the record before this harness existed — the state it was
# born from. Sources: pipeline_v3_evidence/, PIPELINE_V3_PLAN.md.
born_from_baselines:
  records_per_two_subject_run: 2133         # contract_products excluded
  requests_per_two_subject_run: 95
  delivery: "2133/2133 synthesized on every run; 0 retries ever fired"
  single_entry_share: 0.70                  # 86% carry <= 2 entries
  mean_mentions_per_group: 2.27             # run 194457
  twin_groups_share: 0.15                   # 51% of twins diverge downstream
  identical_synthesis_clusters: 17          # 34 records, 1.2% (run 194457)
  fe_de_swap_rate: "1 of 6 renderings (194457); 2 of 5 fresh syntheses historically"
  own_name_record_rate: 1.00                # identification counter, NOT a defect
  stage_cost_usd_two_subjects: 2.42
  noise_floor_note: >
    Grounding A/A is 81.0%/86.7% (13-19% row-level divergence on byte-identical
    input). Synthesis's OWN A/A floor has never been measured; until it is,
    treat deltas below ~15% relative as unreadable.

first_judgment_pass:
  run_id: "20260825T194457"
  judged: 546
  judgeable: 2133
  note: >
    Stopped by the account's monthly spend limit, not by any harness fault.
    Coverage split and resume instructions are in README.md's STATE block.
