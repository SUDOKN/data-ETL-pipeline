- id: AG-P9
  status: active
  added: '2026-09-12'
  motivated_by: run 20260911T223222 — a hedged claim kept mid-paragraph and restated as unconditional
    by the closing sentence ('either one of ISO9001:2000, QS9000, TS16949, ISO13485 or AS9100' → 'its
    plants hold AS9100'; 'CE or UL mark' → 'have the UL mark')
  target: groups g73kcrqw, g28grxd9, gpw4cs40, g4u9ya1y (the factory-certification disjunction) and gpko7jnz
    (UL mark)
  expectation: A disjunction or quantifier survives to the end of the paragraph; a closing sentence that
    restates it as a definite claim is J1+J6 (minor unless the wrong certification is minted). The formulaic
