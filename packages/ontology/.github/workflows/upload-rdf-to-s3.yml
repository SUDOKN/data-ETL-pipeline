name: Upload SUDOKN RDF to S3

on:
  workflow_run:
    workflows:
      - Validate SUDOKN RDF
    branches:
      - main
    types:
      - completed

jobs:
  upload:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload RDF to S3
        run: |
          aws s3 cp SUDOKN1.1/SUDOKN1_1.rdf \
            s3://sudokn-ontology/SUDOKN.rdf

      - name: Tag RDF after upload
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # take only the first line of commit message, fallback for manual trigger
          SAFE_MSG=$(printf '%s' "$COMMIT_MSG" | head -n1)
          SAFE_MSG=${SAFE_MSG:-"manual_run"}

          # Sanitize for S3 tag value: remove newlines, keep safe chars, truncate to 256
          ENCODED_MSG=$(echo "$SAFE_MSG" | tr -d '\n\r' | tr -cd '[:alnum:]-_ .,:/@' | cut -c1-256)

          echo "Applying tags: commit_sha=${COMMIT_SHA}, commit_message=${ENCODED_MSG}"

          aws s3api put-object-tagging \
            --bucket sudokn-ontology \
            --key SUDOKN.rdf \
            --tagging "TagSet=[{Key=commit_sha,Value=${COMMIT_SHA}},{Key=commit_message,Value=${ENCODED_MSG}}]"

      - name: Verify tags (debugging)
        run: |
          aws s3api get-object-tagging \
            --bucket sudokn-ontology \
            --key SUDOKN.rdf
