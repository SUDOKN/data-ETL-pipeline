name: Validate SUDOKN RDF

on:
  push:
    branches:
      - '**'
    paths:
      - 'SUDOKN1.1/SUDOKN1_1.rdf'

  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate RDF and open issue on failure
        uses: actions/github-script@v7
        env:
          DATAETL_API_URL: ${{ secrets.DATAETL_API_URL }}
        with:
          script: |
            const fs = require('fs');

            const filePath = 'SUDOKN1.1/SUDOKN1_1.rdf';
            const apiUrl = process.env.DATAETL_API_URL;

            if (!apiUrl) {
              core.setFailed('Missing DATAETL_API_URL secret. Add it in repository settings before running validation.');
              return;
            }

            const fileBuffer = fs.readFileSync(filePath);
            const formData = new FormData();
            formData.append(
              'file',
              new Blob([fileBuffer], { type: 'application/rdf+xml' }),
              'SUDOKN1_1.rdf'
            );

            const response = await fetch(new URL('/rdf/validate', apiUrl), {
              method: 'POST',
              headers: {
                accept: 'application/json',
              },
              body: formData,
            });

            const responseText = await response.text();
            let result = null;
            try {
              result = JSON.parse(responseText);
            } catch (error) {
              result = {
                valid: false,
                issues: [
                  {
                    type: 'invalid_json_response',
                    message: responseText || 'Validation API returned a non-JSON response.',
                  },
                ],
              };
            }

            core.info(`Validation API HTTP status: ${response.status}`);
            core.info(`Validation API response: ${JSON.stringify(result)}`);

            const issues = Array.isArray(result.issues) ? result.issues : [];
            const isValid = response.ok && result.valid === true && issues.length === 0;

            if (isValid) {
              core.info('RDF validation passed.');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.slice(0, 7);
            const title = `RDF validation failed on ${branch} @ ${sha}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The RDF validation route rejected ${filePath}.`,
              '',
              `Branch: ${branch}`,
              `Commit: ${context.sha}`,
              `Workflow run: ${runUrl}`,
              '',
              'Validation response:',
              '```json',
              JSON.stringify(result, null, 2),
              '```',
              '',
              'Fix the RDF issues and re-run validation before pushing to S3.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info(`Created issue: ${title}`);

            const firstIssue = issues[0]?.message || `Validation API returned HTTP ${response.status}.`;
            core.setFailed(`RDF validation failed for ${filePath}. ${firstIssue}`);