# core/pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pure_utils"                                                                          # the name your team will pip-install
version = "0.1.0"
description = "Dependency-light utility functions (time, URL, dict diff) shared across apps"
requires-python = ">=3.12"

# pure_utils is a leaf package: it must not depend on any other package in this repo.
dependencies = ["requests>=2.31.0", "tldextract>=3.4.0", "python-dotenv>=1.1.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=3.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Set line length
line-length = 100

# Exclude directories
exclude = [".git", "__pycache__", ".venv", "venv", ".pytest_cache"]

[tool.ruff.lint]
# Enable specific rules
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "B",      # flake8-bugbear (includes B006)
  "RUF012", # Mutable class attributes should be annotated with `ClassVar`
]

# Ignore specific rules if needed
ignore = []
