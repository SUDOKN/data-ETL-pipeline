# core/pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra"                                                                        # the name your team will pip-install
version = "0.1.0"
description = "Infrastructure clients (MongoDB, GraphDB, S3, SQS) shared across apps"
requires-python = ">=3.12"

dependencies = [
  "pydantic>=2.10.0",         # Data validation
  "pydantic_settings>=1.0.0", # For settings management
  "typing_extensions>=4.0.0", # For type hints in Python 3.9+

  "beanie>=2.0.0,<3.0.0", # ODM for MongoDB (2.x line)
  "pymongo>=4.5,<5.0",    # AsyncMongoClient is here
  "httpx>=0.27.0",        # GraphDB client

  "aiobotocore[boto3]>=2.0.0",
  "types-aiobotocore-s3>=2.0.0",
  "types-aiobotocore-sqs>=2.0.0",
  "types-aiobotocore-ses>=2.0.0",
  "tldextract>=3.4.0",            # For extracting domain names
  "litellm>=1.0.0",               # Token-aware model metadata used by scraped_text_file model

  "core>=0.1.0",
  "llm_providers>=0.1.0",
  "pure_utils>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=3.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Set line length
line-length = 100

# Exclude directories
exclude = [".git", "__pycache__", ".venv", "venv", ".pytest_cache"]

[tool.ruff.lint]
# Enable specific rules
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "B",      # flake8-bugbear (includes B006)
  "RUF012", # Mutable class attributes should be annotated with `ClassVar`
]

# Ignore specific rules if needed
ignore = []
