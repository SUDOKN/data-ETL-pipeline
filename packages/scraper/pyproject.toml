# scraper/pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper"                                                     # the name your team will pip-install
version = "0.1.0"
description = "Web scraping drivers and services shared across apps"
readme = "ABOUT.md"                                                  # or point to a common README if you like
requires-python = ">=3.12"

# Any dependencies that your common code needs:
dependencies = [
  "playwright>=1.40.0", # For web scraping
  "selenium >=4.20.0",  # For web scraping with Selenium
  "litellm>=0.1.0",     # For LLM integration

  "core>=0.1.0",
  # ^ This means: “install core from that path as version 0.1.0”

]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=3.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
