[pytest]
# Root config for the whole monorepo. Kept as pytest.ini rather than a root
# pyproject.toml so nothing mistakes the repo root for an installable package.
testpaths = packages apps
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    -m "not integration"
markers =
    integration: needs live external services (AWS, Google Maps, real Chrome, network). Deselected by default; run with `-m integration`.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
